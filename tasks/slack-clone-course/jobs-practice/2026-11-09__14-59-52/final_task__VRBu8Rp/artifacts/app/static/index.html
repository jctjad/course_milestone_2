<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 13px;cursor:pointer}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}label{display:block;margin:10px 0}.app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:24px;overflow:auto}.thread{width:320px;border-left:1px solid #ddd;padding:15px}.channel-entry{display:block;width:100%;background:none;color:white;text-align:left;padding:8px}.channel-entry:hover{background:#611f69}.message{padding:12px;border-bottom:1px solid #eee}.toolbar{display:flex;gap:8px;margin:10px 0}.muted{color:#777}.auth{max-width:420px;margin:80px auto;padding:25px;box-shadow:0 2px 12px #bbb}.message-avatar{display:inline-flex}.message-toolbar{display:flex;gap:4px;margin-top:5px}.message-toolbar button{padding:4px 7px}.modal{padding:15px;border:1px solid #aaa;background:#fff}.error{color:#b00020;margin:8px 0}
</style></head><body>
<div id="auth-modal" class="auth"><form id="auth-form" data-testid="auth-form" data-mode="signup"><h1>Huddle</h1><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><label id="display-label">Display name<input name="display_name"></label><div id="auth-error" data-testid="auth-error" class="error" hidden></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button> <button type="button" id="auth-toggle" data-testid="auth-toggle">Have an account? Log in</button></form></div>
<div class="app" hidden><aside class="sidebar" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><div class="toolbar"><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></div><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button><form id="workspace-create-form" data-testid="workspace-create-form" hidden><label>Workspace slug<input name="slug" required></label><label>Workspace name<input name="name" required></label><button id="workspace-create-submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form" hidden><input name="code" placeholder="Invitation code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form></aside>
<main class="main"><div class="toolbar"><strong id="channel-title" data-testid="channel-title"># general</strong><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div><div id="message-list" data-testid="message-list"><div class="muted" data-testid="channel-empty-state">No messages yet. Start the conversation.</div></div><form id="message-form"><input id="message-input" data-testid="message-input" name="body" placeholder="Message #general"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><form><input id="thread-input" data-testid="thread-input" placeholder="Reply in thread"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button type="button" id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></form></aside></div>
<div id="create-channel-modal" class="modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><label>Channel name<input name="name" required></label><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div id="create-channel-error" data-testid="create-channel-error" class="error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal" hidden><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"><span data-testid="invitation-code"></span></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
const $=s=>document.querySelector(s), api=async(path,opt={})=>{opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});let t=localStorage.getItem('huddle.token');if(t)opt.headers.Authorization='Bearer '+t;let r=await fetch('/api'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||('Request failed '+r.status)),{status:r.status});return d};
let me=null,ws=null,ch=null,msgs=[];
function showApp(){ $('#auth-modal').hidden=true;$('.app').hidden=false;$('#current-user').textContent=me.display_name||me.username; }
function norm(n){return n.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/^-|-$/g,'')}
async function load(){let x=await api('/workspaces');if(!x.workspaces.length){$('#workspace-create-form').hidden=false;$('#empty-state-create-workspace').hidden=false;return}ws=x.workspaces[0];$('#workspace-header').textContent=ws.name;let d=await api('/workspaces/'+ws.slug);renderChannels(d.channels);if(d.channels[0])selectChannel(d.channels[0])}
function renderChannels(cs){$('#channel-list').innerHTML='';cs.forEach(x=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=x.id;b.dataset.channelName=x.name;b.textContent='# '+x.name;b.onclick=()=>selectChannel(x);$('#channel-list').append(b)})}
async function selectChannel(x){ch=x;$('#channel-title').textContent='# '+x.name;$('#channel-topic').textContent=x.topic||'';let d=await api('/channels/'+x.id+'/messages');msgs=d.messages||[];renderMessages()}
function renderMessages(){let box=$('#message-list');box.innerHTML='';if(!msgs.length){box.innerHTML='<div class="muted" data-testid="channel-empty-state">No messages yet. Start the conversation.</div>';return}msgs.slice().reverse().forEach(renderMessage)}
function renderMessage(m){let e=document.createElement('div');e.className='message';e.dataset.testid='message';e.dataset.messageId=m.id;let tm=new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});e.innerHTML='<span data-testid="message-avatar" style="display:inline-flex;width:28px;height:28px;border-radius:50%;background:#36c;color:#fff;align-items:center;justify-content:center">'+(m.author.display_name||m.author.username).charAt(0)+'</span> <b data-testid="message-author"></b> <span data-testid="message-time" class="muted"></span><div data-testid="message-body"></div><span data-testid="thread-reply-count"></span><div class="reaction-list"></div><div class="message-toolbar"><button type="button" data-testid="message-edit-btn">Edit</button><button type="button" data-testid="message-delete-btn">Delete</button><button type="button" data-testid="reaction-button" aria-label="Add reaction">☺</button><button type="button" data-testid="open-thread-btn">Thread</button></div>';e.querySelector('[data-testid=message-author]').textContent=m.author.display_name;e.querySelector('[data-testid=message-time]').textContent=tm;e.querySelector('[data-testid=message-body]').textContent=m.body;let rc=e.querySelector('[data-testid=thread-reply-count]');if(m.reply_count)rc.textContent=m.reply_count+' '+(m.reply_count===1?'reply':'replies');(m.reactions||[]).forEach(r=>{let z=document.createElement('span');z.dataset.testid='reaction-chip';z.textContent=r.emoji+' '+r.count;e.querySelector('.reaction-list').append(z)});e.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async ev=>{if(ev.key==='Enter'){let d=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});msgs=msgs.map(q=>q.id==m.id?d.message:q);renderMessages()}if(ev.key==='Escape')renderMessages()}};e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});msgs=msgs.filter(q=>q.id!=m.id);renderMessages()};e.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{let d=await api('/messages/'+m.id+'/replies');$('#thread-panel').hidden=false;$('#thread-panel').dataset.parentId=m.id;$('#thread-messages').innerHTML=(d.replies||[]).map(q=>'<div class="message" data-testid="message" data-message-id="'+q.id+'"><b data-testid="message-author">'+q.author.display_name+'</b><div data-testid="message-body">'+q.body+'</div></div>').join('')};e.querySelector('[data-testid=reaction-button]').onclick=()=>{let picker=document.createElement('div');picker.dataset.testid='emoji-picker';picker.style.display='grid';picker.style.gridTemplateColumns='repeat(4,40px)';['😀','👍','❤️','🎉','😂','🚀','✅','🔥'].forEach(em=>{let b=document.createElement('button');b.type='button';b.dataset.testid='emoji-option';b.textContent=em;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:em})});let d=await api('/channels/'+ch.id+'/messages');msgs=d.messages||[];renderMessages()};picker.append(b)});e.querySelector('.message-toolbar').append(picker)};$('#message-list').append(e)}
$('#thread-send').onclick=async e=>{e.preventDefault();let i=$('#thread-input'),parent=$('#thread-panel').dataset.parentId;if(!i.value.trim()||!parent)return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:Number(parent)})});i.value='';let d=await api('/channels/'+ch.id+'/messages');msgs=d.messages||[];renderMessages();let r=await api('/messages/'+parent+'/replies');$('#thread-messages').innerHTML=(r.replies||[]).map(q=>'<div class="message" data-testid="message" data-message-id="'+q.id+'"><b data-testid="message-author">'+q.author.display_name+'</b><div data-testid="message-body">'+q.body+'</div></div>').join('')}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData($('#auth-form')),mode=$('#auth-form').dataset.mode;try{let d=await fetch('/api/auth/'+(mode==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))}),j=await d.json();if(!d.ok){let message=(mode==='signup'&&(!j.error||j.error==='invalid'))?'Password must be at least 8 characters':(j.error==='invalid'?'Username or password is incorrect':'Please check your details');throw Error(message)}localStorage.setItem('huddle.token',j.token);me=j.user;showApp();await load()}catch(x){$('#auth-error').hidden=false;$('#auth-error').textContent=x.message}}
$('#auth-toggle').onclick=()=>{let f=$('#auth-form'),sign=f.dataset.mode==='signup';f.dataset.mode=sign?'login':'signup';$('#auth-submit').textContent=sign?'Log in':'Sign up';$('#auth-toggle').textContent=sign?'Need an account? Sign up':'Have an account? Log in';$('#display-label').hidden=sign}
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});ws=d.workspace;$('#workspace-create-form').hidden=true;$('#empty-state-create-workspace').hidden=true;$('#workspace-header').textContent=ws.name;renderChannels([d.general_channel]);selectChannel(d.general_channel)}catch(x){alertError(x.message)}}
$('#empty-state-create-workspace').onclick=()=>{$('#workspace-create-form').hidden=false}
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').hidden=false;$('#create-channel-cancel').onclick=()=>$('#create-channel-modal').hidden=true
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=norm(f.get('name'));try{let d=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name,is_private:$('#create-channel-private').checked})});$('#create-channel-modal').hidden=true;let dws=await api('/workspaces/'+ws.slug);renderChannels(dws.channels);selectChannel(d.channel)}catch(x){$('#create-channel-error').textContent=x.status===409?'A channel with that name already exists':x.message}}
$('#message-form').onsubmit=async e=>{e.preventDefault();let i=$('#message-input');if(!i.value.trim())return;let d=await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});msgs.unshift(d.message);i.value='';renderMessages()}
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()}
$('#close-thread').onclick=()=>$('#thread-panel').hidden=true;$('#channel-settings-close').onclick=()=>$('#channel-settings-modal').hidden=true;$('#channel-settings-btn').onclick=()=>$('#channel-settings-modal').hidden=false
function alertError(x){let e=$('#create-channel-error');e.textContent=x;e.hidden=false}
(async()=>{let t=localStorage.getItem('huddle.token');if(t)try{let d=await api('/auth/me');me=d.user;showApp();await load()}catch(e){localStorage.removeItem('huddle.token')}})()
</script></body></html>
