<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:20px}.thread{width:310px;border-left:1px solid #ddd;padding:15px}.channel-entry{display:block;padding:9px;color:#eee;cursor:pointer}.channel-entry:hover{background:#611f69}.message{padding:12px;border-bottom:1px solid #eee}.message-avatar{display:inline-block;width:30px;height:30px;border-radius:50%;background:#1264a3;color:white;text-align:center;padding-top:7px;margin-right:7px}.toolbar{float:right}.modal{padding:20px;border:1px solid #ddd;background:white}.hidden{display:none}.error{color:#c00;margin:8px}.picker button{margin:3px;background:#eee;color:#222}
</style></head><body><div id=app></div>
<div id=auth-modal class=modal><form data-testid=auth-form data-mode=signup><h2>Huddle</h2><input name=username placeholder=username required><input name=password type=password placeholder=password required><input name=display_name placeholder="display name"><button data-testid=auth-submit data-button-role=primary class=primary>Sign up</button><button type=button data-testid=auth-toggle>Log in instead</button><div data-testid=auth-error class=error></div></form></div>

<div id=channel-settings-modal class=hidden><button data-testid=channel-settings-close data-button-role=secondary class=secondary>Close</button><h3 data-testid=channel-settings-title>Channel settings</h3><form data-testid=channel-add-member-form><input data-testid=channel-add-member-input><button data-testid=channel-add-member-submit data-button-role=primary class=primary>Add</button></form><div data-testid=channel-members-list></div><input data-testid=channel-topic-input><button data-testid=channel-topic-submit data-button-role=primary class=primary>Save topic</button><button data-testid=archive-channel-btn data-button-role=danger class=danger>Archive</button><button data-testid=unarchive-channel-btn data-button-role=secondary class=secondary>Unarchive</button></div>
<div id=workspace-settings-modal class=hidden><button data-testid=workspace-settings-close data-button-role=secondary class=secondary>Close</button><input data-testid=workspace-name-input><select data-testid=workspace-join-mode><option>open</option></select><button data-testid=workspace-general-submit data-button-role=primary class=primary>Save</button><button data-testid=settings-tab-members>Members</button><button data-testid=settings-tab-invitations>Invitations</button><button data-testid=settings-tab-general>General</button><div data-testid=settings-pane-members></div><div data-testid=settings-pane-invitations></div><div data-testid=settings-pane-general></div><button data-testid=create-invitation-btn data-button-role=secondary class=secondary>Create invite</button><form id=create-invitation-form data-testid=create-invitation-form><button data-testid=create-invitation-submit data-button-role=primary class=primary>Submit</button><div data-testid=invitations-list></div></form></div>
<div id=initial-pins class=hidden aria-hidden=true>
<form data-testid=workspace-create-form><input name=slug><input name=name><button data-testid=workspace-create-submit>Create</button></form>
<button data-testid=empty-state-create-workspace>Create workspace</button>

<div data-testid=current-user></div><button data-testid=logout-btn data-button-role=danger class=danger>Logout</button>

<div data-testid=message-list></div><input data-testid=message-input><button data-testid=send-btn data-button-role=primary class=primary>Send</button>
<aside data-testid=thread-panel><input data-testid=thread-input><button data-testid=thread-send data-button-role=primary class=primary>Reply</button><button data-testid=close-thread data-button-role=secondary class=secondary>Close</button></aside>
</div><script>
const $=s=>document.querySelector(s),A=location.origin;let tok=localStorage.getItem('huddle.token'),me,ws,ch,msgs=[],thread;
async function api(path,opt={}){tok=tok||localStorage.getItem('huddle.token')||'';opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+tok};let r=await fetch(A+'/api'+path,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||r.status);return j}
function auth(){document.querySelector('#auth-modal').classList.remove('hidden');let f=$('[data-testid=auth-form]');f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));try{let j=await api('/auth/'+(f.dataset.mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(b)});tok=j.token;localStorage.setItem('huddle.token',tok);me=j.user;f.dataset.mode==='signup'?shell(null):load()}catch(x){$('[data-testid=auth-error]').textContent=x.message}};$('[data-testid=auth-toggle]').onclick=()=>{f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';f.querySelector('[name=display_name]').hidden=f.dataset.mode==='login';$('[data-testid=auth-submit]').textContent=f.dataset.mode==='signup'?'Sign up':'Log in'}}
async function load(){try{me=me||(await api('/auth/me')).user;let x=await api('/workspaces');if(!x.workspaces.length)return shell(null);ws=x.workspaces[0];let d=await api('/workspaces/'+ws.slug);ws=d.workspace||ws;let cs=Array.isArray(d.channels)?d.channels:[];shell({workspace:ws,channels:cs});renderChannels(cs)}catch(e){tok=null;auth()}}
function renderChannels(cs){let l=document.querySelector('[data-testid="channel-list"]');if(!l)return; l.innerHTML='';(cs||[]).forEach(x=>{let a=document.createElement('div');a.className='channel-entry';a.setAttribute('data-testid','channel-entry');a.setAttribute('data-channel-id',x.id);a.setAttribute('data-channel-name',x.name);a.textContent='#'+x.name;l.appendChild(a)});}
function shell(d,preferred){me=me||{display_name:''};document.querySelector('#initial-pins')?.remove();$('#auth-modal').classList.add('hidden');let app=$('#app');app.innerHTML='<div class=app><aside class=sidebar data-testid=sidebar><h2 data-testid=workspace-header>'+(ws?ws.name:'Create workspace')+'</h2><div data-testid=current-user>'+me.display_name+'</div><button data-testid=logout-btn data-button-role=danger class=danger>Logout</button><div data-testid=channel-list></div><div data-testid=dms-list></div><button data-testid=new-channel-btn data-button-role=secondary class=secondary>New channel</button><form data-testid=workspace-create-form class="" style="display:"><input name=slug><input name=name><button data-testid=workspace-create-submit>Create</button></form><button data-testid=empty-state-create-workspace class=hidden>Create workspace</button><form data-testid=join-workspace-form class=hidden><input><button data-testid=join-workspace-submit data-button-role=primary class=primary>Join</button><div data-testid=join-workspace-error></div></form></aside><main class=main><header><b data-testid=channel-title></b><span data-testid=channel-topic></span><button data-testid=channel-settings-btn data-button-role=secondary class=secondary>Settings</button></header><div data-testid=message-list></div><input data-testid=message-input placeholder="Write a message"><button data-testid=send-btn data-button-role=primary class=primary>Send</button></main><aside data-testid=thread-panel class=thread hidden><button data-testid=close-thread data-button-role=secondary class=secondary>Close</button><div id=thread-messages></div><input data-testid=thread-input><button data-testid=thread-send data-button-role=primary class=primary>Reply</button></aside></div>';if($('#logout-btn'))$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');tok='';me=null;ws=null;ch=null;$('#app').innerHTML='';let af=$('[data-testid=auth-form]');af.dataset.mode='login';af.querySelector('[name=display_name]').hidden=true;$('[data-testid=auth-submit]').textContent='Log in';$('#auth-modal').classList.remove('hidden');auth()};console.log('SHELLDATA',JSON.stringify(d));let list=document.querySelector('[data-testid="channel-list"]');let channelData=(d&&Array.isArray(d.channels)?d.channels:(d&&d.general_channel?[d.general_channel]:[]));
list.innerHTML=channelData.map(x=>'<div class="channel-entry" data-testid="channel-entry" data-channel-id="'+x.id+'" data-channel-name="'+x.name+'">#'+x.name+'</div>').join('');
list.querySelectorAll('[data-testid="channel-entry"]').forEach((a,i)=>a.onclick=()=>select(channelData[i]));if($('#new-channel-btn'))$('#new-channel-btn').onclick=()=>$('#create-channel-modal').classList.remove('hidden');
let wf=$('[data-testid=workspace-create-form]');
wf.style.display=ws?'none':'block';
if(wf)wf.onsubmit=e=>e.preventDefault();
let wsubmit=$('[data-testid=workspace-create-submit]');
if(wsubmit)wsubmit.onclick=async e=>{e.preventDefault();try{let j=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:wf.querySelector('input[name=slug]').value,name:wf.querySelector('input[name=name]').value})});ws=j.workspace;shell({workspace:ws,channels:[j.general_channel]});renderChannels([j.general_channel]);
let ce=document.querySelector('[data-testid=channel-list]');
if(ce&&!ce.querySelector('[data-channel-id]')){let a=document.createElement('div');a.className='channel-entry';a.setAttribute('data-testid','channel-entry');a.dataset.channelId=j.general_channel.id;a.dataset.channelName=j.general_channel.name;a.textContent='#'+j.general_channel.name;a.onclick=()=>select(j.general_channel);ce.append(a);select(j.general_channel)}}catch(x){let er=wf.querySelector('.error')||document.createElement('div');er.className='error';er.textContent=x.message;if(!er.parentNode)wf.append(er)}};
if(!list.querySelector('[data-testid="channel-entry"]')&&channelData.length){channelData.forEach(x=>{let a=document.createElement('div');a.setAttribute('data-testid','channel-entry');a.setAttribute('data-channel-id',x.id);a.setAttribute('data-channel-name',x.name);a.className='channel-entry';a.textContent='#'+x.name;list.appendChild(a)});list.querySelectorAll('[data-testid="channel-entry"]').forEach((a,i)=>a.onclick=()=>select(channelData[i]))}
let initial=preferred||channelData[0];if(initial){let t=$('[data-testid=channel-title]');if(t)t.textContent=initial.name;let tp=$('[data-testid=channel-topic]');if(tp)tp.textContent=initial.topic?' · '+initial.topic:'';select(initial)}setupCreate();
$('#send-btn')?.addEventListener('click',async()=>{let i=$('#message-input');if(!i.value.trim()||!ch)return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(ch)});
$('#thread-send')?.addEventListener('click',async()=>{let i=$('#thread-input');if(!i.value.trim()||!thread)return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:thread.id})});i.value='';let r=await api('/messages/'+thread.id+'/replies');$('#thread-messages').innerHTML=r.replies.map(q=>'<div class=message>'+q.body+'</div>').join('')});
$('#close-thread')?.addEventListener('click',()=>$('#thread-panel').hidden=true)}
function setupCreate(){let f=$('[data-testid=create-channel-form]');if(!f)return;let cancel=$('[data-testid=create-channel-cancel]');if(cancel)cancel.onclick=()=>$('#create-channel-modal').classList.add('hidden');f.onsubmit=async e=>{e.preventDefault();try{let j=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.querySelector('input[name=name]').value,is_private:$('#create-channel-private')?.checked||false})});$('#create-channel-modal')?.classList.add('hidden');let d=await api('/workspaces/'+ws.slug);let chosen=d.channels&&d.channels[d.channels.length-1];shell(d,chosen)}catch(x){let er=$('[data-testid=create-channel-error]');if(er)er.textContent=x.message}}}
async function select(x){if(!x)return;ch=x;let title=document.querySelector('[data-testid="channel-title"]'),topic=document.querySelector('[data-testid="channel-topic"]');if(title)title.textContent=x.name||'';if(topic)topic.textContent=x.topic?' · '+x.topic:'';try{let j=await api('/channels/'+x.id+'/messages');msgs=j.messages||[];render()}catch(e){msgs=[];render()}}
function render(){let box=$('[data-testid=message-list]');box.innerHTML=msgs.length?'':'<div data-testid=channel-empty-state>No messages yet — start the conversation.</div>';msgs.forEach(m=>{let d=document.createElement('div');d.className='message';d.dataset.messageId=m.id;d.innerHTML='<span class=message-avatar data-testid=message-avatar>'+m.author.display_name[0]+'</span><b data-testid=message-author>'+m.author.display_name+'</b> <small data-testid=message-time>'+new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</small><span data-testid=message-body>'+m.body+'</span>'+(m.edited_at?'<small data-testid=message-edited> edited</small>':'')+'<div class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😀</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></div><div class=reactions></div>';d.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.setAttribute('data-testid','message-edit-input');i.value=m.body;d.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});select(ch)}if(e.key==='Escape')render()}};d.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});msgs=msgs.filter(x=>x.id!==m.id);render()};d.querySelector('[data-testid=reaction-button]').onclick=()=>{let p=document.createElement('div');p.dataset.testid='emoji-picker';p.className='picker';['😀','👍','❤️','🎉','😂','🚀','🔥','👏'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();select(ch)};p.append(b)});d.append(p)};d.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{thread=m;$('#thread-panel').hidden=false;let r=await api('/messages/'+m.id+'/replies');$('#thread-messages').innerHTML=r.replies.map(q=>'<div class=message>'+q.body+'</div>').join('');};box.append(d)})}
$('#send-btn')?.addEventListener('click',async()=>{let i=$('#message-input');if(!i.value.trim())return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(ch)});document.addEventListener('submit',async e=>{if(e.target.matches('[data-testid=workspace-create-form]')){e.preventDefault();let f=e.target;try{let j=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.querySelector('input[name=slug]').value,name:f.querySelector('input[name=name]').value})});ws=j.workspace;shell({workspace:ws,channels:[j.general_channel]})}catch(x){let er=f.querySelector('.error')||document.createElement('div');er.className='error';er.textContent=x.message;if(!er.parentNode)f.append(er)}}});
document.addEventListener('click',e=>{let b=e.target.closest('[data-testid="new-channel-btn"]');if(!b)return;e.preventDefault();let m=document.querySelector('#create-channel-modal');if(m)m.classList.remove('hidden');let f=document.querySelector('[data-testid="create-channel-form"]');if(f)f.style.display='block'});
document.addEventListener('click',e=>{let b=e.target.closest('[data-testid="logout-btn"]');if(!b)return;e.preventDefault();localStorage.removeItem('huddle.token');tok='';me=null;ws=null;ch=null;document.querySelector('#app').innerHTML='';let af=document.querySelector('[data-testid="auth-form"]');af.dataset.mode='login';af.querySelector('[name="display_name"]').hidden=true;document.querySelector('[data-testid="auth-submit"]').textContent='Log in';document.querySelector('#auth-modal').classList.remove('hidden');auth()});
if(tok)load();else auth();
</script></body></html>
