<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}input{padding:10px;border:1px solid #bbb;border-radius:4px}.app{display:flex;height:100vh}.side{width:250px;background:#25364a;color:white;padding:20px}.main{flex:1;padding:24px}.thread{width:320px;border-left:1px solid #ddd;padding:20px}.hidden{display:none}.msg{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-flex;background:#1264a3;color:#fff;width:28px;height:28px;align-items:center;justify-content:center;border-radius:4px;margin-right:8px}.toolbar{display:inline;margin-left:15px}.toolbar button{padding:3px;background:#eee;color:#222}.err{color:#c00;margin:8px 0}.channel{display:block;color:white;padding:8px;text-align:left;width:100%;background:none}.empty{padding:40px;color:#777}
</style></head><body><div id=auth-modal><form data-testid=auth-form data-mode=signup><h1>Huddle</h1><label>Username <input name=username></label><br><label>Password <input name=password type=password></label><br><label class=signup>Display name <input name=display_name></label><p class=err data-testid=auth-error></p><button data-testid=auth-submit data-button-role=primary>Sign up</button> <button type=button data-testid=auth-toggle>Have an account? Log in</button></form></div>
<div class=app hidden><aside class=side data-testid=sidebar><h2 data-testid=workspace-header></h2><div data-testid=current-user></div><button data-testid=logout-btn data-button-role=danger>Log out</button><h3>Channels</h3><div data-testid=channel-list></div><div data-testid=dms-list></div><button data-testid=new-channel-btn data-button-role=secondary>New channel</button><form data-testid=workspace-create-form hidden><div data-testid=empty-state-create-workspace>Create your first workspace</div><input name=slug placeholder=Workspace slug><input name=name placeholder=Workspace name><button data-testid=workspace-create-submit data-button-role=primary>Create workspace</button></form><form data-testid=join-workspace-form hidden><button data-testid=join-workspace-submit data-button-role=primary>Join</button></form></aside><main class=main><header><span data-testid=channel-title>#general</span> <span data-testid=channel-topic></span><button data-testid=channel-settings-btn data-button-role=secondary>Settings</button></header><section data-testid=message-list><div data-testid=channel-empty-state class=empty>No messages yet — start the conversation.</div></section><label>Message <input data-testid=message-input placeholder="Message #general"></label><button data-testid=send-btn data-button-role=primary>Send</button><form data-testid=create-channel-form hidden><input name=name placeholder="Channel name"><input type=checkbox data-testid=create-channel-private><p data-testid=create-channel-error class=err></p><button data-testid=create-channel-submit data-button-role=primary>Create channel</button><button type=button data-testid=create-channel-cancel data-button-role=secondary>Cancel</button></form></main><aside data-testid=thread-panel class=thread hidden><button data-testid=close-thread data-button-role=secondary>Close thread</button><div id=threads></div><input data-testid=thread-input placeholder="Reply"><button data-testid=thread-send data-button-role=primary>Reply</button></aside></div>
<div id=create-channel-modal hidden></div><div id=channel-settings-modal hidden><input data-testid=channel-topic-input><button data-testid=channel-topic-submit data-button-role=primary>Save topic</button><h3 data-testid=channel-settings-title>Channel settings</h3><button data-testid=channel-settings-close data-button-role=secondary>Close</button><div data-testid=channel-members-list></div><form data-testid=channel-add-member-form><input data-testid=channel-add-member-input><button data-testid=channel-add-member-submit data-button-role=primary>Add</button></form><button data-testid=archive-channel-btn data-button-role=danger>Archive</button><button data-testid=unarchive-channel-btn data-button-role=secondary>Unarchive</button></div><div id=workspace-settings-modal hidden><button data-testid=workspace-settings-close data-button-role=secondary>Close</button><input data-testid=workspace-name-input><select data-testid=workspace-join-mode></select><button data-testid=workspace-general-submit data-button-role=primary>Save</button><button data-testid=workspace-settings-btn data-button-role=secondary>Workspace settings</button><button data-testid=settings-tab-members>Members</button><button data-testid=settings-tab-invitations>Invitations</button><button data-testid=settings-tab-general>General</button><div data-testid=settings-pane-members></div><div data-testid=settings-pane-invitations></div><div data-testid=settings-pane-general></div><button data-testid=create-invitation-btn data-button-role=secondary>Create invitation</button><form id=create-invitation-form data-testid=create-invitation-form><button data-testid=create-invitation-submit data-button-role=primary>Create</button></form><div data-testid=invitations-list></div></div>
<script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{o.headers={'Content-Type':'application/json','Authorization':token?'Bearer '+token:'',...(o.headers||{})};let r=await fetch('/api'+p,o);let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j};
let token=localStorage.getItem('huddle.token'),me,ws,ch,mode='signup';
function showApp(){ $('#auth-modal').hidden=true;$('.app').hidden=false;$('[data-testid=current-user]').textContent=me.display_name||me.username;load()}
async function load(){let x=await api('/workspaces');if(!x.workspaces.length){$('[data-testid=workspace-create-form]').hidden=false;return}ws=x.workspaces[0];$('[data-testid=workspace-header]').textContent=ws.name;let d=await api('/workspaces/'+ws.slug);renderChannels(d.channels);select(d.channels[0])}
function renderChannels(cs){$('[data-testid=channel-list]').innerHTML=cs.map(c=>`<button class=channel data-testid=channel-entry data-channel-id=${c.id} data-channel-name=${c.name} data-channel-topic="${c.topic||''}">#${c.name}</button>`).join('');document.querySelectorAll('.channel').forEach(x=>x.onclick=()=>select({id:x.dataset.channelId,name:x.dataset.channelName,topic:x.dataset.channelTopic}))}
async function select(x){ch=x.id;$('[data-testid=channel-title]').textContent='#'+x.name;$('[data-testid=channel-topic]').textContent=x.topic||'';let d=await api('/channels/'+ch+'/messages');$('[data-testid=message-list]').innerHTML=d.messages.length?d.messages.map(render).join(''):'<div data-testid=channel-empty-state class=empty>No messages yet — start the conversation.</div>'}
function render(m){return `<div class=msg data-testid=message data-message-id=${m.id}><span class=avatar data-testid=message-avatar>${m.author.display_name[0]}</span><b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString()}</small><div data-testid=message-body>${m.body}</div>${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} ${m.reply_count==1?'reply':'replies'}</span>`:''}${m.edited_at?'<span data-testid=message-edited>(edited)</span>':''}<span class=toolbar><button data-testid=open-thread-btn onclick="thread(${m.id})">Thread</button><button data-testid=reaction-button onclick="react(${m.id})">😀</button><button data-testid=message-edit-btn onclick="edit(${m.id},this)">Edit</button><button data-testid=message-delete-btn onclick="del(${m.id})">Delete</button></span></div>`}
async function refresh(){await select({id:ch,name:$('[data-testid=channel-title]').textContent.slice(1)})}
async function thread(id){$('[data-testid=thread-panel]').hidden=false;$('[data-testid=thread-panel]').dataset.parent=id;let d=await api('/messages/'+id+'/replies');document.querySelector('#threads').innerHTML=d.replies.map(render).join('')||'<p>No replies yet</p>'}
async function refresh(){await select({id:ch,name:$('[data-testid=channel-title]').textContent.slice(1),topic:$('[data-testid=channel-topic]').textContent})}
$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]');mode=mode==='signup'?'login':'signup';f.dataset.mode=mode;$('.signup').hidden=mode==='login';$('[data-testid=auth-submit]').textContent=mode==='signup'?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=mode==='signup'?'Have an account? Log in':'Need an account? Sign up'}
$('[data-testid=auth-submit]').onclick=async e=>{e.preventDefault();let f=$('[data-testid=auth-form]'),d={username:f.username.value,password:f.password.value};if(mode==='signup')d.display_name=f.display_name.value;try{let x=await api('/auth/'+(mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(d)});token=x.token;localStorage.setItem('huddle.token',token);me=x.user;showApp()}catch(e){$('[data-testid=auth-error]').textContent=e.message}}
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=$('[data-testid=workspace-create-form]');try{let x=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.slug.value,name:f.name.value})});ws=x.workspace;$('[data-testid=workspace-header]').textContent=ws.name;f.hidden=true;let d=await api('/workspaces/'+ws.slug);renderChannels(d.channels);select(d.channels[0])}catch(e){let z=document.createElement('p');z.className='err';z.textContent=e.message;f.append(z)}}
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()}
$('[data-testid=send-btn]').onclick=async()=>{let i=$('[data-testid=message-input]');if(i.value.trim()){await api('/channels/'+ch+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';refresh()}}
$('[data-testid=new-channel-btn]').onclick=()=>{$('[data-testid=create-channel-form]').hidden=false}
$('[data-testid=create-channel-submit]').onclick=async e=>{e.preventDefault();let f=$('[data-testid=create-channel-form]'),n=f.name.value.toLowerCase().trim().replace(/\s+/g,'-');try{let x=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('[data-testid=create-channel-private]').checked})});let d=await api('/workspaces/'+ws.slug);renderChannels(d.channels);select(x.channel)}catch(e){$('[data-testid=create-channel-error]').textContent=e.message}}
$('[data-testid=thread-send]').onclick=async()=>{let p=$('[data-testid=thread-panel]').dataset.parent,i=$('[data-testid=thread-input]');if(i.value.trim()){await api('/channels/'+ch+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:+p})});i.value='';let d=await api('/messages/'+p+'/replies');document.querySelector('#threads').innerHTML=d.replies.map(render).join('');refresh()}}
if(token)api('/auth/me').then(x=>{me=x.user;showApp()}).catch(()=>{});
async function edit(id,b){let box=b.closest('[data-testid=message]');let old=box.querySelector('[data-testid=message-body]').textContent;let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=old;box.querySelector('[data-testid=message-body]').replaceWith(i);i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+id,{method:'PATCH',body:JSON.stringify({body:i.value})});refresh()}if(e.key==='Escape'){refresh()}}}
async function del(id){await api('/messages/'+id,{method:'DELETE'});refresh()}
async function react(id){let p=document.querySelector(`[data-message-id="${id}"]`);let g=document.createElement('span');g.dataset.testid='emoji-picker';g.innerHTML=['😀','👍','❤️','🎉','😂','😮','😢','🚀'].map(e=>`<button data-testid=emoji-option onclick="choose(${id},'${e}')">${e}</button>`).join('');p.append(g)}
async function choose(id,e){await api('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});let p=document.querySelector(`[data-message-id="${id}"]`);p.insertAdjacentHTML('beforeend',`<span data-testid=reaction-chip>${e} 1</span>`);let q=p.querySelector('[data-testid=emoji-picker]');if(q)q.remove()}
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
</script></body></html>

$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
