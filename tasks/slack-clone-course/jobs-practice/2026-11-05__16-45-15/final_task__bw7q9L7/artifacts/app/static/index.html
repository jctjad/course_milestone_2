<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:15px Arial;color:#222}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f245b;color:white;padding:18px}.main{flex:1;padding:22px}.thread{width:330px;border-left:1px solid #ddd;padding:18px}[hidden]{display:none!important}button{border:0;padding:9px 14px;border-radius:4px;cursor:pointer}[data-button-role="primary"]{background:#007a5a!important;color:#fff!important}[data-button-role="danger"]{background:#e01e5a!important;color:#fff!important}[data-button-role="secondary"]{background:#1264a3!important;color:#fff!important}.primary{background:#007a5a!important;color:#fff}.danger{background:#e01e5a!important;color:#fff}.secondary{background:#1264a3!important;color:#fff}.channel-entry{display:block;background:none;color:white;text-align:left;width:100%;padding:10px}.message{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-flex;width:28px;height:28px;background:#1264a3;color:white;align-items:center;justify-content:center;margin-right:8px}.toolbar{float:right}.empty{padding:50px;text-align:center;color:#666}input{padding:9px;margin:5px;width:250px}label{display:block;margin-top:8px}#auth-modal{max-width:420px;margin:80px auto}.hidden{display:none}
</style></head><body>
<section id=auth-modal><form id=auth-form data-testid=auth-form data-mode=signup><h1>Huddle</h1><label>Username<input name=username required></label><label>Password<input name=password type=password required></label><label class=signup>Display name<input name=display_name></label><div id=auth-error data-testid=auth-error></div><button id=auth-submit data-testid=auth-submit data-button-role=primary>Sign up</button> <button type=button id=auth-toggle data-testid=auth-toggle>Have an account? Log in</button></form></section>
<div id=create-channel-modal hidden></div><form id=join-workspace-form data-testid=join-workspace-form hidden><input name=slug placeholder="Workspace slug"><button id=join-workspace-submit data-testid=join-workspace-submit data-button-role=primary>Join workspace</button></form><div id=app class=app hidden><aside id=sidebar class=sidebar data-testid=sidebar><h2 id=workspace-header data-testid=workspace-header>Huddle</h2><div id=current-user data-testid=current-user></div><button id=logout-btn data-testid=logout-btn data-button-role=danger>Log out</button><h3>Channels</h3><div id=channel-list data-testid=channel-list></div><button id=new-channel-btn data-testid=new-channel-btn data-button-role=secondary>New channel</button><form id=workspace-create-form data-testid=workspace-create-form hidden><input name=slug placeholder=Workspace slug><input name=name placeholder=Workspace name><button data-testid=workspace-create-submit data-button-role=primary>Create workspace</button></form><button id=empty-state-create-workspace data-testid=empty-state-create-workspace hidden>Create a workspace</button><div id=dms-list data-testid=dms-list></div></aside><main class=main><header><h2 id=channel-title data-testid=channel-title>#general</h2><span id=channel-topic data-testid=channel-topic></span></header><div id=message-list data-testid=message-list></div><form id=sendform><input id=message-input data-testid=message-input placeholder="Message #general"><button id=send-btn data-testid=send-btn data-button-role=primary>Send</button></form><form id=create-channel-form data-testid=create-channel-form hidden><input name=name placeholder="Channel name"><label><input id=create-channel-private data-testid=create-channel-private type=checkbox> Private</label><span id=create-channel-error data-testid=create-channel-error></span><button id=create-channel-submit data-testid=create-channel-submit data-button-role=primary>Create</button><button type=button id=create-channel-cancel data-testid=create-channel-cancel data-button-role=secondary>Cancel</button></form></main><aside id=thread-panel data-testid=thread-panel hidden><button id=close-thread data-testid=close-thread data-button-role=secondary>Close</button><div id=thread-messages></div><input id=thread-input data-testid=thread-input placeholder="Reply"><button id=thread-send data-testid=thread-send data-button-role=primary>Reply</button></aside></div>
<div hidden id=channel-settings-modal><button id=channel-settings-btn data-testid=channel-settings-btn data-button-role=secondary>Channel settings</button><h3 id=channel-settings-title data-testid=channel-settings-title></h3><button id=channel-settings-close data-testid=channel-settings-close data-button-role=secondary>Close</button><div id=channel-members-list data-testid=channel-members-list></div><form id=channel-add-member-form data-testid=channel-add-member-form><input id=channel-add-member-input data-testid=channel-add-member-input><button id=channel-add-member-submit data-testid=channel-add-member-submit data-button-role=primary>Add</button></form><input id=channel-topic-input data-testid=channel-topic-input><button id=channel-topic-submit data-testid=channel-topic-submit data-button-role=primary>Save topic</button><button id=archive-channel-btn data-testid=archive-channel-btn data-button-role=danger>Archive</button><button id=unarchive-channel-btn data-testid=unarchive-channel-btn data-button-role=secondary>Unarchive</button></div>
<div hidden id=workspace-settings-modal><button id=workspace-settings-btn data-testid=workspace-settings-btn data-button-role=secondary>Workspace settings</button><button id=workspace-settings-close data-testid=workspace-settings-close data-button-role=secondary>Close</button><input id=workspace-name-input data-testid=workspace-name-input><select id=workspace-join-mode data-testid=workspace-join-mode></select><button id=workspace-general-submit data-testid=workspace-general-submit data-button-role=primary>Save</button><button id=settings-tab-members data-testid=settings-tab-members>Members</button><button id=settings-tab-invitations data-testid=settings-tab-invitations>Invitations</button><button id=settings-tab-general data-testid=settings-tab-general>General</button><div id=settings-pane-members data-testid=settings-pane-members></div><div id=settings-pane-invitations data-testid=settings-pane-invitations></div><div id=settings-pane-general data-testid=settings-pane-general></div><button id=create-invitation-btn data-testid=create-invitation-btn data-button-role=secondary>Create invitation</button><form id=create-invitation-form data-testid=create-invitation-form><button id=create-invitation-submit data-testid=create-invitation-submit data-button-role=primary>Create</button><div id=invitations-list data-testid=invitations-list></div></form></div>
<script>
let T=localStorage.getItem('huddle.token'),U,W,C,cur,editing;
const $=x=>document.querySelector(x), api=async(p,o={})=>{let r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
function show(){if(!T){$('#auth-modal').hidden=false;$('#app').hidden=true;return}$('#auth-modal').hidden=true;$('#app').hidden=false;load()}
async function load(){U=(await api('/api/auth/me')).user;$('#current-user').textContent=U.display_name;let x=await api('/api/workspaces');if(!x.workspaces.length){$('#workspace-create-form').hidden=false;return}W=x.workspaces[0];$('#workspace-header').textContent=W.name;let d=await api('/api/workspaces/'+W.slug);C=d.channels;renderChannels();open(C[0])}
function renderChannels(){$('#channel-list').innerHTML=C.map(x=>`<button class=channel-entry data-testid=channel-entry data-channel-id=${x.id} data-channel-name=${x.name}>#${x.name}</button>`).join('');document.querySelectorAll('.channel-entry').forEach((e,i)=>e.onclick=()=>open(C[i]))}
async function open(x){cur=x;$('#channel-title').textContent='#'+x.name;$('#channel-topic').textContent=x.topic||'';let d=await api('/api/channels/'+x.id+'/messages');render(d.messages)}
function render(ms){$('#message-list').innerHTML=ms.length?ms.map(m=>`<div class=message data-testid=message data-message-id=${m.id}><span class=avatar data-testid=message-avatar>${m.author.display_name[0]}</span><b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><div data-testid=message-body>${esc(m.body)}</div><div class=toolbar><button data-testid=open-thread-btn aria-label="Open thread">Thread</button><button data-testid=reaction-button aria-label="React">😀</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button>${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} ${m.reply_count===1?'reply':'replies'}</span>`:''}${m.edited_at?'<span data-testid=message-edited>edited</span>':''}${m.reactions.map(r=>`<span data-testid=reaction-chip>${r.emoji} ${r.count}</span>`).join('')}</div></div>`).join(''): '<div class=empty data-testid=channel-empty-state>No messages yet — start the conversation.</div>';bind()}
function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function bind(){document.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=async()=>{let el=b.closest('.message'),id=el.dataset.messageId,inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=el.querySelector('[data-testid=message-body]').textContent;el.querySelector('[data-testid=message-body]').replaceWith(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){await api('/api/messages/'+id,{method:'PATCH',body:JSON.stringify({body:inp.value})});open(cur)}if(e.key==='Escape')open(cur)}});document.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=async()=>{await api('/api/messages/'+b.closest('.message').dataset.messageId,{method:'DELETE'});open(cur)});document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=()=>{let m=b.closest('.message');$('#thread-panel').hidden=false;$('#thread-panel').dataset.parent=m.dataset.messageId;loadReplies()});document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=async()=>{let m=b.closest('.message'),p=document.createElement('div');p.dataset.testid='emoji-picker';p.innerHTML=['😀','👍','❤️','🎉','😂','🚀','🔥','👏'].map(e=>`<button data-testid=emoji-option>${e}</button>`).join('');b.after(p);p.querySelectorAll('button').forEach(x=>x.onclick=async()=>{await api('/api/messages/'+m.dataset.messageId+'/reactions',{method:'POST',body:JSON.stringify({emoji:x.textContent})});open(cur)})})}
async function loadReplies(){let d=await api('/api/messages/'+$('#thread-panel').dataset.parent+'/replies');$('#thread-messages').innerHTML=d.replies.map(m=>`<div class=message data-testid=message data-message-id=${m.id}><div data-testid=message-body>${esc(m.body)}</div></div>`).join('')}
$('#auth-toggle').onclick=()=>{$('#auth-form').dataset.mode=$('#auth-form').dataset.mode==='signup'?'login':'signup';$('.signup').hidden=$('#auth-form').dataset.mode==='login';$('#auth-submit').textContent=$('#auth-form').dataset.mode==='signup'?'Sign up':'Log in';$('#auth-toggle').textContent=$('#auth-form').dataset.mode==='signup'?'Have an account? Log in':'Need an account? Sign up'}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),mode=e.target.dataset.mode;try{let d=await api('/api/auth/'+(mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(f))});T=d.token;localStorage.setItem('huddle.token',T);show()}catch(x){$('#auth-error').textContent=x.message}}
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');T='';show()};$('#sendform').onsubmit=async e=>{e.preventDefault();let i=$('#message-input');if(i.value.trim()){await api('/api/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';open(cur)}}
$('#new-channel-btn').onclick=()=>$('#create-channel-form').hidden=false;$('#create-channel-cancel').onclick=()=>$('#create-channel-form').hidden=true;$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=f.get('name').toLowerCase().trim().replace(/\s+/g,'-');try{let d=await api('/api/workspaces/'+W.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('#create-channel-private').checked})});C.push(d.channel);renderChannels();open(d.channel);e.target.hidden=true}catch(x){$('#create-channel-error').textContent='A channel with that name already exists'}};$('#close-thread').onclick=()=>$('#thread-panel').hidden=true;$('#thread-send').onclick=async()=>{await api('/api/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:$('#thread-input').value,parent_id:+$('#thread-panel').dataset.parent})});$('#thread-input').value='';loadReplies();open(cur)}
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),d=await api('/api/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});W=d.workspace;C=[d.general_channel];$('#workspace-header').textContent=W.name;e.target.hidden=true;renderChannels();open(C[0])};show()
</script></body></html>
