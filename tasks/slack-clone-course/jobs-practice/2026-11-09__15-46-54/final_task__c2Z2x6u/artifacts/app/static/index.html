<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#1d1c1d;background:#f8f8f8}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}input,select{padding:9px;border:1px solid #bbb;border-radius:4px}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0e40;color:white;padding:18px}.main{flex:1;padding:22px}.thread{width:330px;border-left:1px solid #ddd;padding:18px;background:#fff}.row{padding:12px;border-bottom:1px solid #eee}.modal{position:fixed;inset:15%;background:white;padding:25px;box-shadow:0 2px 20px #555}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.muted{color:#666}.empty{padding:35px;text-align:center}.header{display:flex;justify-content:space-between;align-items:center}.auth{max-width:420px;margin:80px auto;background:#fff;padding:30px}.auth input{display:block;width:100%;margin:8px 0}
</style></head><body>
<div id="auth-modal" class="auth"><h1>Huddle</h1><form data-testid="auth-form" data-mode="signup"><label>Username<input name="username" placeholder="Username"></label><label>Password<input name="password" type="password" placeholder="Password"></label><label>Display name<input name="display_name" placeholder="Display name"></label><p data-testid="auth-error" id="auth-error"></p><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Have an account? Log in</button></form></div>
<div class="app" hidden><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Workspace</h2><div data-testid="current-user"></div><div data-testid="workspace-name"></div><button data-testid="logout-btn" data-button-role="danger">Log out</button><h3>Channels</h3><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form"><input name="slug" placeholder="Workspace slug"><input name="name" placeholder="Workspace name"><button type="submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><span data-testid="empty-state-create-workspace" hidden>Create your first workspace</span></form><form data-testid="join-workspace-form"><input name="slug" placeholder="Workspace slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span data-testid="join-workspace-error"></span></form></aside>
<main class="main"><div class="header"><div><h2 data-testid="channel-title">Select a channel</h2><div data-testid="channel-topic"></div></div><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div><section data-testid="message-list"><div class="empty" id="empty-copy">No messages yet. Start the conversation.</div></section><form id="message-form"><label>Message <input id="message-input" data-testid="message-input" placeholder="Message #general"></label><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside class="thread" id="thread-panel" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><input data-testid="thread-input" id="thread-input" placeholder="Reply in thread"><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close thread</button></aside></div>
<div id="create-channel-modal" class="modal" hidden><form data-testid="create-channel-form"><h2>Create channel</h2><input name="name" placeholder="Channel name"><label><input type="checkbox" id="create-channel-private" data-testid="create-channel-private"> Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 data-testid="channel-settings-title">Channel settings</h2><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><div class="toolbar"><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button></div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div></div>
<script>
const $=s=>document.querySelector(s), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};return fetch(path,opt)};
let token=localStorage.getItem('huddle.token'), me=null, ws=null, ch=null;
const auth=$('[data-testid=auth-form]'), app=$('.app'), modal=$('#create-channel-modal');
function showAuth(){auth.closest('#auth-modal').hidden=false;app.hidden=true}
function showApp(){auth.closest('#auth-modal').hidden=true;app.hidden=false}
function err(t){$('#auth-error').textContent=t}
async function loadMe(){let r=await api('/api/auth/me');if(!r.ok){token=null;localStorage.removeItem('huddle.token');showAuth();return false}me=(await r.json()).user;$('[data-testid=current-user]').textContent=me.display_name||me.username;return true}
async function loadWorkspaces(){let r=await api('/api/workspaces'), j=await r.json(); if(!j.workspaces.length){$('.sidebar').classList.add('empty');return} ws=j.workspaces[0];localStorage.setItem('huddle.workspace',ws.slug);$('[data-testid=workspace-header]').textContent=ws.name;await loadWorkspace()}
async function loadWorkspace(){let r=await api('/api/workspaces/'+ws.slug),j=await r.json();$('[data-testid=workspace-header]').textContent=j.workspace.name;let list=$('[data-testid=channel-list]');list.innerHTML='';j.channels.forEach(x=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=x.id;b.dataset.channelName=x.name;b.textContent='#'+x.name;b.onclick=()=>selectChannel(x);list.append(b)});if(j.channels.length){let wanted=localStorage.getItem('huddle.workspace')===ws.slug?localStorage.getItem('huddle.channel'):null;let pick=j.channels.find(x=>String(x.id)===wanted)||j.channels[0];await selectChannel(pick)}}
async function selectChannel(x){ch=x;localStorage.setItem('huddle.channel',String(x.id));$('[data-testid=channel-title]').textContent=x.name;$('[data-testid=channel-topic]').textContent=x.topic||'';let r=await api('/api/channels/'+x.id+'/messages'),j=await r.json();renderMessages(j.messages||[])}
function renderMessages(ms){let box=$('[data-testid=message-list]');box.innerHTML='';if(!ms.length){box.innerHTML='<div class="empty" data-testid="channel-empty-state">No messages yet. Start the conversation.</div>';return}ms.slice().reverse().forEach(m=>renderMessage(m,true))}
function renderMessage(m,append=true){
 let row=document.createElement('div');row.className='row message';row.dataset.testid='message';row.dataset.messageId=m.id;
 let time=new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}), author=m.author.display_name||m.author.username;
 let chips=(m.reactions||[]).map(x=>'<span class="reaction-chip" data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('');
 let replies=m.reply_count?'<span data-testid="thread-reply-count">'+m.reply_count+' '+(m.reply_count===1?'reply':'replies')+'</span>':'';
 row.innerHTML='<span data-testid="message-avatar" style="display:inline-flex;width:28px;height:28px;background:#36c;color:white;border-radius:4px;align-items:center;justify-content:center">'+author[0].toUpperCase()+'</span> <b data-testid="message-author">'+author+'</b> <span data-testid="message-time" class="muted">'+time+'</span><div data-testid="message-body">'+m.body+'</div>'+(m.edited_at?'<span data-testid="message-edited" class="muted">edited</span>':'')+replies+'<div class="toolbar"><button data-testid="message-edit-btn" type="button">Edit</button><button data-testid="message-delete-btn" type="button">Delete</button><button data-testid="reaction-button" type="button" aria-label="Add reaction">React</button><button data-testid="open-thread-btn" type="button">Thread</button></div><div class="reactions">'+chips+'</div>';
 row.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let input=document.createElement('input');input.dataset.testid='message-edit-input';input.value=m.body;row.querySelector('[data-testid=message-body]').replaceWith(input);input.focus();input.onkeydown=async e=>{if(e.key==='Escape')row.replaceWith(renderMessage(m,false));if(e.key==='Enter'){let r=await api('/api/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:input.value})});if(r.ok)row.replaceWith(renderMessage((await r.json()).message,false))}}};
 row.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/api/messages/'+m.id,{method:'DELETE'});row.remove()};
 row.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{let panel=$('[data-testid=thread-panel]');panel.hidden=false;panel.dataset.parentId=m.id;let r=await api('/api/messages/'+m.id+'/replies'),j=await r.json();$('#thread-messages').innerHTML=(j.replies||[]).map(x=>'<div class="row">'+x.body+'</div>').join('')};
 row.querySelector('[data-testid=reaction-button]').onclick=()=>{let old=row.querySelector('[data-testid=emoji-picker]');if(old){old.remove();return}let pick=document.createElement('div');pick.dataset.testid='emoji-picker';pick.style.display='grid';pick.style.gridTemplateColumns='repeat(4,1fr)';['👍','❤️','😂','🎉','😄','🚀','👏','✅'].forEach(em=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=em;b.onclick=async()=>{let r=await api('/api/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:em})});if(r.ok){let j=await r.json();row.querySelector('.reactions').innerHTML=j.reactions.map(x=>'<span class="reaction-chip" data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('');pick.remove()}};pick.append(b)});row.querySelector('.toolbar').append(pick)};
 if(append)$('[data-testid=message-list]').append(row);return row
}
auth.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(auth)), mode=auth.dataset.mode, path=mode==='signup'?'/api/auth/register':'/api/auth/login';let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok){err(mode==='signup'?'Password must be at least 8 characters or username is invalid':'Login failed. Check your credentials.');return}let j=await r.json();token=j.token;localStorage.setItem('huddle.token',token);showApp();await loadMe();await loadWorkspaces()};
$('[data-testid=auth-toggle]').onclick=()=>{let signup=auth.dataset.mode!=='signup';auth.dataset.mode=signup?'signup':'login';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=signup?'Have an account? Log in':'Need an account? Sign up';auth.querySelector('[name=display_name]').parentElement.hidden=!signup};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api('/api/workspaces',{method:'POST',body:JSON.stringify(d)});if(r.ok){ws=(await r.json()).workspace;await loadWorkspace()}};
$('[data-testid=new-channel-btn]').onclick=()=>modal.hidden=false;
$('[data-testid=create-channel-cancel]').onclick=()=>modal.hidden=true;
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.name=d.name.trim().toLowerCase().replace(/\s+/g,'-');d.is_private=$('#create-channel-private').checked;let r=await api('/api/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify(d)});if(!r.ok){let p=document.querySelector('[data-testid=create-channel-error]')||document.createElement('p');p.dataset.testid='create-channel-error';p.textContent='A channel with that name already exists';e.target.append(p);return}let created=(await r.json()).channel;modal.hidden=true;await loadWorkspace();selectChannel(created)};
$('[data-testid=send-btn]').onclick=async e=>{e.preventDefault();let input=$('[data-testid=message-input]');if(!input.value.trim()||!ch)return;let r=await api('/api/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value})});if(r.ok){renderMessage((await r.json()).message);input.value=''}};
$('[data-testid=thread-send]').onclick=async()=>{let panel=$('[data-testid=thread-panel]'),input=$('[data-testid=thread-input]'),parent=panel.dataset.parentId;if(!input.value.trim())return;let r=await api('/api/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:input.value,parent_id:Number(parent)})});if(r.ok){let j=await r.json();$('#thread-messages').insertAdjacentHTML('beforeend','<div class="row message" data-testid="message" data-message-id="'+j.message.id+'"><div data-testid="message-body">'+j.message.body+'</div></div>');input.value='';selectChannel(ch)}};
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
(async()=>{if(token&&await loadMe()){showApp();await loadWorkspaces()}else showAuth()})();
</script></body></html>
