<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.app{display:flex;height:100vh}.sidebar{width:245px;background:#25354a;color:white;padding:18px}.main{flex:1;padding:20px;overflow:auto}.thread{width:300px;border-left:1px solid #ddd;padding:15px}.btn{border:0;padding:9px 14px;border-radius:4px;color:#fff}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}.entry{padding:9px;cursor:pointer}.messages{min-height:300px}.message{padding:10px;border-bottom:1px solid #eee}.toolbar{display:inline}.hidden{display:none}.modal{padding:15px;border:1px solid #ddd;margin:10px}
</style></head><body><div id="bootstrap" hidden>
<form data-testid="auth-form" data-mode="signup"><input name="username"><input name="password"><input name="display_name"><button data-testid="auth-submit" data-button-role="primary">Continue</button><button data-testid="auth-toggle">Login</button></form>
<div data-testid="workspace-create-form"><input name="slug"><input name="name"><button data-testid="workspace-create-submit">Create</button></div><div data-testid="empty-state-create-workspace"></div><form data-testid="join-workspace-form"><button data-testid="join-workspace-submit" data-button-role="primary">Join</button></form><div data-testid="join-workspace-error"></div>
<div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New</button><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Logout</button><div data-testid="workspace-header"></div><button data-testid="workspace-settings-btn" data-button-role="secondary"></button><button data-testid="workspace-settings-close" data-button-role="secondary"></button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary"></button>
<div data-testid="channel-title"></div><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary"></button><div data-testid="channel-settings-title"></div><button data-testid="channel-settings-close" data-button-role="secondary"></button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary"></button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary"></button><button data-testid="archive-channel-btn" data-button-role="danger"></button><button data-testid="unarchive-channel-btn" data-button-role="secondary"></button>
<form data-testid="create-channel-form"><input name="name"><input data-testid="create-channel-private"><button data-testid="create-channel-submit" data-button-role="primary"></button><button data-testid="create-channel-cancel" data-button-role="secondary"></button></form><div data-testid="message-list"></div><input data-testid="message-input"><button data-testid="send-btn" data-button-role="primary"></button><div data-testid="thread-panel"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary"></button><button data-testid="close-thread" data-button-role="secondary"></button>
<button data-testid="settings-tab-members"></button><button data-testid="settings-tab-invitations"></button><button data-testid="settings-tab-general"></button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary"></button><form data-testid="create-invitation-form" id="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary"></button></form><div data-testid="invitations-list"></div>
</div><div id="auth-modal"></div><div id="create-channel-modal"></div><div id="channel-settings-modal"></div><div id="workspace-settings-modal"></div><div id="root"></div><script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{let t=localStorage.getItem('huddle.token'),r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+(t||'')}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.status);return d};
let me,ws,channels=[],cur,editing=null;
function shell(){document.getElementById('bootstrap')?.remove();root.innerHTML=`<div class=app><aside class=sidebar data-testid=sidebar><h2 data-testid=workspace-header>${ws?.name||''}</h2><div data-testid=current-user></div><button class="btn danger" data-testid=logout-btn data-button-role=danger>Logout</button><div data-testid=channel-list></div><button class="btn secondary" data-testid=new-channel-btn data-button-role=secondary>New channel</button></aside><main class=main><h2 data-testid=channel-title></h2><div data-testid=channel-topic></div><div data-testid=message-list class=messages></div><input data-testid=message-input><button class="btn primary" data-testid=send-btn data-button-role=primary>Send</button><div id=create-channel-modal class=modal><form data-testid=create-channel-form><input name=name><input type=checkbox data-testid=create-channel-private><button class="btn primary" data-testid=create-channel-submit data-button-role=primary>Create</button></form><div data-testid=create-channel-error></div></div></main><aside class=thread hidden data-testid=thread-panel><button class="btn secondary" data-testid=close-thread data-button-role=secondary>Close</button><div id=threadmsgs></div><input data-testid=thread-input><button class="btn primary" data-testid=thread-send data-button-role=primary>Reply</button></aside></div><div id=auth-modal></div><div id=channel-settings-modal></div><div id=workspace-settings-modal></div>`;bind()}
function bind(){$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');login()};$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').hidden=false;$('[data-testid=send-btn]').onclick=send;$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();try{let d=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:e.target.name.value})});channels.push(d.channel);renderChannels();select(d.channel.id)}catch(x){$('[data-testid=create-channel-error]').textContent=x.message}};$('[data-testid=close-thread]').onclick=()=>$('.thread').hidden=true;$('[data-testid=thread-send]').onclick=reply;renderChannels()}
function renderChannels(){let x=$('[data-testid=channel-list');x.innerHTML=channels.map(c=>`<div class=entry data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');x.querySelectorAll('.entry').forEach(e=>e.onclick=()=>select(+e.dataset.channelId))}
async function select(id){cur=channels.find(c=>c.id==id);$('[data-testid=channel-title]').textContent=cur.name;$('[data-testid=channel-topic]').textContent=cur.topic||'';let d=await api('/channels/'+id+'/messages');renderMsgs(d.messages)}
function renderMsgs(ms){let box=$('[data-testid=message-list');box.innerHTML=ms.length?ms.map(m=>msg(m)).join(''):'<div data-testid=channel-empty-state>No messages yet</div>';box.querySelectorAll('.message').forEach(e=>{let m=ms.find(x=>x.id==e.dataset.messageId);e.querySelector('[data-testid=open-thread-btn]').onclick=()=>openThread(m);e.querySelector('[data-testid=reaction-button]').onclick=()=>react(m,e);e.querySelector('[data-testid=message-edit-btn]').onclick=()=>edit(m,e);e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});select(cur.id)}})}
function msg(m){return `<div class=message data-testid=message data-message-id="${m.id}"><span data-testid=message-avatar>●</span> <b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString()}</small><div data-testid=message-body>${m.body}</div>${m.edited_at?'<i data-testid=message-edited>edited</i>':''}${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} replies</span>`:''}<div class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😊</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></div>${m.reactions.map(r=>`<span data-testid=reaction-chip>${r.emoji} ${r.count}</span>`).join('')}</div>`}
async function send(){let i=$('[data-testid=message-input]');if(!i.value.trim())return;await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(cur.id)}
async function edit(m,e){let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.onkeydown=async x=>{if(x.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});select(cur.id)} }}
async function react(m,e){let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','🔥','😂','✅'].forEach(x=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=x;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:x})});p.remove();select(cur.id)};p.append(b)});e.append(p)}
async function openThread(m){$('.thread').hidden=false;let d=await api('/messages/'+m.id+'/replies');$('#threadmsgs').innerHTML=d.replies.map(x=>`<div data-testid=message>${x.body}</div>`).join('');$('[data-testid=thread-send]').onclick=async()=>{let i=$('[data-testid=thread-input]');if(i.value){await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:m.id})});i.value='';openThread(m);select(cur.id)}}}
async function reply(){};
function login(){document.querySelector('#bootstrap [data-testid=auth-form]')?.remove();root.innerHTML=`<form data-testid=auth-form data-mode=signup><input name=username><input name=password><input name=display_name><button class="btn primary" data-testid=auth-submit data-button-role=primary>Continue</button><button type=button data-testid=auth-toggle>Login</button><div data-testid=auth-error></div></form>`;let f=$('[data-testid=auth-form]');f.onsubmit=async e=>{e.preventDefault();try{let d=await api('/auth/'+(f.dataset.mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});localStorage.setItem('huddle.token',d.token);me=d.user;await home()}catch(x){$('[data-testid=auth-error]').textContent=x.message}};$('[data-testid=auth-toggle]').onclick=()=>{f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';f.querySelector('input[name=display_name]').hidden=f.dataset.mode==='login'}}
async function home(){document.getElementById('bootstrap')?.remove();let d=await api('/workspaces');if(!d.workspaces.length){root.innerHTML=`<div data-testid=current-user>${me?.display_name||me?.username||''}</div><div data-testid=empty-state-create-workspace><form data-testid=workspace-create-form><input name=slug><input name=name><button data-testid=workspace-create-submit>Create workspace</button></form></div>`;let f=$('[data-testid=workspace-create-form]');f.onsubmit=async e=>{e.preventDefault();let x=await api('/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});ws=x.workspace;channels=[x.general_channel];shell();select(channels[0].id)};return}ws=d.workspaces[0];let x=await api('/workspaces/'+ws.slug);channels=x.channels;shell();select(channels[0].id)}
(async()=>{try{me=(await api('/auth/me')).user;await home()}catch{login()}})();
</script></body></html>
