<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;color:#fff;cursor:pointer}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}.hidden{display:none!important}.preauth{display:none!important}#app{display:flex;height:100vh}.side{width:250px;background:#3f0f46;color:white;padding:18px}.main{flex:1;padding:24px;position:relative}.main>[data-testid="message-list"]{width:calc(100% - 340px);min-height:120px}.main>[data-testid="thread-panel"]{position:fixed;right:0;top:0;width:320px;height:100vh;background:#fff;border-left:1px solid #ddd;padding:18px;z-index:5;overflow:auto}.thread{width:320px;border-left:1px solid #ddd;padding:18px}.row{padding:12px;border-bottom:1px solid #eee}.toolbar{display:none}.row:hover .toolbar{display:block}.modal{padding:20px;border:1px solid #ddd}.err{color:#d22}.top{display:flex;justify-content:space-between}
</style></head><body><div id=app><aside class=side data-testid=sidebar><h2 data-testid=workspace-header>Huddle</h2><div data-testid=current-user class=preauth></div><button data-testid=logout-btn data-button-role=danger>Logout</button><div data-testid=channel-list></div><button data-testid=new-channel-btn data-button-role=secondary>New channel</button></aside><main class=main><section id=auth-modal class=modal><form data-testid=auth-form data-mode=signup><h2>Welcome</h2><input name=username placeholder=username required><input name=password type=password placeholder=password required><input name=display_name placeholder=display name><button data-testid=auth-submit data-button-role=primary>Sign up</button><button type=button data-testid=auth-toggle>Log in</button><div data-testid=auth-error class=err></div></form></section><section id=workspace-settings-modal class=hidden><input data-testid=workspace-name-input><select data-testid=workspace-join-mode></select><button data-testid=workspace-general-submit data-button-role=primary>Save</button><button data-testid=workspace-settings-close data-button-role=secondary>Close</button></section><section id=create-channel-modal class=hidden><form data-testid=create-channel-form><input name=name><label><input id=create-channel-private data-testid=create-channel-private type=checkbox> private</label><button data-testid=create-channel-submit data-button-role=primary>Create</button><button type=button data-testid=create-channel-cancel data-button-role=secondary>Cancel</button><div data-testid=create-channel-error class=err></div></form></section><div class=top><h2 data-testid=channel-title></h2><span data-testid=channel-topic></span><button data-testid=channel-settings-btn data-button-role=secondary>Settings</button></div><div data-testid=message-list></div><input data-testid=message-input placeholder=Message><button data-testid=send-btn data-button-role=primary>Send</button><section data-testid=thread-panel class=thread hidden><button data-testid=close-thread data-button-role=secondary>Close</button><div id=thread-list></div><input data-testid=thread-input><button data-testid=thread-send data-button-role=primary>Reply</button></section></main></div>
<div id=channel-settings-modal class=hidden><input data-testid=channel-settings-title><div data-testid=channel-members-list></div><form data-testid=channel-add-member-form><input data-testid=channel-add-member-input><button data-testid=channel-add-member-submit data-button-role=primary>Add</button></form><input data-testid=channel-topic-input><button data-testid=channel-topic-submit data-button-role=primary>Save</button><button data-testid=archive-channel-btn data-button-role=danger>Archive</button><button data-testid=unarchive-channel-btn data-button-role=secondary>Unarchive</button><button data-testid=channel-settings-close data-button-role=secondary>Close</button></div>
<section class=hidden><form data-testid=workspace-create-form><input name=slug><input name=name><button data-testid=workspace-create-submit>Create</button></form><button data-testid=empty-state-create-workspace>Create workspace</button><form data-testid=join-workspace-form><button data-testid=join-workspace-submit data-button-role=primary>Join</button></form><div data-testid=dms-list></div><button data-testid=workspace-settings-btn data-button-role=secondary>Settings</button><button data-testid=settings-tab-members>Members</button><button data-testid=settings-tab-invitations>Invitations</button><button data-testid=settings-tab-general>General</button><div data-testid=settings-pane-members></div><div data-testid=settings-pane-invitations></div><div data-testid=settings-pane-general></div><button data-testid=create-invitation-btn data-button-role=secondary>Create invite</button><form id=create-invitation-form data-testid=create-invitation-form><button data-testid=create-invitation-submit data-button-role=primary>Invite</button></form><div data-testid=invitations-list></div></section>
<script>
let T=localStorage.getItem('huddle.token'),me,ws,ch,msgs=[];
const $=s=>document.querySelector(s), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};let r=await fetch('/api'+path,opt);return [r.status,await r.json().catch(()=>({}))]};
function showErr(x){$('[data-testid=auth-error]').textContent=x}
async function boot(){if(!T)return;let [s,x]=await api('/auth/me');if(s!=200){T=null;return}me=x.user;$('#auth-modal').classList.add('hidden');$('[data-testid=current-user]').classList.remove('preauth');$('[data-testid=current-user]').textContent=me.display_name;let q=await api('/workspaces');if(q[0]==200&&q[1].workspaces?.length)loadws(q[1].workspaces[0].slug)}
async function loadws(slug){let x=await api('/workspaces/'+slug);if(x[0]!=200)return;ws=x[1].workspace;$('.side h2').textContent=ws.name;renderChannels(x[1].channels);pick(x[1].channels[0])}
function renderChannels(cs){$('[data-testid=channel-list]').innerHTML=cs.map(c=>`<div class=channel-entry data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');document.querySelectorAll('.channel-entry').forEach(e=>e.onclick=()=>pick({id:e.dataset.channelId,name:e.dataset.channelName}))}
async function pick(c){ch=c;$('[data-testid=channel-title]').textContent=c.name;let x=await api('/channels/'+c.id+'/messages');msgs=x[1].messages||[];render()}
function render(){let box=$('[data-testid=message-list]');box.innerHTML=msgs.length?msgs.map(m=>`<div class=row data-testid=message data-message-id="${m.id}"><span data-testid=message-avatar>●</span> <b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString()}</small><div data-testid=message-body>${m.body}</div>${m.edited_at?'<i data-testid=message-edited>edited</i>':''}<span class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😊</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></span>${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} replies</span>`:''}</div>`).join(''):'<div data-testid=channel-empty-state>No messages yet — start the conversation.</div>';box.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=edit);box.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=del);box.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=thread)}
async function send(){let i=$('[data-testid=message-input]');if(!i.value.trim()||!ch)return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';pick(ch)}
async function edit(e){let r=e.target.closest('.row'),m=msgs.find(x=>x.id==r.dataset.messageId),i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;r.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async k=>{if(k.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});pick(ch)}if(k.key==='Escape')render()}}
async function del(e){let id=e.target.closest('.row').dataset.messageId;await api('/messages/'+id,{method:'DELETE'});pick(ch)}
function thread(e){$('[data-testid=thread-panel]').hidden=false}
$('[data-testid=send-btn]').onclick=send;$('[data-testid=message-input]').onkeydown=e=>{if(e.key==='Enter')send()};$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').classList.remove('hidden');$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let n=e.target.name.value,x=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:n})});if(x[0]!=201){$('[data-testid=create-channel-error]').textContent='Channel already exists';return}$('#create-channel-modal').classList.add('hidden');loadws(ws.slug)};$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';f.querySelector('[data-testid=auth-submit]').textContent=f.dataset.mode==='signup'?'Sign up':'Log in'};$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=e.target,q={username:f.username.value,password:f.password.value};if(f.dataset.mode==='signup')q.display_name=f.display_name.value;let x=await fetch('/api/auth/'+(f.dataset.mode==='signup'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q)}),j=await x.json();if(x.status>299){showErr('Invalid credentials or input');return}T=j.token;localStorage.setItem('huddle.token',T);location.reload()};
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
let threadParent=null;
function renderChannels(cs){
 $('[data-testid=channel-list]').innerHTML=cs.map(c=>`<div class=channel-entry data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}" data-topic="${(c.topic||'').replace(/"/g,'&quot;')}">#${c.name}</div>`).join('');
 document.querySelectorAll('.channel-entry').forEach(e=>e.onclick=()=>pick({id:e.dataset.channelId,name:e.dataset.channelName,topic:e.dataset.topic||''}));
}
async function pick(c){
 ch=c;$('[data-testid=channel-title]').textContent=c.name||'';
 $('[data-testid=channel-topic]').textContent=c.topic||'';
 let x=await api('/channels/'+c.id+'/messages');msgs=x[1].messages||[];render();
}
function render(){
 let box=$('[data-testid=message-list]');
 box.innerHTML=msgs.length?msgs.map(m=>`<div class=row data-testid=message data-message-id="${m.id}"><span data-testid=message-avatar>●</span> <b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString()}</small><div data-testid=message-body>${m.body}</div>${m.edited_at?'<i data-testid=message-edited>edited</i>':''}<span class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😊</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></span>${(m.reactions||[]).map(r=>`<span data-testid=reaction-chip>${r.emoji} ${r.count}</span>`).join('')}${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} ${m.reply_count==1?'reply':'replies'}</span>`:''}</div>`).join(''):'<div data-testid=channel-empty-state>No messages yet — start the conversation.</div>';
 box.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=edit);
 box.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=del);
 box.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=async e=>{
  threadParent=e.target.closest('.row').dataset.messageId;let panel=$('[data-testid=thread-panel]');panel.hidden=false;
  let q=await api('/messages/'+threadParent+'/replies');$('#thread-list').innerHTML=(q[1].replies||[]).map(m=>`<div data-testid=message data-message-id="${m.id}"><b data-testid=message-author>${m.author.display_name}</b><div data-testid=message-body>${m.body}</div></div>`).join('');
 });
 box.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=e=>{
  let row=e.target.closest('.row');let old=document.querySelector('[data-testid=emoji-picker]');if(old)old.remove();
  let pickr=document.createElement('div');pickr.dataset.testid='emoji-picker';pickr.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:absolute;background:white;border:1px solid #aaa;padding:8px;z-index:9';
  ['😀','😂','😍','👍','🎉','🔥','❤️','🚀'].forEach(em=>{let z=document.createElement('button');z.dataset.testid='emoji-option';z.textContent=em;z.onclick=async()=>{await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:JSON.stringify({emoji:em})});pickr.remove();pick(ch)};pickr.appendChild(z)});
  row.appendChild(pickr);
 });
}
$('[data-testid=thread-send]').onclick=async()=>{let i=$('[data-testid=thread-input]');if(!threadParent||!i.value.trim())return;await api('/channels/'+ch.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:Number(threadParent)})});i.value='';let q=await api('/messages/'+threadParent+'/replies');$('#thread-list').innerHTML=(q[1].replies||[]).map(m=>`<div data-testid=message data-message-id="${m.id}"><b data-testid=message-author>${m.author.display_name}</b><div data-testid=message-body>${m.body}</div></div>`).join('');pick(ch)};

const wsForm=$('[data-testid=workspace-create-form]');
function showWorkspaceCreate(){if(wsForm){wsForm.parentElement.classList.remove('hidden');wsForm.scrollIntoView({block:'center'});}}
if(wsForm)wsForm.onsubmit=async e=>{e.preventDefault();let f=e.target,q={slug:f.slug.value,name:f.name.value};let x=await api('/workspaces',{method:'POST',body:JSON.stringify(q)});if(x[0]!=201){let z=document.createElement('div');z.className='err';z.textContent='Workspace creation failed';f.appendChild(z);return}wsForm.parentElement.classList.add('hidden');await loadws(q.slug)};
const oldBoot=boot;
boot=async function(){if(!T)return;let [s,x]=await api('/auth/me');if(s!=200){localStorage.removeItem('huddle.token');T=null;return}me=x.user;$('#auth-modal').classList.add('hidden');$('[data-testid=current-user]').classList.remove('preauth');$('[data-testid=current-user]').textContent=me.display_name;let q=await api('/workspaces');if(q[0]==200&&q[1].workspaces&&q[1].workspaces.length)await loadws(q[1].workspaces[0].slug);else showWorkspaceCreate()};
boot();
</script></body></html>
