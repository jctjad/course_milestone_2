<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.layout{display:flex;height:100vh}.side{width:240px;background:#3f0f45;color:#fff;padding:18px}.main{flex:1;padding:20px}.thread{width:300px;padding:18px;border-left:1px solid #ddd}.entry{padding:10px;cursor:pointer}.msg{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-block;width:28px;height:28px;background:#1264a3;color:white;padding:6px;margin-right:8px}.toolbar{display:inline}.form{padding:14px;border:1px solid #ddd;margin:10px 0}input{padding:9px;margin:4px;width:90%}label{display:block}
.primary{background:#007a5a;color:#fff}.msg button{background:#1264a3;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}\n</style><style>#pinned-panels>*{display:none}#pinned-panels>[data-testid="workspace-create-form"].active{display:block;position:fixed;top:20px;left:270px;background:white;padding:20px;z-index:5;border:1px solid #ccc}</style></head><body><div id=auth-modal class=form data-testid=auth-form data-mode=login><h2>Welcome to Huddle</h2><label>Username<input id=username name=username placeholder=Username></label><label>Password<input id=password name=password type=password placeholder=Password></label><label>Display name<input id=display name=display_name placeholder="Display name"></label><button class=primary data-button-role=primary data-button-role=primary data-testid=auth-submit>Sign in</button> <button class=secondary data-testid=auth-toggle>Sign up</button><p id=auth-error data-testid=auth-error></p></div><div class=layout hidden id=app><aside class=side data-testid=sidebar><h2 data-testid=workspace-header>Huddle</h2><div data-testid=current-user></div><button class=danger data-button-role=danger data-button-role=danger data-testid=logout-btn>Log out</button><h3>Channels</h3><div data-testid=channel-list></div><div data-testid=dms-list></div><button class=secondary data-button-role=secondary data-testid=new-channel-btn>New channel</button><form hidden class=form id=create-channel-form data-testid=create-channel-form><label>Channel name<input id=chname name=name placeholder="Channel name"></label><button class=primary data-button-role=primary data-button-role=primary data-testid=create-channel-submit>Create channel</button><button type=button class=secondary data-button-role=secondary data-testid=create-channel-cancel>Cancel</button><p id=create-channel-error data-testid=create-channel-error></p></form></aside><main class=main><header><h2 data-testid=channel-title>#general</h2><span data-testid=channel-topic></span></header><div data-testid=message-list></div><label>Message<input id=message-input data-testid=message-input placeholder="Message #general"></label><button class=primary data-button-role=primary data-button-role=primary data-testid=send-btn>Send</button></main><aside hidden class=thread data-testid=thread-panel><button class=secondary data-button-role=secondary data-button-role=secondary data-testid=close-thread>Close</button><div id=thread-list></div><label>Reply<input data-testid=thread-input placeholder="Reply"></label><button class=primary data-button-role=primary data-testid=thread-send>Reply</button></aside></div><section id="pinned-panels" hidden>
<form data-testid="workspace-create-form"><h3>Create your workspace</h3><label>Workspace slug<input name="slug" placeholder="workspace-slug"></label><label>Workspace name<input name="name" placeholder="Workspace name"></label><button class="primary" data-button-role="primary" data-testid="workspace-create-submit">Create workspace</button></form><div data-testid="empty-state-create-workspace"></div><form data-testid="join-workspace-form"></form><button class="primary" data-button-role="primary" data-testid="join-workspace-submit">Join workspace</button>
<button class="secondary" data-button-role="secondary" data-testid="workspace-settings-btn">Workspace settings</button><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-close">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button class="primary" data-button-role="primary" data-testid="workspace-general-submit">Save</button>
<button class="secondary" data-button-role="secondary" data-testid="channel-settings-btn">Channel settings</button><h3 data-testid="channel-settings-title">Channel settings</h3><button class="secondary" data-button-role="secondary" data-testid="channel-settings-close">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"></form><input data-testid="channel-add-member-input"><button class="primary" data-button-role="primary" data-testid="channel-add-member-submit">Add member</button><input data-testid="channel-topic-input"><button class="primary" data-button-role="primary" data-testid="channel-topic-submit">Save topic</button><button class="danger" data-button-role="danger" data-testid="archive-channel-btn">Archive</button><button class="secondary" data-button-role="secondary" data-testid="unarchive-channel-btn">Unarchive</button>
<input type="checkbox" data-testid="create-channel-private">

<button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button class="secondary" data-button-role="secondary" data-testid="create-invitation-btn">Create invitation</button><form data-testid="create-invitation-form"></form><button class="primary" data-button-role="primary" data-testid="create-invitation-submit">Create</button><div data-testid="invitations-list"></div>
</section><div id="create-channel-modal"></div><div id="channel-settings-modal"></div><div id="workspace-settings-modal"></div><div id="create-invitation-form"></div><script>
let T=localStorage.getItem('huddle.token'),ws,cur,me,editing=false;document.querySelector('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]');let signup=f.dataset.mode!=='signup';f.dataset.mode=signup?'signup':'login';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Sign in';document.querySelector('[data-testid=auth-toggle]').textContent=signup?'Use login':'Sign up'};const $=x=>document.querySelector(x),api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:'Bearer '+T,'Content-Type':'application/json'};let r=await fetch('/api'+u,o);return [r.status,await r.json()]};
async function load(){let [,m]=await api('/auth/me');me=m.user;$('[data-testid=current-user]').textContent=me.display_name;let [,a]=await api('/workspaces');if(!a.workspaces?.length){let f=$('[data-testid=workspace-create-form]');let pp=document.getElementById('pinned-panels');pp.hidden=false;f.classList.add('active');f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let [,x]=await api('/workspaces',{method:'POST',body:JSON.stringify(d)});if(x.workspace){f.classList.remove('active');cur=x.workspace.slug;load()}};return}cur=a.workspaces[0].slug;let [,d]=await api('/workspaces/'+cur);$('.side h2').textContent=d.workspace.name;renderChannels(d.channels);openCh(d.channels[0])}
function renderChannels(cs){let z=$('[data-testid=channel-list]');z.innerHTML='';cs.forEach(c=>{let e=document.createElement('div');e.className='entry';e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;e.onclick=()=>openCh(c);z.append(e)})}
async function openCh(c){if(!c||!c.id)return;window.currentChannel=c;window.ch=c.id;$('.main h2').textContent='#'+c.name;$('.main [data-testid=channel-topic]').textContent=c.topic||'';let [,d]=await api('/channels/'+c.id+'/messages');let l=$('[data-testid=message-list]');l.innerHTML=d.messages.length?'':'<div data-testid=channel-empty-state>No messages yet. Start the conversation.</div>';d.messages.reverse().forEach(draw)}
function draw(m){let e=document.createElement('div');e.className='msg';e.dataset.testid='message';e.dataset.id=m.id;e.dataset.messageId=m.id;e.innerHTML='<span class=avatar data-testid=message-avatar>'+m.author.username[0]+'</span><b data-testid=message-author>'+m.author.display_name+'</b> <small data-testid=message-time>'+new Date(m.created_at).toLocaleString()+'</small><div data-testid=message-body>'+m.body+'</div>'+(m.edited_at?'<span data-testid=message-edited> (edited)</span>':'')+'<button data-testid=open-thread-btn>Thread</button> <button data-testid=reaction-button>😀</button> <button data-testid=message-edit-btn>Edit</button> <button data-testid=message-delete-btn>Delete</button>';e.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async x=>{if(x.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});openCh(window.currentChannel)}}};e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});e.remove()};e.querySelector('[data-testid=open-thread-btn]').onclick=()=>thread(m);e.querySelector('[data-testid=reaction-button]').onclick=async()=>{let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂','🔥','✅'].forEach(x=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=x;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:x})});p.remove();openCh(ch)};p.append(b)});e.append(p)};$('[data-testid=message-list]').append(e)}
async function thread(m){$('.thread').hidden=false;let [,d]=await api('/messages/'+m.id+'/replies');$('#thread-list').innerHTML=d.replies.map(x=>'<div data-testid="message"><span data-testid="message-body">'+x.body+'</span></div>').join('');$('[data-testid=thread-send]').onclick=async()=>{let v=$('[data-testid=thread-input]').value;if(v)await api('/channels/'+ch+'/messages',{method:'POST',body:JSON.stringify({body:v,parent_id:m.id})});thread(m)}}
$('[data-testid=auth-submit]').onclick=async()=>{let u=$('#username').value,p=$('#password').value,reg=$('[data-testid=auth-form]').dataset.mode==='signup';let [s,d]=await api('/auth/'+(reg?'register':'login'),{method:'POST',body:JSON.stringify({username:u,password:p,display_name:$('#display').value})});if(s<300){T=d.token;localStorage.setItem('huddle.token',T);$('#auth-modal').hidden=true;$('#app').hidden=false;load()}else $('#auth-error').textContent='Please check your username and password.'};$('[data-testid=send-btn]').onclick=async()=>{let v=$('#message-input').value;if(v.trim()){await api('/channels/'+ch+'/messages',{method:'POST',body:JSON.stringify({body:v})});$('#message-input').value='';openCh(window.currentChannel||{id:window.ch,name:$('.main h2').textContent.replace(/^#/,'') ,topic:$('.main [data-testid=channel-topic]').textContent})}};$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-form').hidden=false;$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-form').hidden=true;$('[data-testid=create-channel-submit]').onclick=async e=>{e.preventDefault();let [,x]=await api('/workspaces/'+cur+'/channels',{method:'POST',body:JSON.stringify({name:$('#chname').value})});if(x.channel){$('#create-channel-form').hidden=true;cur=cur;let c=x.channel;renderChannels([...(document.querySelectorAll('[data-testid=channel-entry]'))].map(e=>({id:e.dataset.channelId,name:e.dataset.channelName,is_private:false,is_dm:false,topic:'',is_archived:false,workspace_id:0})).concat([c]));openCh(c)}else $('#create-channel-error').textContent='Channel name already exists.'};$('[data-testid=close-thread]').onclick=()=>$('.thread').hidden=true;if(T){$('#auth-modal').hidden=true;$('#app').hidden=false;load()}
</script></body></html>
