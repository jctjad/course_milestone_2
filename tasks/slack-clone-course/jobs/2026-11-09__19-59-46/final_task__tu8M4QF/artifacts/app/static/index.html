<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}.auth-toggle{background:#3f0e40;color:#fff}.app{display:flex;height:100vh}.side{width:250px;background:#3f0e40;color:#fff;padding:18px}.content{flex:1;padding:24px;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:18px}input,select{padding:9px;margin:4px;border:1px solid #bbb;border-radius:4px}label{display:block;margin:8px 0}#channel-list div{padding:8px;cursor:pointer}.message-row{padding:12px;border-bottom:1px solid #eee}.toolbar{float:right}.toolbar button{padding:4px;margin-left:3px;background:#1264a3;color:#fff}[data-testid=thread-reply-count]{background:#1264a3;color:#fff;padding:4px 8px}.avatar{display:inline-block;width:28px;height:28px;border-radius:50%;background:#1264a3;color:#fff;text-align:center;padding-top:6px;margin-right:8px}.topic{color:#666}form{margin:10px 0}
</style></head><body>
<section id="auth-modal"><form data-testid="auth-form" data-mode="signup"><h1>Huddle</h1><label>Username <input name="username" placeholder="Username" required></label><label>Password <input name="password" type="password" placeholder="Password" required></label><label class="signup-only">Display name <input name="display_name" placeholder="Display name"></label><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button id="auth-toggle" class="auth-toggle" data-testid="auth-toggle" type="button">Have an account? Log in</button><div id="auth-error" data-testid="auth-error" hidden></div></form></section>
<div class="app" hidden><aside class="side" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Log out</button><hr><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form" hidden><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button></form><button data-testid="empty-state-create-workspace" data-button-role="primary" hidden>Create workspace</button><form data-testid="join-workspace-form" hidden><input name="workspace" placeholder="Workspace slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span data-testid="join-workspace-error"></span></form></aside>
<main class="content"><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><h2 data-testid="channel-title"># general</h2><div class="topic" data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div data-testid="message-list"></div><div data-testid="channel-empty-state" hidden>No messages yet. Start the conversation.</div><form id="message-form"><label>Message <input data-testid="message-input" placeholder="Message #general"></label><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><input data-testid="thread-input" placeholder="Reply"><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close thread</button></aside></div>
<div id="create-channel-modal" hidden><form data-testid="create-channel-form"><input name="name" placeholder="Channel name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div id="create-channel-error" data-testid="create-channel-error" hidden></div><button data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button data-testid="create-channel-cancel" data-button-role="secondary" type="button">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h3 data-testid="channel-settings-title">Channel settings</h3><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" hidden><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div></div>
<script>
const $=s=>document.querySelector(s), A='/api';let token=localStorage.getItem('huddle.token'),me=null,work=null,cur=null,msgs=[];
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(A+path,opt);return [r,await r.json().catch(()=>{})]}
function body(f){return Object.fromEntries(new FormData(f))}
function norm(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,32)}
function showApp(){ $('#auth-modal').hidden=true;$('.app').hidden=false }
function showAuth(){ $('#auth-modal').hidden=false;$('.app').hidden=true }
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]) )}
function renderMessages(){let box=$('[data-testid=message-list]');if(!msgs.length){box.innerHTML='';$('[data-testid=channel-empty-state]').hidden=false;return}$('[data-testid=channel-empty-state]').hidden=true;box.innerHTML=msgs.slice().reverse().map(m=>`<div class="message-row" data-testid="message" data-message-id="${m.id}"><span class="avatar" data-testid="message-avatar">${esc((m.author.display_name||'?')[0])}</span><b data-testid="message-author">${esc(m.author.display_name)}</b> <small data-testid="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><span class="toolbar"><button data-testid="open-thread-btn" data-id="${m.id}">Thread</button><button data-testid="reaction-button" data-id="${m.id}" aria-label="Add reaction">😊</button><button data-testid="message-edit-btn" data-id="${m.id}">Edit</button><button data-testid="message-delete-btn" data-id="${m.id}">Delete</button></span><div data-testid="message-body">${esc(m.body)}</div>${m.reply_count?`<button data-testid="thread-reply-count" data-id="${m.id}">${m.reply_count} ${m.reply_count===1?'reply':'replies'}</button>`:''}${m.edited_at?'<small data-testid="message-edited">edited</small>':''}${(m.reactions||[]).map(r=>`<span data-testid="reaction-chip">${esc(r.emoji)} ${r.count}</span>`).join('')}</div>`).join('')}
async function openChannel(c){cur=c;$('#create-channel-modal').hidden=true;$('[data-testid=channel-title]').textContent='# '+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let [r,d]=await api('/channels/'+c.id+'/messages');msgs=d.messages||[];renderMessages()}
async function load(){if(!token){showAuth();return}let [r,d]=await api('/auth/me');if(!r.ok){token=null;showAuth();return}me=d.user;showApp();$('[data-testid=current-user]').textContent=me.display_name;let [wr,wd]=await api('/workspaces');if(!wd.workspaces?.length){$('[data-testid=workspace-create-form]').hidden=false;return}work=wd.workspaces[0];$('[data-testid=workspace-header]').textContent=work.name;let [xr,x]=await api('/workspaces/'+work.slug);let list=$('[data-testid=channel-list]');list.innerHTML=x.channels.map(c=>`<div data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${esc(c.name)}" data-channel-topic="${esc(c.topic||'')}">#${esc(c.name)}</div>`).join('');if(x.channels[0])openChannel(x.channels[0])}
$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form'),signup=f.dataset.mode==='signup';f.dataset.mode=signup?'login':'signup';$('.signup-only').hidden=signup;$('#auth-submit').textContent=signup?'Log in':'Sign up';$('#auth-toggle').textContent=signup?'Need an account? Sign up':'Have an account? Log in'}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let b=body(e.target),signup=e.target.dataset.mode==='signup';let [r,d]=await api('/auth/'+(signup?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok){let er=$('#auth-error');er.hidden=false;er.textContent=signup?'Password must be at least 8 characters or username is invalid':'Login failed: check username and password';return}token=d.token;localStorage.setItem('huddle.token',token);load()}
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()}
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let b=body(e.target);let [r,d]=await api('/workspaces',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:norm(b.slug),name:b.name})});if(r.ok){work=d.workspace;$('[data-testid=workspace-create-form]').hidden=true;load()}}
$('[data-testid=empty-state-create-workspace]').onclick=()=>{$('[data-testid=workspace-create-form]').hidden=false}
$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').hidden=false
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=body(e.target),name=norm(f.name),[r,d]=await api('/workspaces/'+work.slug+'/channels',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,is_private:$('#create-channel-private').checked})});if(!r.ok){let x=$('#create-channel-error');x.hidden=false;x.textContent='A channel with that name already exists';return}$('#create-channel-error').hidden=true;let [q,x]=await api('/workspaces/'+work.slug);$('[data-testid=channel-list]').innerHTML=x.channels.map(c=>`<div data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${esc(c.name)}" data-channel-topic="${esc(c.topic||'')}">#${esc(c.name)}</div>`).join('');openChannel(d.channel)}
$('[data-testid=channel-list]').onclick=e=>{let x=e.target.closest('[data-testid=channel-entry]');if(x)openChannel({id:x.dataset.channelId,name:x.dataset.channelName,topic:x.dataset.channelTopic||''})}
$('#message-form').onsubmit=async e=>{e.preventDefault();let i=$('[data-testid=message-input]');if(!i.value.trim())return;let [r,d]=await api('/channels/'+cur.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value})});if(r.ok){i.value='';msgs.unshift(d.message);renderMessages()}}
$('[data-testid=message-list]').onclick=async e=>{let id=e.target.dataset.id;if(!id)return;let m=msgs.find(x=>x.id==id);if(e.target.matches('[data-testid=message-delete-btn]')){await api('/messages/'+id,{method:'DELETE'});msgs=msgs.filter(x=>x.id!=id);renderMessages()}if(e.target.matches('[data-testid=message-edit-btn]')){let row=e.target.closest('[data-testid=message]'),old=row.querySelector('[data-testid=message-body]');let inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=m.body;old.replaceWith(inp);inp.focus();inp.onkeydown=async k=>{if(k.key==='Escape')renderMessages();if(k.key==='Enter'){let [r,d]=await api('/messages/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:inp.value})});if(r.ok){Object.assign(m,d.message);renderMessages()}}}}}
load();

document.addEventListener('click',async e=>{
 if(e.target.matches('[data-testid=open-thread-btn]')||e.target.matches('[data-testid=thread-reply-count]')){let id=e.target.dataset.id;let m=msgs.find(x=>x.id==id);let [,d]=await api('/messages/'+id+'/replies');$('#thread-messages').innerHTML=(d.replies||[]).map(x=>`<div data-testid="message" data-message-id="${x.id}"><span data-testid="message-avatar" class="avatar">${esc((x.author.display_name||'?')[0])}</span><b data-testid="message-author">${esc(x.author.display_name)}</b><div data-testid="message-body">${esc(x.body)}</div></div>`).join('');$('[data-testid=thread-panel]').hidden=false;$('[data-testid=thread-panel]').dataset.parent=id}
 if(e.target.matches('[data-testid=reaction-button]')){let row=e.target.closest('[data-testid=message]');let old=row.querySelector('[data-testid=emoji-picker]');if(old){old.remove();return}let p=document.createElement('span');p.dataset.testid='emoji-picker';p.innerHTML=['😀','😊','👍','❤️','🎉','🚀','😂','🔥'].map(x=>`<button data-testid="emoji-option" data-emoji="${x}">${x}</button>`).join('');e.target.after(p)}
 if(e.target.matches('[data-testid=emoji-option]')){let row=e.target.closest('[data-testid=message]'),id=row.dataset.messageId;await api('/messages/'+id+'/reactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({emoji:e.target.dataset.emoji})});row.querySelector('[data-testid=emoji-picker]').remove();let c=msgs.find(x=>x.id==id);if(c){c.reactions=c.reactions||[];let r=c.reactions.find(x=>x.emoji===e.target.dataset.emoji);if(r)r.count++;else c.reactions.push({emoji:e.target.dataset.emoji,count:1});renderMessages()}}
})
$('[data-testid=thread-send]').onclick=async()=>{let p=$('[data-testid=thread-panel]'),i=$('[data-testid=thread-input]');if(!i.value.trim())return;let [r,d]=await api('/channels/'+cur.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:i.value,parent_id:Number(p.dataset.parent)})});if(r.ok){i.value='';let [,q]=await api('/messages/'+p.dataset.parent+'/replies');$('#thread-messages').innerHTML=(q.replies||[]).map(x=>`<div data-testid="message"><b>${esc(x.author.display_name)}</b><div data-testid="message-body">${esc(x.body)}</div></div>`).join('');let [,h]=await api('/channels/'+cur.id+'/messages');msgs=h.messages||[];renderMessages()}}
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true}
</script></body></html>
