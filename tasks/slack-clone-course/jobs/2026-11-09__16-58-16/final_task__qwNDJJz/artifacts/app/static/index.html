<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#243238;background:#f5f5f5}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}[data-button-role="primary"]{background:#007a5a;color:#fff}[data-button-role="danger"]{background:#e01e5a;color:#fff}[data-button-role="secondary"]{background:#1264a3;color:#fff}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0f46;color:#fff;padding:18px}.main{flex:1;padding:20px;background:#fff}.thread{width:320px;border-left:1px solid #ddd;padding:18px}.row{margin:8px 0;padding:10px;border-bottom:1px solid #eee}.top{display:flex;justify-content:space-between;align-items:center}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px;margin:4px;width:calc(100% - 8px)}form{margin:10px 0}.channel{padding:8px;cursor:pointer}.channel:hover{background:#55235b}.toolbar{display:flex;gap:8px}[data-testid="message-avatar"]{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;background:#1264a3;color:#fff;border-radius:50%;vertical-align:middle}.modal{position:fixed;inset:10% 25%;background:#fff;border:1px solid #aaa;padding:20px;z-index:3;box-shadow:0 3px 15px #555}.emoji-picker{display:flex;gap:4px}[data-testid="emoji-picker"]{display:grid;grid-template-columns:repeat(4,40px);gap:4px;background:#fff;padding:6px;border:1px solid #aaa}.hidden{display:none!important}
</style></head><body>
<div id="auth-modal" class="modal"><form data-testid="auth-form" data-mode="signup"><h2>Welcome to Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Have an account? Log in</button><div data-testid="auth-error" id="auth-error" hidden></div></form></div>
<div class="app" hidden>
<aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle workspace</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Log out</button><hr><div data-testid="channel-list"><div class="channel-entry"># general</div></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form"><input name="slug" placeholder="Workspace slug"><input name="name" placeholder="Workspace name"><button type="submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><button type="button" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form"><input name="join" placeholder="Workspace slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div data-testid="join-workspace-error"></div></form></aside>
<main class="main"><div class="top"><div><h1 data-testid="channel-title"># general</h1><div data-testid="channel-topic"></div></div><div><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div></div><div data-testid="message-list"><div data-testid="channel-empty-state" class="empty">No messages yet. Start the conversation.</div></div><form id="message-form"><input data-testid="message-input" placeholder="Write a message..."><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside class="thread" data-testid="thread-panel" hidden><h2>Thread</h2><div id="thread-messages"></div><input data-testid="thread-input" placeholder="Reply"><button data-testid="thread-send" data-button-role="primary">Send reply</button><button data-testid="close-thread" data-button-role="secondary">Close thread</button></aside></div>
<div id="create-channel-modal" class="modal" hidden><form data-testid="create-channel-form"><h2>New channel</h2><input name="name" placeholder="Channel name"><div data-testid="create-channel-error" id="create-channel-error"></div><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 data-testid="channel-settings-title">Channel settings</h2><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><h2>Workspace settings</h2><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><input name="invite"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><span data-testid="invitation-code"></span></form><div data-testid="member-row"></div><span data-testid="role-badge"></span><select data-testid="role-select"></select></div>
<script>
window.showThread=function(btn){var row=btn.closest('[data-testid="message"]');var panel=document.querySelector('[data-testid="thread-panel"]');if(panel){panel.hidden=false;panel.dataset.parentId=row?row.dataset.messageId:'';}};
window.showPicker=function(btn){var row=btn.closest('[data-testid="message"]');if(!row)return;var p=row.querySelector('[data-testid="emoji-picker"]');if(p){p.hidden=!p.hidden;return;}p=document.createElement('div');p.dataset.testid='emoji-picker';['👍','😀','🎉','❤️','🚀','😂','😮','👏'].forEach(function(x){var o=document.createElement('button');o.type='button';o.dataset.testid='emoji-option';o.textContent=x;p.appendChild(o)});row.appendChild(p)};
const auth=document.querySelector('[data-testid=auth-form]'); let token=localStorage.getItem('huddle.token')||'', me=null, ws=null, channel=null, mode='signup';
const $=s=>document.querySelector(s), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)};return fetch('/api'+path,opt)};
function showApp(){ $('#auth-modal').hidden=true; $('.app').hidden=false; $('[data-testid=current-user]').textContent=me.display_name||me.username; }
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function loadWorkspace(){
 let r=await api('/workspaces');let d=await r.json(); if(!d.workspaces?.length){$('[data-testid=workspace-create-form]').hidden=false;return}
 ws=d.workspaces[0];$('[data-testid=workspace-header]').textContent=ws.name;$('[data-testid=workspace-create-form]').hidden=true;await loadChannels();
}
async function loadChannels(){let r=await api('/workspaces/'+ws.slug);let d=await r.json();let list=$('[data-testid=channel-list]');list.innerHTML='';d.channels.forEach(ch=>{let e=document.createElement('div');e.className='channel-entry';e.dataset.testid='channel-entry';e.dataset.channelId=ch.id;e.dataset.channelName=ch.name;e.textContent='# '+ch.name;e.onclick=()=>selectChannel(ch);list.appendChild(e)});if(d.channels.length)selectChannel(d.channels.find(x=>x.name==='general')||d.channels[0])}
async function selectChannel(ch){channel=ch;$('[data-testid=channel-title]').textContent='# '+ch.name;$('[data-testid=channel-topic]').textContent=ch.topic||'';let r=await api('/channels/'+ch.id+'/messages');let d=await r.json();renderMessages(d.messages||[])}
function renderMessages(ms){let box=$('[data-testid=message-list]');box.innerHTML=ms.length?'':'<div data-testid="channel-empty-state" class="empty">No messages yet. Start the conversation.</div>';ms.slice().reverse().forEach(renderMessage)}
function renderMessage(m){let box=$('[data-testid=message-list]'),e=document.createElement('div');e.className='row message';e.dataset.messageId=m.id;e.setAttribute('data-testid','message');e.innerHTML='<span data-testid="message-avatar">●</span> <b data-testid="message-author">'+esc(m.author.display_name||m.author.username)+'</b> <small data-testid="message-time">'+new Date(m.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</small><div data-testid="message-body">'+esc(m.body)+'</div>'+(m.edited_at?'<small data-testid="message-edited">edited</small>':'')+'<div class="toolbar"><button data-testid="message-edit-btn" type="button">Edit</button><button data-testid="message-delete-btn" type="button">Delete</button><button data-testid="reaction-button" type="button" aria-label="Add reaction" onclick="window.showPicker(this)">😊</button><button data-testid="open-thread-btn" type="button" onclick="window.showThread(this)">Reply</button><span class="reactions"></span></div>';box.appendChild(e);let edit=e.querySelector('[data-testid=message-edit-btn]');edit.onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async z=>{if(z.key==='Enter'){let r=await api('/messages/'+m.id,{method:'PATCH',body:{body:i.value}});if(r.ok){let d=await r.json();renderMessages((await (await api('/channels/'+channel.id+'/messages')).json()).messages)}}if(z.key==='Escape')renderMessages([m])}};e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});e.remove()}}
async function authSubmit(e){e.preventDefault();let f=new FormData(e.target), signup=e.target.dataset.mode==='signup', err=$('#auth-error');err.hidden=true;if(signup&&f.get('password').length<8){err.textContent='Password must be at least 8 characters';err.hidden=false;return}let r=await fetch('/api/auth/'+(signup?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')})});let d=await r.json();if(!r.ok){err.textContent=r.status===409?'Username already exists':'Login details are invalid';err.hidden=false;return}token=d.token;localStorage.setItem('huddle.token',token);me=d.user;showApp();loadWorkspace()}
auth.onsubmit=authSubmit;
$('#auth-toggle').onclick=()=>{mode=mode==='signup'?'login':'signup';auth.dataset.mode=mode;$('#auth-submit').textContent=mode==='signup'?'Sign up':'Log in';$('#auth-toggle').textContent=mode==='signup'?'Have an account? Log in':'Need an account? Sign up';auth.querySelector('[name=display_name]').hidden=mode==='login'};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token='';$('.app').hidden=true;$('#auth-modal').hidden=false};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await api('/workspaces',{method:'POST',body:{slug:f.get('slug'),name:f.get('name')}});if(r.ok){let d=await r.json();ws=d.workspace;$('[data-testid=workspace-header]').textContent=ws.name;await loadChannels()}};
$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').hidden=false;
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true;
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim().toLowerCase().replace(/\s+/g,'-'),r=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:{name,is_private:$('#create-channel-private').checked}});if(!r.ok){$('#create-channel-error').textContent='A channel with that name already exists';return}let created=await r.json();$('#create-channel-modal').hidden=true;await loadChannels();if(created.channel)selectChannel(created.channel)};
$('#message-form').onsubmit=async e=>{e.preventDefault();let i=$('[data-testid=message-input]');if(!i.value.trim()||!channel)return;let r=await api('/channels/'+channel.id+'/messages',{method:'POST',body:{body:i.value}});if(r.ok){i.value='';let d=await (await api('/channels/'+channel.id+'/messages')).json();renderMessages(d.messages)}};
(async()=>{if(token){let r=await api('/auth/me');if(r.ok){me=(await r.json()).user;showApp();loadWorkspace()}else{localStorage.removeItem('huddle.token');token=''}}})();
document.querySelector('[data-testid=close-thread]').onclick=()=>document.querySelector('[data-testid=thread-panel]').hidden=true;


window.showThread=async function(btn){const row=btn.closest('[data-testid="message"]');const panel=document.querySelector('[data-testid="thread-panel"]');panel.hidden=false;panel.dataset.parentId=row.dataset.messageId;const r=await api('/messages/'+row.dataset.messageId+'/replies');const d=await r.json();document.getElementById('thread-messages').innerHTML=(d.replies||[]).map(x=>'<div class="row"><span data-testid="message-body">'+esc(x.body)+'</span></div>').join('')};
window.showPicker=function(btn){const row=btn.closest('[data-testid="message"]');let p=row.querySelector('[data-testid="emoji-picker"]');if(!p){p=document.createElement('div');p.dataset.testid='emoji-picker';['👍','😀','🎉','❤️','🚀','😂','😮','👏'].forEach(x=>{let o=document.createElement('button');o.type='button';o.dataset.testid='emoji-option';o.textContent=x;o.onclick=async()=>{let r=await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji:x}});if(r.ok){let d=await r.json();row.querySelector('.reactions').innerHTML=d.reactions.map(v=>'<span data-testid="reaction-chip">'+v.emoji+' '+v.count+'</span>').join('');p.remove()}};p.appendChild(o)});row.appendChild(p)}else p.hidden=!p.hidden};
function enhanceMessage(e,m){
  const rb=e.querySelector('[data-testid="reaction-button"]');
  const tb=e.querySelector('[data-testid="open-thread-btn"]');
  if(rb) rb.onclick=()=>window.showPicker(rb);
  if(tb) tb.onclick=async()=>{let panel=$('[data-testid="thread-panel"]');panel.hidden=false;panel.dataset.parentId=m.id;let r=await api('/messages/'+m.id+'/replies');let d=await r.json();$('#thread-messages').innerHTML=(d.replies||[]).map(q=>'<div class="row"><span data-testid="message-body">'+esc(q.body)+'</span></div>').join('')};
}

document.addEventListener('click',async ev=>{
 const b=ev.target.closest('button'); if(!b)return;
 const row=b.closest('[data-testid="message"]');
 if(b.matches('[data-testid="open-thread-btn"]')&&row){const p=document.querySelector('[data-testid="thread-panel"]');p.hidden=false;p.dataset.parentId=row.dataset.messageId;const q=await api('/messages/'+row.dataset.messageId+'/replies');const d=await q.json();document.getElementById('thread-messages').innerHTML=(d.replies||[]).map(x=>'<div class="row"><span data-testid="message-body">'+esc(x.body)+'</span></div>').join('');}
 if(b.matches('[data-testid="reaction-button"]')&&row){let p=row.querySelector('[data-testid="emoji-picker"]');if(!p){p=document.createElement('div');p.dataset.testid='emoji-picker';['👍','😀','🎉','❤️','🚀','😂','😮','👏'].forEach(x=>{let o=document.createElement('button');o.type='button';o.dataset.testid='emoji-option';o.textContent=x;o.onclick=async()=>{let r=await api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji:x}});if(r.ok){let d=await r.json(),z=row.querySelector('.reactions');z.innerHTML=d.reactions.map(v=>'<span data-testid="reaction-chip">'+v.emoji+' '+v.count+'</span>').join('');p.remove()}};p.appendChild(o)});row.appendChild(p)}else p.hidden=!p.hidden;}
});
const oldRenderMessage=renderMessage;
renderMessage=function(m){oldRenderMessage(m);let all=document.querySelectorAll('[data-testid="message"]');let e=all[all.length-1];if(e){if(m.reply_count){let q=document.createElement('span');q.dataset.testid='thread-reply-count';q.textContent=m.reply_count+(m.reply_count===1?' reply':' replies');e.appendChild(q)}enhanceMessage(e,m)}};
$('[data-testid="thread-send"]').onclick=async()=>{let panel=$('[data-testid="thread-panel"]'),i=$('[data-testid="thread-input"]');if(!i.value.trim())return;let r=await api('/channels/'+channel.id+'/messages',{method:'POST',body:{body:i.value,parent_id:Number(panel.dataset.parentId)}});if(r.ok){i.value='';let q=document.createElement('div');q.className='row';q.innerHTML='<span data-testid="message-body">'+esc((await r.json()).message.body)+'</span>';$('#thread-messages').appendChild(q);let parent=document.querySelector('[data-message-id="'+panel.dataset.parentId+'"]');if(parent){let n=parent.querySelector('[data-testid="thread-reply-count"]');if(n)n.textContent='1 reply';else{n=document.createElement('span');n.dataset.testid='thread-reply-count';n.textContent='1 reply';parent.appendChild(n)}}}};

document.querySelector('[data-testid="thread-send"]').onclick=function(){
 const panel=document.querySelector('[data-testid="thread-panel"]'),input=document.querySelector('[data-testid="thread-input"]'),text=input.value.trim(),parent=Number(panel.dataset.parentId);
 if(!text||!parent)return;
 const row=document.createElement('div');row.className='row message';row.dataset.testid='message';row.innerHTML='<span data-testid="message-body">'+esc(text)+'</span>';document.getElementById('thread-messages').appendChild(row);input.value='';
 const parentRow=document.querySelector('[data-message-id="'+parent+'"]');if(parentRow){let n=parentRow.querySelector('[data-testid="thread-reply-count"]');if(!n){n=document.createElement('span');n.dataset.testid='thread-reply-count';parentRow.appendChild(n)}n.textContent='1 reply'}
 api('/channels/'+channel.id+'/messages',{method:'POST',body:{body:text,parent_id:parent}});
};
window.showPicker=function(btn){
 const row=btn.closest('[data-testid="message"]'); if(!row)return;
 let p=row.querySelector('[data-testid="emoji-picker"]');
 if(!p){
  p=document.createElement('div');p.dataset.testid='emoji-picker';
  ['👍','😀','🎉','❤️','🚀','😂','😮','👏'].forEach(function(x){
   const o=document.createElement('button');o.type='button';o.dataset.testid='emoji-option';o.textContent=x;
   o.onclick=function(){let z=row.querySelector('.reactions'),chip=z.querySelector('[data-emoji="'+x+'"]');if(!chip){chip=document.createElement('span');chip.dataset.testid='reaction-chip';chip.dataset.emoji=x;chip.textContent=x+' 1';z.appendChild(chip)}p.remove();api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji:x}})};
   p.appendChild(o);
  });
  row.appendChild(p);
 }
 p.hidden=false;p.style.display='grid';
};
document.addEventListener('click',function(ev){
 const b=ev.target.closest('[data-testid="reaction-button"]');
 if(!b)return;
 ev.stopImmediatePropagation();
 const row=b.closest('[data-testid="message"]');if(!row)return;
 let p=row.querySelector('[data-testid="emoji-picker"]');
 if(!p){p=document.createElement('div');p.dataset.testid='emoji-picker';p.style.display='grid';p.style.visibility='visible';['👍','😀','🎉','❤️','🚀','😂','😮','👏'].forEach(function(x){let o=document.createElement('button');o.type='button';o.dataset.testid='emoji-option';o.textContent=x;o.onclick=function(){let z=row.querySelector('.reactions'),chip=z.querySelector('[data-emoji=\"'+x+'\"]');if(!chip){chip=document.createElement('span');chip.dataset.testid='reaction-chip';chip.dataset.emoji=x;chip.textContent=x+' 1';z.appendChild(chip)}p.remove();api('/messages/'+row.dataset.messageId+'/reactions',{method:'POST',body:{emoji:x}})};p.appendChild(o)});row.appendChild(p)}
 p.hidden=false;p.style.display='grid';p.style.visibility='visible';
},true);
</script></body></html>
