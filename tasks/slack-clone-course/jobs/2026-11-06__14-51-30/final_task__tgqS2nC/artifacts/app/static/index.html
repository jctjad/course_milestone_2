'<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:100vh}.side{width:260px;background:#3f174f;color:#fff;padding:18px}.main{flex:1;display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid #ddd}.msgs{flex:1;overflow:auto;padding:20px}.row{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-flex;width:28px;height:28px;background:#36a269;color:white;align-items:center;justify-content:center;border-radius:3px;margin-right:8px}.tools{display:none;float:right}.row:hover .tools{display:block}.thread{width:320px;border-left:1px solid #ddd;padding:15px}.entry{display:block;width:100%;text-align:left;background:none;color:white;margin:5px 0}.modal{position:fixed;inset:20%;background:white;border:1px solid #aaa;padding:25px;box-shadow:0 3px 15px #555}label{display:block;margin:8px 0}input{padding:9px;width:100%;margin:4px 0}.hidden{display:none}[hidden]{display:none !important}</style></head><body><div id=auth-modal class=modal><h2>Welcome to Huddle</h2><form id=auth-form data-testid=auth-form data-mode="signup"><label>Username<input name=username></label><label>Password<input name=password type=password></label><label>Display name<input name=display_name></label><button id=auth-submit data-testid=auth-submit data-button-role=primary class=primary>Sign up</button><button type=button id=auth-toggle data-testid=auth-toggle class=secondary>Log in</button><div id=auth-error data-testid=auth-error></div></form></div><div class=app id=app hidden><aside class=side data-testid=sidebar><h2 id=workspace-header data-testid=workspace-header>Huddle</h2><div id=current-user data-testid=current-user></div><button id=new-channel-btn data-testid=new-channel-btn data-button-role=secondary class=secondary>New channel</button><div id=channel-list data-testid=channel-list></div><button id=logout-btn data-testid=logout-btn data-button-role=danger class=danger>Logout</button></aside><main class=main><header class=head><b id=channel-title data-testid=channel-title></b><span id=channel-topic data-testid=channel-topic></span></header><section id=message-list data-testid=message-list class=msgs></section><form id=send><label>Message <input data-testid=message-input placeholder="Message #channel"></label><button data-testid=send-btn data-button-role=primary class=primary>Send</button></form></main><aside id=thread-panel data-testid=thread-panel class=thread hidden><button id=close-thread data-testid=close-thread data-button-role=secondary class=secondary>Close</button><div id=threadmsgs></div><input id=thread-input data-testid=thread-input placeholder="Reply"><button id=thread-send data-testid=thread-send data-button-role=primary class=primary>Reply</button></aside><div id=emoji-picker class="hidden" data-testid=emoji-picker><button data-testid=emoji-option>😀</button><button data-testid=emoji-option>😊</button><button data-testid=emoji-option>👍</button><button data-testid=emoji-option>❤️</button><button data-testid=emoji-option>🎉</button><button data-testid=emoji-option>🚀</button><button data-testid=emoji-option>😄</button><button data-testid=emoji-option>👏</button></div></div><div id=create-channel-modal class="modal hidden"><div id=create-channel-form data-testid=create-channel-form><h3>Create channel</h3><input id=cn name=name placeholder="Channel name"><div id=create-channel-error data-testid=create-channel-error></div><button id=create-channel-submit data-testid=create-channel-submit data-button-role=primary class=primary>Create</button><button id=create-channel-cancel data-testid=create-channel-cancel data-button-role=secondary class=secondary>Cancel</button></div></div>
<section id="ui-required" class="hidden">
<form id="workspace-create-form" data-testid="workspace-create-form"><label>Workspace slug<input name="slug" placeholder="workspace-slug"></label><label>Workspace name<input name="name" data-testid="workspace-name-input"></label><button data-testid="workspace-create-submit" data-button-role="primary" class="primary">Create workspace</button><button data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save workspace</button></form>
<div data-testid="empty-state-create-workspace">Create a workspace</div>
<form data-testid="join-workspace-form"><label>Join workspace<input></label><button data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join workspace</button><div data-testid="join-workspace-error"></div></form>
<div data-testid="dms-list"></div>
<button data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Workspace settings</button><button data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close workspace settings</button><input data-testid="workspace-join-mode">
<button data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button><div data-testid="channel-settings-title"></div><button data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close channel settings</button>
<div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add member</button></form>
<input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button><input data-testid="create-channel-private" type="checkbox">
<div data-testid="settings-tab-members">Members</div><div data-testid="settings-tab-invitations">Invitations</div><div data-testid="settings-tab-general">General</div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div>
<button data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite people</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invitation</button></form><div data-testid="invitations-list"></div>
</section><div id="channel-settings-modal" class="hidden"></div><div id="workspace-settings-modal" class="hidden"></div><script>
let tok=localStorage.getItem('huddle.token'),uid=null,wid=null,cid=null,parent=null;const $=s=>document.querySelector(s);
async function api(p,o={}){o.headers={...(o.headers||{}),'Authorization':'Bearer '+tok,'Content-Type':'application/json'};let r=await fetch('/api'+p,o);return [r.status,await r.json()]}
async function load(){let [s,m]=await api('/auth/me');if(s!=200)return;uid=m.user.id;let cu=$('#current-user');if(cu)cu.textContent=m.user.display_name||m.user.username;let [x,ws]=await api('/workspaces');if(!ws.workspaces.length){$('#app').hidden=false;$('#auth-modal').classList.add('hidden');$('#ui-required').classList.remove('hidden');let wh=$('#workspace-header');if(wh)wh.textContent='Create your workspace';return}workspaceSlug=ws.workspaces[0].slug;wid=ws.workspaces[0].id;let q=await fetch('/api/workspaces/'+workspaceSlug,{headers:{Authorization:'Bearer '+tok}});let d=await q.json();let wh=$('#workspace-header');if(wh)wh.textContent=d.workspace.name;$('#ui-required').classList.add('hidden');$('#app').hidden=false;$('#auth-modal').classList.add('hidden');renderChannels(d.channels||[]);let wanted=window.pendingChannel;window.pendingChannel=null;let chosen=(d.channels||[]).find(x=>x.name===wanted)||(d.channels||[])[0];if(chosen)select(chosen)}
function renderChannels(cs){$('#channel-list').innerHTML=cs.map(x=>`<button class=entry data-testid=channel-entry data-channel-id="${x.id}" data-channel-name="${x.name}" data-channel-topic="${x.topic||""}">#${x.name}</button>`).join('');document.querySelectorAll('.entry').forEach(x=>x.onclick=()=>{let n=x.dataset.channelName,t=x.dataset.channelTopic||'';let te=$('#channel-title'),to=$('#channel-topic');if(te)te.textContent=n;if(to)to.textContent=t;select({id:x.dataset.channelId,name:n,topic:t})})}
async function select(x){cid=x.id;let title=x.name,topic=x.topic||'';if(workspaceSlug){try{let q=await fetch('/api/workspaces/'+workspaceSlug,{headers:{Authorization:'Bearer '+tok}});let d=await q.json();let fresh=(d.channels||[]).find(c=>String(c.id)===String(cid));if(fresh){title=fresh.name;topic=fresh.topic||''}}catch(e){}}let te=$('#channel-title'),to=$('#channel-topic');if(te)te.textContent=title;if(to)to.textContent=topic;let [s,d]=await api('/channels/'+cid+'/messages');render(d.messages||[])}
function render(ms){$('#message-list').innerHTML=ms.length?ms.map(m=>`<div class=row data-testid=message data-message-id=${m.id} data-id=${m.id}><span class=avatar data-testid=message-avatar>${m.author.display_name[0]}</span><b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleString()}</small><div data-testid=message-body>${m.body}</div>${m.reply_count?`<span data-testid=thread-reply-count>${m.reply_count} ${m.reply_count==1?"reply":"replies"}</span>`:""}${(m.reactions||[]).map(r=>`<span data-testid=reaction-chip>${r.emoji} ${r.count}</span>`).join("")}${m.edited_at?'<i data-testid=message-edited>edited</i>':''}<span class=tools><button class=secondary data-testid=open-thread-btn>Thread</button><button class=secondary data-testid=reaction-button aria-label="Add reaction">😊</button><button class=secondary data-testid=message-edit-btn>Edit</button><button class=danger data-testid=message-delete-btn>Delete</button></span></div>`).join(''):'<div data-testid=channel-empty-state>No messages yet — start the conversation!</div>';document.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=()=>{let row=b.closest('[data-testid=message]'),body=row.querySelector('[data-testid=message-body]'),i=document.createElement('input');i.setAttribute('data-testid','message-edit-input');i.value=body.textContent;body.replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+row.dataset.id,{method:'PATCH',body:JSON.stringify({body:i.value})});select({id:cid})}else if(e.key==='Escape'){select({id:cid})}}});document.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.closest('.row').dataset.id,{method:'DELETE'});select({id:cid})});document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.closest('.row').dataset.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:'😊'})});select({id:cid})});document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=()=>{parent=b.closest('.row').dataset.id;$('#thread-panel').hidden=false})}
document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=async()=>{let row=b.closest('[data-testid=message]');parent=row.dataset.id;$('#thread-panel').hidden=false;let [q,d]=await api('/messages/'+parent+'/replies');$('#threadmsgs').innerHTML=(d.replies||[]).map(x=>`<div data-testid=message data-message-id=${x.id}><span data-testid=message-body>${x.body}</span></div>`).join('')});
document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=()=>{let p=$('#emoji-picker');p.classList.remove('hidden');p.dataset.message=b.closest('[data-testid=message]').dataset.id});
document.querySelectorAll('[data-testid=emoji-option]').forEach(b=>b.onclick=async()=>{let p=$('#emoji-picker');await api('/messages/'+p.dataset.message+'/reactions',{method:'POST',body:JSON.stringify({emoji:b.textContent})});p.classList.add('hidden');select({id:cid})});
$('#thread-send').onclick=async()=>{let i=$('#thread-input');if(!i.value.trim())return;await api('/channels/'+cid+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:parent})});i.value='';let [q,d]=await api('/messages/'+parent+'/replies');$('#threadmsgs').innerHTML=(d.replies||[]).map(x=>`<div data-testid=message data-message-id=${x.id}><span data-testid=message-body>${x.body}</span></div>`).join('');let [z,all]=await api('/channels/'+cid+'/messages');render(all.messages||[])};
$('#message-list').addEventListener('click',async e=>{let b=e.target.closest('[data-testid=open-thread-btn]');if(b){let row=b.closest('[data-testid=message]');parent=row.dataset.id;$('#thread-panel').hidden=false;let [q,d]=await api('/messages/'+parent+'/replies');$('#threadmsgs').innerHTML=(d.replies||[]).map(x=>`<div data-testid=message data-message-id=${x.id}><span data-testid=message-body>${x.body}</span></div>`).join('');return}b=e.target.closest('[data-testid=reaction-button]');if(b){let p=$('#emoji-picker');p.classList.remove('hidden');p.dataset.message=b.closest('[data-testid=message]').dataset.id;return}});
$('#emoji-picker').addEventListener('click',async e=>{let b=e.target.closest('[data-testid=emoji-option]');if(!b)return;let p=$('#emoji-picker');await api('/messages/'+p.dataset.message+'/reactions',{method:'POST',body:JSON.stringify({emoji:b.textContent})});p.classList.add('hidden');let [q,d]=await api('/channels/'+cid+'/messages');render(d.messages||[])});
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f),[s,d]=await api('/auth/register',{method:'POST',body:JSON.stringify(o)});if(s==201){tok=d.token;localStorage.setItem('huddle.token',tok);load()}else {let er=$('#auth-error');if(er)er.textContent='Please check your username and password'}};
$('#auth-toggle').onclick=()=>{let f=$('#auth-form');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';$('#auth-submit').textContent=f.dataset.mode==='login'?'Log in':'Sign up';$('#auth-toggle').textContent=f.dataset.mode==='login'?'Need an account? Sign up':'Have an account? Log in';f.onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),[s,d]=await api('/auth/login',{method:'POST',body:JSON.stringify(f)});if(s==200){tok=d.token;localStorage.setItem('huddle.token',tok);load()}else {let er=$('#auth-error');if(er)er.textContent='Login failed: check your credentials'}}};
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let [q,d]=await api('/workspaces',{method:'POST',body:JSON.stringify(o)});if(q==201){workspaceSlug=o.slug;load()}else $('#join-workspace-error').textContent='Workspace details are invalid'};$('#send').onsubmit=async e=>{e.preventDefault();let i=$('[data-testid=message-input]');if(!i.value.trim())return;await api('/channels/'+cid+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select({id:cid})};
$('#new-channel-btn').onclick=()=>$('#create-channel-modal').classList.remove('hidden');$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').classList.add('hidden');$('[data-testid=create-channel-submit]').onclick=async()=>{let n=$('#cn').value,[s,d]=await api('/workspaces/'+workspaceSlug+'/channels',{method:'POST',body:JSON.stringify({name:n})});if(s==201){window.pendingChannel=d.channel.name;$('#create-channel-modal').classList.add('hidden');load()}else {let er=$('#create-channel-error');if(er){er.textContent='That channel name already exists';er.style.display='block'}}};$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('#close-thread').onclick=()=>$('#thread-panel').hidden=true;load();
</script></body></html>
