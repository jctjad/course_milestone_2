<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.app{display:flex;height:100vh}.sidebar{width:250px;background:#183b56;color:white;padding:20px}.main{flex:1;padding:20px}.thread{width:300px;border-left:1px solid #ddd;padding:15px}button{border:0;padding:9px 14px;border-radius:4px;color:#fff}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}#auth-toggle{background:#1264a3;color:#fff}input{padding:9px;margin:4px 0;border:1px solid #aaa;border-radius:3px}.modal{padding:30px}.msg{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-flex;width:28px;height:28px;background:#36c;color:white;align-items:center;justify-content:center;border-radius:4px;margin-right:8px}.toolbar{float:right}.picker button{background:#eee;color:#222;margin:2px}.toolbar button{background:#1264a3;color:#fff;margin-left:3px}.empty{padding:40px;color:#777}
</style></head><body>
<div id=auth-modal class=modal><form id=auth-form data-testid=auth-form data-mode=signup><h1>Huddle</h1><div id=auth-error data-testid=auth-error></div><label>Username<input name=username required></label><br><label>Password<input name=password type=password required></label><br><label class=display>Display name<input name=display_name></label><br><button id=auth-submit data-testid=auth-submit data-button-role=primary>Sign up</button> <button type=button id=auth-toggle data-testid=auth-toggle>Have an account? Log in</button></form></div>
<div class=app hidden id=app><aside class=sidebar data-testid=sidebar><h2 id=workspace-header data-testid=workspace-header></h2><div id=current-user data-testid=current-user></div><button id=logout-btn data-testid=logout-btn data-button-role=danger>Logout</button><h3>Channels</h3><div id=channel-list data-testid=channel-list></div><div id=dms-list data-testid=dms-list></div><button id=new-channel-btn data-testid=new-channel-btn data-button-role=secondary>New channel</button><form id=workspace-create-form data-testid=workspace-create-form hidden><input name=slug placeholder=Workspace-slug><input name=name placeholder=Workspace-name><button data-testid=workspace-create-submit data-button-role=primary>Create workspace</button></form><button id=empty-state-create-workspace data-testid=empty-state-create-workspace hidden>Create workspace</button><form id=join-workspace-form data-testid=join-workspace-form hidden><button id=join-workspace-submit data-testid=join-workspace-submit data-button-role=primary>Join workspace</button><div data-testid=join-workspace-error></div></form></aside>
<main class=main><header><h2 id=channel-title data-testid=channel-title></h2><span id=channel-topic data-testid=channel-topic></span><button data-testid=channel-settings-btn data-button-role=secondary>Channel settings</button></header><div id=message-list data-testid=message-list></div><label>Message <input id=message-input data-testid=message-input placeholder="Message"></label><button id=send-btn data-testid=send-btn data-button-role=primary>Send</button>
<form id=create-channel-modal data-testid=create-channel-form hidden><input name=name placeholder="Channel name"><label><input id=create-channel-private data-testid=create-channel-private type=checkbox> Private</label><button id=create-channel-submit data-testid=create-channel-submit data-button-role=primary>Create channel</button><button type=button id=create-channel-cancel data-testid=create-channel-cancel data-button-role=secondary>Cancel</button><div id=create-channel-error data-testid=create-channel-error></div></form></main>
<aside id=thread-panel data-testid=thread-panel hidden><button id=close-thread data-testid=close-thread data-button-role=secondary>Close thread</button><div id=thread-list></div><label>Reply <input id=thread-input data-testid=thread-input></label><button id=thread-send data-testid=thread-send data-button-role=primary>Reply</button></aside></div>
<div id=channel-settings-modal hidden><button data-testid=channel-settings-close data-button-role=secondary>Close</button><input id=channel-settings-title data-testid=channel-settings-title><div id=channel-members-list data-testid=channel-members-list></div><form id=channel-add-member-form data-testid=channel-add-member-form><input id=channel-add-member-input data-testid=channel-add-member-input><button id=channel-add-member-submit data-testid=channel-add-member-submit data-button-role=primary>Add</button></form><input id=channel-topic-input data-testid=channel-topic-input><button id=channel-topic-submit data-testid=channel-topic-submit data-button-role=primary>Save topic</button><button id=archive-channel-btn data-testid=archive-channel-btn data-button-role=danger>Archive</button><button id=unarchive-channel-btn data-testid=unarchive-channel-btn data-button-role=secondary>Unarchive</button></div>
<div id=workspace-settings-modal hidden><button data-testid=workspace-settings-close data-button-role=secondary>Close</button><input id=workspace-name-input data-testid=workspace-name-input><select id=workspace-join-mode data-testid=workspace-join-mode></select><button id=workspace-general-submit data-testid=workspace-general-submit data-button-role=primary>Save</button></div><button id=workspace-settings-btn data-testid=workspace-settings-btn data-button-role=secondary hidden>Settings</button>
<div id=settings-tab-members data-testid=settings-tab-members hidden>Members</div><div id=settings-tab-invitations data-testid=settings-tab-invitations hidden>Invitations</div><div id=settings-tab-general data-testid=settings-tab-general hidden>General</div><div id=settings-pane-members data-testid=settings-pane-members hidden></div><div id=settings-pane-invitations data-testid=settings-pane-invitations hidden><button id=create-invitation-btn data-testid=create-invitation-btn data-button-role=secondary>Create invitation</button><form id=create-invitation-form data-testid=create-invitation-form hidden><button id=create-invitation-submit data-testid=create-invitation-submit data-button-role=primary>Create</button></form><div id=invitations-list data-testid=invitations-list></div></div><div id=settings-pane-general data-testid=settings-pane-general hidden></div>
<script>
const $=s=>document.querySelector(s), api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+localStorage.getItem('huddle.token')}}).then(async r=>({r,d:await r.json().catch(()=>({}))}));
let me,work,channels=[],cur,msgs=[],threadParent;
async function load(){let x=await api('/api/auth/me');if(x.r.status!=200)return;me=x.d.user;$('#auth-modal').hidden=true;$('#app').hidden=false;$('#current-user').textContent=me.display_name||me.username;let w=await api('/api/workspaces');if(!w.d.workspaces.length){$('#workspace-create-form').hidden=false;return}work=w.d.workspaces[0];render();let z=await api('/api/workspaces/'+work.slug);channels=z.d.channels;render();select(channels[0])}
function render(){$('#auth-modal').hidden=true;$('#app').hidden=false;$('#workspace-header').textContent=work.name;$('#current-user').textContent=me.display_name||me.username;$('#channel-list').innerHTML=channels.map(c=>`<div class=entry data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="select(channels.find(x=>x.id==${c.id}))">#${c.name}</div>`).join('')}
async function select(c){cur=c;$('#channel-title').textContent='#'+c.name;$('#channel-topic').textContent=c.topic||'';let x=await api('/api/channels/'+c.id+'/messages');msgs=x.d.messages||[];draw()}
function draw(){$('#message-list').innerHTML=msgs.length?msgs.map(m=>`<div class=msg data-testid=message data-message-id="${m.id}"><span class=avatar data-testid=message-avatar>${(m.author.display_name||m.author.username)[0]}</span><b data-testid=message-author>${m.author.display_name||m.author.username}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><span data-testid=message-body>${m.body}</span>${m.edited_at?'<i data-testid=message-edited> edited</i>':''}${m.reply_count?'<span data-testid=thread-reply-count>'+m.reply_count+' '+(m.reply_count==1?'reply':'replies')+'</span>':''}<span class=toolbar><button data-testid=open-thread-btn onclick="openThread(${m.id})">Replies ${m.reply_count||''}</button><button data-testid=reaction-button onclick="react(${m.id})">😊</button><button data-testid=message-edit-btn onclick="editMsg(${m.id})">Edit</button><button data-testid=message-delete-btn onclick="delMsg(${m.id})">Delete</button></span>${m.reactions.map(r=>`<span data-testid=reaction-chip>${r.emoji} ${r.count}</span>`).join('')}</div>`).join(''):'<div data-testid=channel-empty-state class=empty>No messages yet. Start the conversation!</div>'}
async function refresh(){let x=await api('/api/channels/'+cur.id+'/messages');msgs=x.d.messages||[];draw()}
$('#auth-toggle').onclick=()=>{$('#auth-form').dataset.mode=$('#auth-form').dataset.mode==='signup'?'login':'signup';$('#auth-submit').textContent=$('#auth-form').dataset.mode==='signup'?'Sign up':'Log in';$('#auth-toggle').textContent=$('#auth-form').dataset.mode==='signup'?'Have an account? Log in':'Need an account? Sign up';$('.display').hidden=$('#auth-form').dataset.mode==='login'}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),p={username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')};let x=await api('/api/auth/'+($('#auth-form').dataset.mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(p)});if(x.r.status>=300){$('#auth-error').textContent=x.d.error||'Authentication failed';return}localStorage.setItem('huddle.token',x.d.token);me=x.d.user;load()}
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()}
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x=await api('/api/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});if(x.r.status<300){work=x.d.workspace;load()}}
$('#new-channel-btn').onclick=()=>$('[data-testid="create-channel-form"]').hidden=false;$('#create-channel-cancel').onclick=()=>$('[data-testid="create-channel-form"]').hidden=true
$('[data-testid="create-channel-form"]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),n=f.get('name').toLowerCase().trim().replace(/\s+/g,'-'),x=await api('/api/workspaces/'+work.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('#create-channel-private').checked})});if(x.r.status>=300){$('#create-channel-error').textContent='A channel with that name already exists';return}channels.push(x.d.channel);render();select(x.d.channel);e.target.hidden=true}
$('#send-btn').onclick=async()=>{let i=$('#message-input'),b=i.value;if(!b.trim())return;await api('/api/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:b})});i.value='';refresh()}
async function editMsg(id){let el=document.querySelector('[data-message-id="'+id+'"]'),m=msgs.find(x=>x.id==id);if(!el||!m)return;let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;i.setAttribute('aria-label','Edit message');el.querySelector('[data-testid="message-body"]').replaceWith(i);i.focus();i.select();i.onkeydown=async e=>{if(e.key==='Escape'){refresh()}if(e.key==='Enter'){let v=i.value;if(!v.trim()){refresh();return}await api('/api/messages/'+id,{method:'PATCH',body:JSON.stringify({body:v})});await refresh()}}}
async function delMsg(id){await api('/api/messages/'+id,{method:'DELETE'});refresh()}
async function openThread(id){threadParent=id;$('#thread-panel').hidden=false;let x=await api('/api/messages/'+id+'/replies');$('#thread-list').innerHTML=(x.d.replies||[]).map(m=>`<div data-testid=message data-message-id="${m.id}"><span data-testid=message-body>${m.body}</span></div>`).join('')}
$('#close-thread').onclick=()=>$('#thread-panel').hidden=true;$('#thread-send').onclick=async()=>{let i=$('#thread-input');await api('/api/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:threadParent})});i.value='';openThread(threadParent);refresh()}
function react(id){let p=document.createElement('div');p.className='picker';p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂','🔥','✅'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{await api('/api/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();refresh()};p.append(b)});document.body.append(p)}
load();
</script></body></html>
