<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#1d1c1d;background:#f8f8f8}button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}.shell{height:100vh;display:flex;flex-direction:column}.top{height:56px;background:#3f0e40;color:white;display:flex;align-items:center;padding:0 20px;gap:20px}.layout{display:flex;flex:1;min-height:0}.side{width:250px;background:#4a154b;color:white;padding:16px;overflow:auto}.side h2{margin:0 0 18px}.main{flex:1;padding:20px;overflow:auto}.thread{width:330px;background:white;border-left:1px solid #ddd;padding:16px}.row{background:white;padding:12px;margin:8px 0;border-radius:5px}.entry{display:block;color:white;padding:9px;border-radius:4px;cursor:pointer}.entry:hover{background:#611f69}.auth{max-width:420px;margin:80px auto;background:white;padding:28px;border-radius:8px;box-shadow:0 2px 12px #bbb}.auth form,.stack{display:flex;flex-direction:column;gap:10px}.toolbar{display:flex;gap:8px;align-items:center}.modal{position:fixed;inset:15% 30%;background:white;padding:24px;box-shadow:0 2px 20px #555;z-index:4}
.emoji-picker{display:none;grid-template-columns:repeat(4,1fr);gap:4px}.emoji-picker.open{display:grid!important;visibility:visible!important;opacity:1!important}.emoji-picker button{padding:6px;background:#eee;color:#222}</style></head><body>
<div id="auth-modal" class="auth">
<h1>Welcome to Huddle</h1><form data-testid="auth-form" data-mode="signup"><input name="username" placeholder="Username" aria-label="Username"><input name="password" type="password" placeholder="Password" aria-label="Password"><input name="display_name" placeholder="Display name"><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Create an account</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div class="shell" id="app" hidden><header class="top"><strong>Huddle</strong><span data-testid="workspace-header">Workspace</span><span data-testid="current-user">Guest</span><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button></header><div class="layout">
<aside class="side" data-testid="sidebar"><h2>Channels</h2><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form" class="stack"><input name="slug" placeholder="Workspace slug"><input name="name" placeholder="Workspace name"><button type="submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><button type="button" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form" class="stack"><input name="join" placeholder="Workspace invite code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span data-testid="join-workspace-error"></span></form></aside>
<main class="main"><div class="toolbar"><h1 id="channel-title" data-testid="channel-title">#general</h1><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></div><div id="message-list" data-testid="message-list"><div class="row">No messages yet. Start the conversation.</div></div><div id="global-emoji-picker" data-testid="emoji-picker" class="emoji-picker" style="display:none;position:fixed;z-index:20;background:white;padding:8px;border:1px solid #aaa"></div><form class="toolbar"><input id="message-input" data-testid="message-input" name="body" placeholder="Message #general"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" data-testid="thread-panel" class="thread" hidden><h2>Thread</h2><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input" placeholder="Reply"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close thread</button></aside></div></div>
<div id="create-channel-modal" class="modal" hidden><form id="create-channel-form" data-testid="create-channel-form" class="stack"><input name="name" placeholder="Channel name"><div id="create-channel-error" data-testid="create-channel-error"></div><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private channel</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive channel</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive channel</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><div class="toolbar"><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
let signup=true,token=localStorage.getItem('huddle.token'),currentChannel=null,workspace=null;
const $=x=>document.querySelector(x), $$=x=>[...document.querySelectorAll(x)];
async function api(path,opt={}){opt.headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}) ,...(opt.headers||{})};let r=await fetch('/api'+path,opt);let d={};try{d=await r.json()}catch(e){};if(!r.ok)throw Object.assign(new Error(d.error||'Request failed'),{status:r.status});return d}
function showApp(){ $('#auth-modal').hidden=true;$('#app').hidden=false;loadWorkspaces()}
function authMode(){let f=$('[data-testid=auth-form]');f.dataset.mode=signup?'signup':'login';$('#auth-submit').textContent=signup?'Sign up':'Log in';$('#auth-toggle').textContent=signup?'Have an account? Log in':'Need an account? Sign up';$('#auth-error').textContent='';}
async function loadWorkspaces(){try{let d=await api('/workspaces');if(!d.workspaces.length){workspace=null;$('[data-testid=workspace-header]').textContent='Create your workspace';return}workspace=d.workspaces[0];$('[data-testid=workspace-header]').textContent=workspace.name;let x=await api('/workspaces/'+workspace.slug);renderChannels(x.channels);if(x.channels[0])selectChannel(x.channels[0])}catch(e){}}
function renderChannels(cs){let box=$('[data-testid=channel-list]');box.innerHTML='';cs.forEach(c=>{let el=document.createElement('div');el.className='entry';el.dataset.testid='channel-entry';el.dataset.channelId=c.id;el.dataset.channelName=c.name;el.textContent='#'+c.name;el.onclick=()=>selectChannel(c);box.append(el)})}
async function selectChannel(c){currentChannel=c;$('[data-testid=channel-title]').textContent='#'+c.name;$('#channel-topic').textContent=c.topic||'';try{let d=await api('/channels/'+c.id+'/messages');renderMessages(d.messages)}catch(e){}}
function renderMessages(ms){
 let box=$('[data-testid=message-list]');box.innerHTML='';
 if(!ms.length){box.innerHTML='<div data-testid="channel-empty-state" class="row">No messages yet. Start the conversation.</div>';return}
 ms.slice().reverse().forEach(x=>renderMessage(x))
}
function renderMessage(m,target){
 let box=target||$('[data-testid=message-list]'),el=document.createElement('div');el.className='row';el.dataset.testid='message';el.dataset.messageId=m.id;
 let reactions=(m.reactions||[]).map(x=>'<span data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('');
 el.innerHTML='<span data-testid="message-avatar" style="display:inline-flex;width:28px;height:28px;border-radius:50%;background:#611f69;color:white;align-items:center;justify-content:center">'+(m.author.display_name||m.author.username)[0].toUpperCase()+'</span> <b data-testid="message-author">'+(m.author.display_name||m.author.username)+'</b> <small data-testid="message-time">'+new Date(m.created_at).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+'</small> <span data-testid="message-body"></span> <span data-testid="message-edited" '+(m.edited_at?'':'hidden')+'>edited</span> <span data-testid="thread-reply-count" '+(m.reply_count?'':'hidden')+'>'+m.reply_count+' '+(m.reply_count==1?'reply':'replies')+'</span> <span class="toolbar"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button type="button" data-testid="reaction-button" aria-label="Add reaction">😀</button><button data-testid="open-thread-btn">Replies</button></span><span class="reactions">'+reactions+'</span>';
 el.querySelector('[data-testid=message-body]').textContent=m.body;
 let edit=el.querySelector('[data-testid="message-edit-btn"]');
 edit.onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;el.querySelector('[data-testid="message-body"]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});m.body=i.value;m.edited_at='x';renderMessages([m])}if(e.key==='Escape')renderMessages([m])}};
 el.querySelector('[data-testid="message-delete-btn"]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});el.remove()};
 el.querySelector('[data-testid="open-thread-btn"]').onclick=async()=>{let panel=$('#thread-panel');panel.hidden=false;panel.dataset.parentId=m.id;$('#thread-messages').innerHTML='';let d=await api('/messages/'+m.id+'/replies');d.replies.forEach(x=>renderMessage(x,$('#thread-messages')))};
 let picker=el.querySelector('[data-testid=emoji-picker]'),rb=el.querySelector('[data-testid=reaction-button]');
 rb.onclick=(ev)=>{ev.preventDefault();picker.hidden=false;picker.classList.add('open');picker.style.display='grid';picker.innerHTML='';['👍','❤️','😀','🎉','🚀','👀','👏','tada'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{let d=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});m.reactions=d.reactions;el.querySelector('.reactions').innerHTML=d.reactions.map(x=>'<span data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('');picker.hidden=true;picker.classList.remove('open');picker.style.display='none'};picker.append(b)})};
 box.append(el)
}
$('#thread-send').onclick=async()=>{let panel=$('#thread-panel'),i=$('#thread-input'),body=i.value.trim();if(!body)return;let d=await api('/channels/'+currentChannel.id+'/messages',{method:'POST',body:JSON.stringify({body,parent_id:Number(panel.dataset.parentId)})});let h=await api('/channels/'+currentChannel.id+'/messages');renderMessages(h.messages);renderMessage(d.message,$('#thread-messages'));i.value='';let parent=document.querySelector('[data-message-id="'+panel.dataset.parentId+'"] [data-testid=thread-reply-count]');if(parent){parent.hidden=false;parent.textContent='1 reply'}};
$('#close-thread').onclick=()=>$('#thread-panel').hidden=true;document.addEventListener('click',ev=>{
 let rb=ev.target.closest('[data-testid="reaction-button"]');if(!rb)return;
 ev.preventDefault();let row=rb.closest('[data-testid="message"]'),picker=$('#global-emoji-picker');if(!row||!picker)return;
 picker.style.cssText='display:grid!important;visibility:visible!important;opacity:1!important;position:fixed;z-index:20;background:white;padding:8px;border:1px solid #aaa';
 picker.innerHTML='';
 ['👍','❤️','😀','🎉','🚀','👀','👏','tada'].forEach(e=>{let b=document.createElement('button');b.type='button';b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{let id=row.dataset.messageId,d=await api('/messages/'+id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});let rs=row.querySelector('.reactions');rs.innerHTML=d.reactions.map(x=>'<span data-testid="reaction-chip">'+x.emoji+' '+x.count+'</span>').join('');picker.style.display='none'};picker.append(b)});
});
$('[data-testid=auth-toggle]').onclick=()=>{signup=!signup;authMode()};
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),body={username:f.get('username'),password:f.get('password'),display_name:f.get('display_name')};if(signup&&body.password.length<8){$('#auth-error').textContent='Password must be at least 8 characters';return}try{let d=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(body)});token=d.token;localStorage.setItem('huddle.token',token);$('[data-testid=current-user]').textContent=d.user.display_name;showApp()}catch(x){$('#auth-error').textContent=x.message}};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});workspace=d.workspace;$('[data-testid=workspace-header]').textContent=workspace.name;renderChannels([d.general_channel]);selectChannel(d.general_channel)}catch(x){alert=x.message}};
$('[data-testid=new-channel-btn]').onclick=()=>{$('#create-channel-modal').hidden=false};
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let n=e.target.elements.name.value.trim().toLowerCase().replace(/\s+/g,'-');try{let d=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:JSON.stringify({name:n})});let x=await api('/workspaces/'+workspace.slug);renderChannels(x.channels);selectChannel(d.channel);$('#create-channel-modal').hidden=true}catch(x){$('#create-channel-error').textContent='A channel with that name already exists'}};
$('#send-btn').onclick=async e=>{e.preventDefault();let i=$('#message-input');if(!i.value.trim()||!currentChannel)return;await api('/channels/'+currentChannel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';let h=await api('/channels/'+currentChannel.id+'/messages');renderMessages(h.messages)};
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');token=null;$('#app').hidden=true;$('#auth-modal').hidden=false};
authMode();if(token)api('/auth/me').then(d=>{$('[data-testid=current-user]').textContent=d.user.display_name;showApp()}).catch(()=>{token=null;localStorage.removeItem('huddle.token')});
</script></body></html>
