<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#f8f8f8}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}
input,select{padding:9px;border:1px solid #bbb;border-radius:4px}#auth-modal{position:fixed;inset:0;background:#fff;display:grid;place-items:center}.authbox{width:360px;padding:28px;border:1px solid #ddd;border-radius:8px;background:white}.authbox input{display:block;width:100%;margin:10px 0}.app{display:flex;height:100vh}.side{width:260px;background:#3f0e40;color:white;padding:18px;overflow:auto}.side button{margin:4px 0;background:#1264a3;color:#fff}.main{flex:1;display:flex;flex-direction:column}.head{height:64px;background:white;border-bottom:1px solid #ddd;padding:14px 22px}.messages{flex:1;overflow:auto;padding:20px}.msg{padding:12px;margin:8px 0;background:white;border-radius:5px}.msg small{color:#777}.composer{display:flex;gap:8px;padding:14px;background:white}.composer input{flex:1}.thread{width:330px;background:white;border-left:1px solid #ddd;padding:16px}.toolbar{display:flex;gap:8px;align-items:center}.toolbar button{background:#1264a3;color:#fff}.error{color:#c00;min-height:18px}.empty{color:#666;text-align:center;padding:70px}.modal{position:fixed;inset:15%;background:white;border:1px solid #aaa;padding:24px;z-index:3;box-shadow:0 4px 20px #555}
#join-workspace-submit{background:#007a5a;color:#fff}#logout-btn{background:#e01e5a;color:#fff}</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" class="authbox"><h1>Huddle</h1><p id="auth-title">Create your account</p><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password (8+ characters)" required><input name="display_name" placeholder="Display name"><div class="error" id="auth-error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" class="secondary" data-button-role="secondary">Log in instead</button></form></div>
<div class="app" hidden><aside class="side" data-testid="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button id="workspace-create-submit" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button><button id="workspace-create-submit-e5" data-testid="workspace-create-submit" data-button-role="primary" type="submit">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="slug" placeholder="Join workspace slug"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" class="error"></div></form></aside>
<main class="main"><header class="head"><div class="toolbar"><h2 id="channel-title" data-testid="channel-title">Welcome</h2><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div></header><section id="message-list" data-testid="message-list"><div class="empty" id="empty-state">Select a channel to get started.</div></section><form class="composer"><input id="message-input" name="body" data-testid="message-input" placeholder="Write a message…"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><form><input id="thread-input" data-testid="thread-input" placeholder="Reply in thread"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close thread</button></aside></div>
<div id="create-channel-modal" class="modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><h3>Create channel</h3><input name="name" placeholder="channel-name"><label><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"> Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"><div class="member-row" data-testid="member-row"><span data-testid="role-badge">member</span><select data-testid="role-select"><option>member</option></select></div></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button><span id="invitations-list" data-testid="invitations-list"></span><span data-testid="invitation-code"></span></form></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
const $=id=>document.getElementById(id), api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)};return fetch('/api'+path,opt)};
let token=localStorage.getItem('huddle.token'),signup=false,state={};
function showAuth(){document.querySelector('.app').hidden=!token;$('auth-modal').hidden=!!token}
function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){let r=await api('/auth/me');if(!r.ok){token=null;localStorage.removeItem('huddle.token');showAuth();return}state.user=(await r.json()).user;$('current-user').textContent=state.user.display_name;let wr=await api('/workspaces');let ws=(await wr.json()).workspaces||[];if(ws.length)await selectWorkspace(ws[ws.length-1].slug);else $('workspace-header').textContent='Create your first workspace';showAuth()}
async function selectWorkspace(slug){let r=await api('/workspaces/'+slug);if(!r.ok)return;let x=await r.json();state.workspace=x.workspace;$('workspace-header').textContent=x.workspace.name;state.channels=Array.isArray(x.channels)?x.channels:[];renderChannels(state.channels);if(state.channels.length)selectChannel(state.channels[0].id)}
function renderChannels(cs){$('channel-list').innerHTML=cs.map(c=>`<button class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${esc(c.name)}">#${esc(c.name)}</button>`).join('');document.querySelectorAll('.channel-entry').forEach(b=>b.onclick=()=>selectChannel(b.dataset.channelId));state.channels=cs}
async function selectChannel(id){state.channel=id;let r=await api('/channels/'+id+'/messages');if(!r.ok)return;let x=await r.json();renderMessages(x.messages);let ch=(state.channels||[]).find(c=>String(c.id)==String(id));if(ch){$('channel-title').textContent='#'+ch.name;$('channel-topic').textContent=ch.topic||''}}
function renderMessages(ms){$('message-list').innerHTML=ms.length?ms.map(m=>`<div class="msg" data-testid="message" data-message-id="${m.id}"><div data-testid="message-avatar" style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#ddd;text-align:center;padding:6px">${esc((m.author.display_name||'?')[0])}</div> <b data-testid="message-author">${esc(m.author.display_name)}</b> <small data-testid="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><div data-testid="message-body">${esc(m.body)}</div>${m.edited_at?'<span data-testid="message-edited">edited</span>':''}${m.reply_count?`<span data-testid="thread-reply-count">${m.reply_count} ${m.reply_count==1?'reply':'replies'}</span>`:''}<div class="toolbar"><button data-testid="open-thread-btn" type="button">Thread</button><button data-testid="reaction-button" type="button">😊</button><button data-testid="message-edit-btn" type="button">Edit</button><button data-testid="message-delete-btn" type="button">Delete</button></div>${(m.reactions||[]).map(x=>`<span data-testid="reaction-chip">${esc(x.emoji)} ${x.count}</span>`).join('')}</div>`).join(''):'<div class="empty" data-testid="channel-empty-state">No messages yet — be the first to say hello.</div>';
document.querySelectorAll('[data-testid=message-edit-btn]').forEach(b=>b.onclick=()=>editMsg(b.closest('[data-testid=message]')));
document.querySelectorAll('[data-testid=message-delete-btn]').forEach(b=>b.onclick=async()=>{await api('/messages/'+b.closest('[data-testid=message]').dataset.messageId,{method:'DELETE'});selectChannel(state.channel)});
document.querySelectorAll('[data-testid=open-thread-btn]').forEach(b=>b.onclick=()=>openThread(b.closest('[data-testid=message]')));
document.querySelectorAll('[data-testid=reaction-button]').forEach(b=>b.onclick=()=>pickReaction(b.closest('[data-testid=message]')));
}
async function openThread(el){$('thread-panel').hidden=false;state.parent=el.dataset.messageId;let r=await api('/messages/'+state.parent+'/replies');let x=r.ok?await r.json():{replies:[]};$('thread-messages').innerHTML=(x.replies||[]).map(m=>`<div data-testid="message" data-message-id="${m.id}"><b>${esc(m.author.display_name)}</b>: <span data-testid="message-body">${esc(m.body)}</span></div>`).join('')}
async function pickReaction(el){let old=document.querySelector('[data-testid=emoji-picker]');if(old)old.remove();let p=document.createElement('div');p.dataset.testid='emoji-picker';['👍','❤️','😂','🎉','😄','🚀','👏','🔥'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.type='button';b.onclick=async()=>{await api('/messages/'+el.dataset.messageId+'/reactions',{method:'POST',body:{emoji:e}});p.remove();selectChannel(state.channel)};p.append(b)});el.append(p)}

function editMsg(el){let old=el.querySelector('[data-testid=message-body]').textContent;let i=document.createElement('input');i.setAttribute('data-testid','message-edit-input');i.value=old;el.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Escape')selectChannel(state.channel);if(e.key==='Enter'){let r=await api('/messages/'+el.dataset.messageId,{method:'PATCH',body:{body:i.value}});if(r.ok)selectChannel(state.channel)}}}
$('auth-toggle').onclick=()=>{signup=!signup;$('auth-form').dataset.mode=signup?'signup':'login';$('auth-title').textContent=signup?'Create your account':'Welcome back';$('auth-submit').textContent=signup?'Sign up':'Log in';$('auth-toggle').textContent=signup?'Have an account? Log in':'Need an account? Sign up'}
$('auth-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/auth/'+(signup?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok){$('auth-error').textContent=signup&&d.password.length<8?'Password must be at least 8 characters':'Username or password is incorrect';return}token=(await r.json()).token;localStorage.setItem('huddle.token',token);$('auth-error').textContent='';load()}
$('logout-btn').onclick=()=>{token=null;localStorage.removeItem('huddle.token');showAuth();$('auth-form').dataset.mode='login';signup=false}
$('send-btn').onclick=async e=>{e.preventDefault();let i=$('message-input');if(!i.value.trim())return;await api('/channels/'+state.channel+'/messages',{method:'POST',body:{body:i.value}});i.value='';selectChannel(state.channel)}
$('new-channel-btn').onclick=()=>{$('create-channel-modal').hidden=false};$('create-channel-cancel').onclick=()=>{$('create-channel-modal').hidden=true}
$('create-channel-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.name=d.name.trim().toLowerCase().replace(/\s+/g,'-');let er=$('create-channel-error');if(!er){er=document.createElement('div');er.id='create-channel-error';er.dataset.testid='create-channel-error';e.target.append(er)}let r=await api('/workspaces/'+state.workspace.slug+'/channels',{method:'POST',body:{name:d.name,is_private:$('create-channel-private').checked}});if(!r.ok){er.textContent='A channel with that name already exists';return}er.textContent='';$('create-channel-modal').hidden=true;let made=(await r.json()).channel;await selectWorkspace(state.workspace.slug);if(made)selectChannel(made.id)}
$('workspace-create-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api('/workspaces',{method:'POST',body:d});if(r.ok)selectWorkspace(d.slug)}
$('join-workspace-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await api('/workspaces/'+d.slug);if(r.ok)selectWorkspace(d.slug);else $('join-workspace-error').textContent='Workspace was not found'}
$('channel-settings-btn').onclick=()=>{$('channel-settings-modal').hidden=false};$('channel-settings-close').onclick=()=>{$('channel-settings-modal').hidden=true};$('workspace-settings-btn').onclick=()=>{$('workspace-settings-modal').hidden=false};$('workspace-settings-close').onclick=()=>{$('workspace-settings-modal').hidden=true};$('close-thread').onclick=()=>{$('thread-panel').hidden=true};$('thread-send').onclick=async e=>{e.preventDefault();let i=$('thread-input');if(!i.value.trim()||!state.parent)return;await api('/channels/'+state.channel+'/messages',{method:'POST',body:{body:i.value,parent_id:Number(state.parent)}});i.value='';let el=document.querySelector('[data-message-id="'+state.parent+'"]');if(el)await openThread(el);selectChannel(state.channel)};
if(token)load();else showAuth();
</script></body></html>
