<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#fff}[hidden]{display:none!important}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}
[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}
#auth-modal{max-width:420px;margin:80px auto;padding:30px;border:1px solid #ddd;border-radius:8px}#auth-modal input{display:block;width:100%;margin:10px 0}
.app{display:flex;height:100vh}.sidebar{width:255px;background:#3f0f52;color:#fff;padding:18px}.content{flex:1;padding:24px;overflow:auto}.thread{width:340px;padding:20px;border-left:1px solid #ddd;overflow:auto}
.sidebar button{margin:4px 0}.channel-entry{padding:9px;cursor:pointer}.channel-entry:hover{background:#542365}.message{padding:12px;border-bottom:1px solid #eee}.message-body{display:block;margin-top:4px}.avatar{display:inline-flex;width:28px;height:28px;min-width:28px;align-items:center;justify-content:center;background:#007a5a;color:#fff;border-radius:50%;vertical-align:middle}.toolbar{float:right}.modal{position:fixed;inset:12% 30%;background:#fff;border:1px solid #aaa;padding:25px;box-shadow:0 4px 20px #555}.panel{margin:12px 0;padding:12px;border:1px solid #ddd}.hidden{display:none!important}
</style></head><body>
<div id="auth-modal"><form data-testid="auth-form" data-mode="signup"><h1>Huddle</h1><label>Username<input name="username" autocomplete="username"></label><label>Password<input name="password" type="password" autocomplete="current-password"></label><label>Display name<input name="display_name"></label><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" data-testid="auth-toggle">Have an account? Log in</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div id="create-channel-modal" class="modal" hidden><form data-testid="create-channel-form"><h2>Create channel</h2><input name="name" placeholder="Channel name"><label><input type="checkbox" id="create-channel-private" data-testid="create-channel-private"> Private channel</label><input name="topic" placeholder="Topic"><div data-testid="create-channel-error"></div><button data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 data-testid="channel-settings-title">Channel settings</h2><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><div data-testid="channel-members-list"></div><button data-testid="archive-channel-btn" data-button-role="danger">Archive channel</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive channel</button></div>
<div id="workspace-settings-modal" class="modal" hidden><h2>Workspace settings</h2><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><form><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option value="open">Open</option><option value="invite_only">Invite only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button></form><div class="panel"><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><input name="invited_username"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div></div></div>
<form id="workspace-create-form" data-testid="workspace-create-form" class="panel" hidden><input name="slug"><input name="name"><button data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><button data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form>
<form id="join-workspace-form" data-testid="join-workspace-form" class="panel" hidden><input name="slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div data-testid="join-workspace-error"></div></form>
<div class="app" id="main-app" hidden><aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Logout</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div></aside><main class="content"><header><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><div data-testid="message-list"></div><form id="message-form" data-testid="message-form"><label>Message <input data-testid="message-input" name="body" placeholder="Message #general"></label><button type="submit" data-testid="send-btn" data-button-role="primary">Send</button></form></main><aside class="thread" data-testid="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close thread</button><div id="thread-messages"></div><label>Reply <input data-testid="thread-input" placeholder="Reply in thread"></label><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let token=localStorage.getItem('huddle.token'),currentChannel=null,channels=[],workspace=null;
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}let r=await fetch('/api'+path,opt);return [r.status,await r.json().catch(()=>({}))]}
function authScreen(){ $('#auth-modal').hidden=false;$('#main-app').hidden=true;$('[data-testid=workspace-create-form]').hidden=true;$('#join-workspace-form').hidden=true}
function showApp(){if(!token)return authScreen();$('#auth-modal').hidden=true;$('#main-app').hidden=false;load()}
function errorText(s){return s===400?'Please check the information entered.':s===401?'Username or password is incorrect.':s===409?'A channel with that name already exists.':'The request could not be completed.'}
async function load(){let [ms,me]=await api('/auth/me');if(ms!==200){token=null;localStorage.removeItem('huddle.token');return authScreen()}$('[data-testid=current-user]').textContent=me.user.display_name||me.user.username;let [,ws]=await api('/workspaces');if(!ws.workspaces?.length){$('[data-testid=workspace-create-form]').hidden=false;return}workspace=ws.workspaces[0];$('[data-testid=workspace-header]').textContent=workspace.name;$('[data-testid=workspace-create-form]').hidden=true;let [,d]=await api('/workspaces/'+workspace.slug);channels=d.channels||[];renderChannels();if(channels.length)selectChannel(channels[0])}
function renderChannels(){$('[data-testid=channel-list]').innerHTML=channels.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}">#${c.name}</div>`).join('');$$('[data-testid=channel-entry]').forEach(x=>x.onclick=()=>selectChannel(channels.find(c=>String(c.id)===x.dataset.channelId)))}
function renderMessages(ms){$('[data-testid=message-list]').innerHTML=(ms||[]).map(m=>`<div class="message" data-testid="message" data-message-id="${m.id}"><span data-testid="message-avatar" class="avatar">${(m.author.display_name||m.author.username)[0]}</span><b data-testid="message-author">${m.author.display_name||m.author.username}</b> <small data-testid="message-time">${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><span class="message-body" data-testid="message-body">${m.body}</span>${m.edited_at?'<small data-testid="message-edited">edited</small>':''}<span class="toolbar"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button data-testid="open-thread-btn">Open thread</button><span data-testid="thread-reply-count">${m.reply_count||0} ${(m.reply_count||0)==1?"reply":"replies"}</span><button data-testid="reaction-button">😀</button></span>${(m.reactions||[]).map(r=>`<span data-testid="reaction-chip">${r.emoji} ${r.count}</span>`).join('')}</div>`).join('')||'<div data-testid="channel-empty-state">No messages yet. Start the conversation!</div>'}
async function selectChannel(c){if(!c)return;currentChannel=c;$('[data-testid=channel-title]').textContent='# '+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let [,d]=await api('/channels/'+c.id+'/messages');renderMessages(d.messages)}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),signup=e.target.dataset.mode==='signup';let [st,x]=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:d});if(st===201||st===200){token=x.token;localStorage.setItem('huddle.token',token);showApp()}else $('[data-testid=auth-error]').textContent=errorText(st)};
$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]'),signup=f.dataset.mode!=='signup';f.dataset.mode=signup?'signup':'login';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=signup?'Have an account? Log in':'Need an account? Sign up';$('input[name=display_name]').parentElement.hidden=!signup};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;authScreen()};
$('[data-testid=workspace-create-submit]').onclick=async e=>{if(e)e.preventDefault();let f=$('[data-testid=workspace-create-form]'),d=Object.fromEntries(new FormData(f));let [st,x]=await api('/workspaces',{method:'POST',body:d});if(st===201){workspace=x.workspace;$('[data-testid=workspace-header]').textContent=workspace.name;$('[data-testid=workspace-create-form]').hidden=true;await load()}else $('[data-testid=join-workspace-error]').textContent=errorText(st)};
$('[data-testid=empty-state-create-workspace]').onclick=()=>$('[data-testid=workspace-create-submit]').click();
$('[data-testid=message-form]').onsubmit=async e=>{e.preventDefault();let b=$('[data-testid=message-input]').value;if(!b.trim()||!currentChannel)return;await api('/channels/'+currentChannel.id+'/messages',{method:'POST',body:{body:b}});e.target.reset();selectChannel(currentChannel)};
$('[data-testid=new-channel-btn]').onclick=()=>{$('#create-channel-modal').hidden=false;$('[data-testid=create-channel-error]').textContent=''};
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true;
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.name=d.name.trim().toLowerCase().replace(/\s+/g,'-');let [st,x]=await api('/workspaces/'+workspace.slug+'/channels',{method:'POST',body:{name:d.name,topic:d.topic||'',is_private:$('[data-testid=create-channel-private]').checked}});if(st===201){channels.push(x.channel);renderChannels();$('#create-channel-modal').hidden=true;selectChannel(x.channel)}else $('[data-testid=create-channel-error]').textContent=errorText(st)};
async function openThread(id){let panel=$('[data-testid=thread-panel]');panel.hidden=false;panel.dataset.parentId=id;let [,d]=await api('/messages/'+id+'/replies');$('#thread-messages').innerHTML=(d.replies||[]).map(r=>'<div data-testid="message" data-message-id="'+r.id+'"><span data-testid="message-body">'+r.body+'</span></div>').join('')}
async function openEmoji(row,id){let old=row.querySelector('[data-testid=emoji-picker]');if(old){old.remove();return}let box=document.createElement('div');box.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','😂','😮','🚀','✅','tada'].forEach(em=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=em;b.onclick=async()=>{await api('/messages/'+id+'/reactions',{method:'POST',body:{emoji:em}});box.remove();selectChannel(currentChannel)};box.appendChild(b)});row.appendChild(box)}
$('[data-testid=message-list]').onclick=async e=>{let row=e.target.closest('[data-testid=message]');if(!row)return;let id=row.dataset.messageId;if(e.target.matches('[data-testid=open-thread-btn]'))return openThread(id);if(e.target.matches('[data-testid=reaction-button]'))return openEmoji(row,id);if(e.target.matches('[data-testid=message-delete-btn]')){await api('/messages/'+id,{method:'DELETE'});selectChannel(currentChannel)}if(e.target.matches('[data-testid=message-edit-btn]')){let body=row.querySelector('[data-testid=message-body]'),input=document.createElement('input');input.dataset.testid='message-edit-input';input.value=body.textContent;body.replaceWith(input);input.focus();input.onkeydown=async z=>{if(z.key==='Enter'){await api('/messages/'+id,{method:'PATCH',body:{body:input.value}});selectChannel(currentChannel)}if(z.key==='Escape')selectChannel(currentChannel)}}};
$('[data-testid=thread-send]').onclick=async()=>{let p=$('[data-testid=thread-panel]'),v=$('[data-testid=thread-input]').value;if(!v.trim())return;await api('/channels/'+currentChannel.id+'/messages',{method:'POST',body:{body:v,parent_id:Number(p.dataset.parentId)}});p.dataset.parentId&&openThread(Number(p.dataset.parentId));selectChannel(currentChannel);$('[data-testid=thread-input]').value=''};

$('[data-testid=workspace-settings-btn]').onclick=()=>$('#workspace-settings-modal').hidden=false;$('[data-testid=workspace-settings-close]').onclick=()=>$('#workspace-settings-modal').hidden=true;$('[data-testid=channel-settings-btn]').onclick=()=>$('#channel-settings-modal').hidden=false;$('[data-testid=channel-settings-close]').onclick=()=>$('#channel-settings-modal').hidden=true;$('[data-testid=close-thread]').onclick=()=> $('[data-testid=thread-panel]').hidden=true;showApp();
</script></body></html>
