<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;padding:9px 14px;border-radius:4px;cursor:pointer}.primary{background:#007a5a;color:#fff}.danger{background:#e01e5a;color:#fff}.secondary{background:#1264a3;color:#fff}.app{display:flex;height:100vh}.sidebar{width:250px;background:#182b45;color:white;padding:18px}.main{flex:1;padding:20px}.thread{width:300px;border-left:1px solid #ddd;padding:15px}.entry{padding:9px;cursor:pointer}.entry:hover{background:#29415f}.msg{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-flex;width:28px;height:28px;background:#007a5a;color:white;align-items:center;justify-content:center;border-radius:4px;margin-right:8px}.toolbar{float:right}.chip{background:#eee;padding:3px 7px;border-radius:10px;margin:3px}.modal{position:fixed;top:20%;left:35%;background:white;padding:25px;box-shadow:0 2px 15px #555}input{padding:9px;margin:5px;width:90%}label{display:block;margin-top:8px}.top{display:flex;justify-content:space-between}
</style></head><body><section id=auth-modal><form id=auth-form data-testid=auth-form data-mode=signup><h1>Welcome to Huddle</h1><div id=auth-error data-testid=auth-error hidden></div><label>Username<input name=username required></label><label>Password<input name=password type=password required></label><label id=display-label>Display name<input name=display_name></label><button class=primary data-button-role=primary data-testid=auth-submit>Sign up</button> <button type=button data-testid=auth-toggle>Have an account? Log in</button></form></section>
<section class=app hidden id=app><aside class=sidebar data-testid=sidebar><h2 data-testid=workspace-header>Workspace</h2><button class=secondary data-button-role=secondary data-testid=workspace-settings-btn>Workspace settings</button><div data-testid=current-user></div><button class=danger data-button-role=danger data-testid=logout-btn>Logout</button><h3>Channels</h3><div data-testid=channel-list></div><div data-testid=dms-list></div><form data-testid=join-workspace-form hidden><input name=slug placeholder="Workspace slug"><button class=primary data-button-role=primary data-testid=join-workspace-submit>Join workspace</button></form><button class=secondary data-button-role=secondary data-testid=new-channel-btn>New channel</button><form data-testid=workspace-create-form hidden><input name=slug placeholder=Slug><input name=name placeholder=Workspace name><button class=primary data-button-role=primary data-testid=workspace-create-submit>Create workspace</button></form><button data-testid=empty-state-create-workspace hidden>Create a workspace</button></aside><main class=main><div class=top><div><h2 data-testid=channel-title>general</h2><span data-testid=channel-topic></span></div><button class=secondary data-button-role=secondary data-testid=channel-settings-btn>Channel settings</button></div><div data-testid=message-list></div><label>Message <input data-testid=message-input placeholder="Message #general"></label><button class=primary data-button-role=primary data-testid=send-btn>Send</button></main><aside class=thread hidden data-testid=thread-panel><button class=secondary data-button-role=secondary data-testid=close-thread>Close thread</button><div id=thread-messages></div><input data-testid=thread-input placeholder="Reply in thread"><button class=primary data-button-role=primary data-testid=thread-send>Reply</button></aside></section>
<div id=create-channel-modal class=modal hidden><form data-testid=create-channel-form><label>Channel name<input name=name></label><label><input type=checkbox data-testid=create-channel-private> Private</label><div data-testid=create-channel-error></div><button class=primary data-button-role=primary data-testid=create-channel-submit>Create channel</button><button type=button class=secondary data-button-role=secondary data-testid=create-channel-cancel>Cancel</button></form></div>
<div id=channel-settings-modal class=modal hidden><h3 data-testid=channel-settings-title>Channel settings</h3><form data-testid=channel-add-member-form><input data-testid=channel-add-member-input><button class=primary data-button-role=primary data-testid=channel-add-member-submit>Add member</button></form><input data-testid=channel-topic-input><button class=primary data-button-role=primary data-testid=channel-topic-submit>Save topic</button><button class=secondary data-button-role=secondary data-testid=channel-settings-close>Close</button><div data-testid=channel-members-list></div><button class=danger data-button-role=danger data-testid=archive-channel-btn>Archive</button><button class=secondary data-button-role=secondary data-testid=unarchive-channel-btn>Unarchive</button></div>
<div id=workspace-settings-modal class=modal hidden><input data-testid=workspace-name-input><select data-testid=workspace-join-mode></select><button class=primary data-button-role=primary data-testid=workspace-general-submit>Save</button><button class=secondary data-button-role=secondary data-testid=workspace-settings-close>Close</button></div>
<div><button data-testid=settings-tab-members>Members</button><button data-testid=settings-tab-invitations>Invitations</button><button data-testid=settings-tab-general>General</button><div data-testid=settings-pane-members></div><div data-testid=settings-pane-invitations><button class=secondary data-button-role=secondary data-testid=create-invitation-btn>Create invitation</button><form id=create-invitation-form data-testid=create-invitation-form hidden><button class=primary data-button-role=primary data-testid=create-invitation-submit>Create</button></form><div data-testid=invitations-list></div></div><div data-testid=settings-pane-general></div></div>
<script>
const $=s=>{let e=document.querySelector(s);if(!e&&s[0]==='#')e=document.querySelector('[data-testid="'+s.slice(1)+'"]');return e}, token=()=>localStorage.getItem('huddle.token')||'';let me,ws,cur,root;
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token()},opt.headers||{});let r=await fetch('/api'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function show(x){$('#auth-modal').hidden=true;$('#app').hidden=false}
async function load(){let d=await api('/auth/me');me=d.user;$('#current-user').textContent=me.display_name||me.username;show($('#app'));let a=await api('/workspaces');if(!a.workspaces?.length){$('#workspace-create-form').hidden=false;return}root=a.workspaces[0];await openws(root.slug)}
async function openws(slug){let d=await api('/workspaces/'+slug);root=d.workspace;$('#workspace-header').textContent=root.name;let list=$('#channel-list');list.innerHTML='';d.channels.forEach(c=>{let e=document.createElement('div');e.className='entry';e.dataset.testid='channel-entry';e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;e.onclick=()=>opench(c);list.append(e)});if(d.channels[0])opench(d.channels[0])}
async function opench(c){cur=c;$('#channel-title').textContent='#'+c.name;$('#channel-topic').textContent=c.topic||'';let d=await api('/channels/'+c.id+'/messages');render(d.messages)}
function render(ms){let box=$('#message-list');box.innerHTML=ms.length?'':'<div data-testid=channel-empty-state>No messages yet. Start the conversation.</div>';ms.slice().reverse().forEach(m=>{let e=document.createElement('div');e.className='msg';e.dataset.testid='message';e.dataset.messageId=m.id;e.innerHTML='<span class=avatar data-testid=message-avatar>'+m.author.display_name[0]+'</span><b data-testid=message-author>'+m.author.display_name+'</b> <span data-testid=message-time>'+new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span><div data-testid=message-body></div><span data-testid=thread-reply-count>'+m.reply_count+(m.reply_count==1?' reply':' replies')+'</span><div class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😊</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></div><div class=rx></div>';e.querySelector('[data-testid=message-body]').textContent=m.body;if(m.edited_at)e.insertAdjacentHTML('beforeend','<small data-testid=message-edited> edited</small>');e.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async x=>{if(x.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});opench(cur)}if(x.key==='Escape')opench(cur)}};e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});opench(cur)};e.querySelector('[data-testid=open-thread-btn]').onclick=()=>thread(m);e.querySelector('[data-testid=reaction-button]').onclick=()=>pick(e,m);m.reactions.forEach(r=>{let z=document.createElement('span');z.className='chip';z.dataset.testid='reaction-chip';z.textContent=r.emoji+' '+r.count;e.querySelector('.rx').append(z)});box.append(e)})}
async function thread(m){$('#thread-panel').hidden=false;$('#thread-panel').dataset.parent=m.id;let d=await api('/messages/'+m.id+'/replies');$('#thread-messages').innerHTML=d.replies.map(x=>'<div class=msg data-testid=message data-message-id='+x.id+'><div data-testid=message-body>'+x.body+'</div></div>').join('')}
function pick(e,m){let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','😂','🔥','🚀','✅'].forEach(x=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=x;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:x})});p.remove();opench(cur)};p.append(b)});e.append(p)}
$('#auth-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/auth/'+(e.target.dataset.mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(f))});localStorage.setItem('huddle.token',d.token);load()}catch(x){$('#auth-error').hidden=false;$('#auth-error').textContent=x.message}}
$('#auth-toggle').onclick=()=>{let f=$('#auth-form');f.dataset.mode=f.dataset.mode==='signup'?'login':'signup';$('#auth-submit').textContent=f.dataset.mode==='signup'?'Sign up':'Log in';$('#auth-toggle').textContent=f.dataset.mode==='signup'?'Have an account? Log in':'Need an account? Sign up';$('#display-label').hidden=f.dataset.mode==='login'}
$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()}
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),d=await api('/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});root=d.workspace;await openws(root.slug)}
$('[data-testid="new-channel-btn"]').onclick=()=>$('#create-channel-modal').hidden=false
$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let n=e.target.name.value.toLowerCase().trim().replace(/\s+/g,'-');try{let made=await api('/workspaces/'+root.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('#create-channel-private').checked})});$('#create-channel-modal').hidden=true;await openws(root.slug);opench(made.channel)}catch(x){$('#create-channel-error').textContent='A channel with that name already exists'}}
$('#send-btn').onclick=async()=>{let i=$('#message-input');if(i.value.trim()){await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';opench(cur)}}
$('#thread-send').onclick=async()=>{let i=$('#thread-input');if(i.value.trim()){let pid=+$('#thread-panel').dataset.parent;await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:pid})});i.value='';let d=await api('/messages/'+pid+'/replies');$('#thread-messages').innerHTML=d.replies.map(x=>'<div class=msg data-testid=message data-message-id='+x.id+'><div data-testid=message-body>'+x.body+'</div></div>').join('');opench(cur)}};$('#close-thread').onclick=()=>$('#thread-panel').hidden=true
if(token())load().catch(()=>{});else $('#auth-modal').hidden=false
</script></body></html>
