<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title>
<style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#f8f8f8}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}input,select,textarea{padding:9px;border:1px solid #bbb;border-radius:4px}.app{display:flex;min-height:100vh}.sidebar{width:260px;background:#3f0f45;color:#fff;padding:18px}.main{flex:1;padding:24px}.panel{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px;margin-bottom:14px}.row{display:flex;gap:8px;align-items:center;margin:8px 0}.channel-entry{display:block;width:100%;text-align:left;background:transparent;color:#fff;padding:8px}.channel-entry:hover{background:#5b2462}.messages{min-height:300px}.message{padding:12px;border-bottom:1px solid #eee}.avatar{display:inline-block;background:#1264a3;color:#fff;border-radius:50%;padding:7px;margin-right:8px}.main{position:relative}.main:has(.thread:not([hidden]))>.panel{margin-right:340px}.thread{width:320px;border-left:1px solid #ddd;padding:16px;position:absolute;right:0;top:58px;background:#fff;min-height:300px}.top{display:flex;justify-content:space-between;align-items:center}
</style></head>
<body>
<div id="auth-modal" class="panel"><h1>Welcome to Huddle</h1><form data-testid="auth-form" data-mode="signup"><label>Username <input name="username" placeholder="Username" required></label><label>Password <input name="password" type="password" placeholder="Password" required></label><label class="signup-only">Display name <input name="display_name" placeholder="Display name"></label><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" data-testid="auth-toggle" data-button-role="secondary">Have an account? Log in</button><div id="auth-error" data-testid="auth-error"></div></form></div>
<div id="app" class="app" hidden>
<aside class="sidebar" data-testid="sidebar"><h2 data-testid="workspace-header">Huddle Workspace</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Log out</button><h3>Channels</h3><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button type="submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><button type="button" data-testid="empty-state-create-workspace" data-button-role="primary">Create your first workspace</button></form><form data-testid="join-workspace-form"><input name="join_slug" placeholder="Workspace slug"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span data-testid="join-workspace-error"></span></form></aside>
<main class="main"><div class="top"><div><h1 data-testid="channel-title"># general</h1><div data-testid="channel-topic"></div></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></div>
<div class="panel"><div data-testid="message-list" class="messages"><div class="empty" data-testid="channel-empty-state">No messages yet. Start the conversation.</div></div><form id="message-form"><input id="message-input" data-testid="message-input" name="body" placeholder="Message #general"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></div>
<div id="thread-panel" class="thread" data-testid="thread-panel" hidden><h3>Thread</h3><div id="thread-messages"></div><input data-testid="thread-input" name="thread_body" placeholder="Reply in thread"><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close thread</button></div></main></div>
<div id="create-channel-modal" class="panel" hidden><form data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create channel</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="panel" hidden><h3 data-testid="channel-settings-title">Channel settings</h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="panel" hidden><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div></div>
<form id="create-invitation-form" data-testid="create-invitation-form" hidden><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let token=localStorage.getItem('huddle.token'), me=null, ws=null, channel=null, channels=[];
const auth=$('[data-testid=auth-form]'), app=$('#app'), modal=$('#auth-modal');
function headers(){return {'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...headers(),...(opt.headers||{})}});let x={};try{x=await r.json()}catch(e){};return {r,x}}
function showAuth(){modal.hidden=false;app.hidden=true}
function showApp(){modal.hidden=true;app.hidden=false}
function authMode(){let signup=auth.dataset.mode==='signup';$('.signup-only').style.display=signup?'inline-flex':'none';$('[data-testid=auth-submit]').textContent=signup?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=signup?'Have an account? Log in':'Need an account? Sign up'}
async function load(){if(!token){showAuth();return}let m=await api('/api/auth/me');if(!m.r.ok){token=null;localStorage.removeItem('huddle.token');showAuth();return}me=m.x.user;showApp();$('[data-testid=current-user]').textContent=me.display_name||me.username;let q=await api('/api/workspaces');if(q.r.ok&&q.x.workspaces.length){ws=q.x.workspaces[0];await loadWorkspace()}else{$('[data-testid=workspace-create-form]').hidden=false}}
async function loadWorkspace(){let d=await api('/api/workspaces/'+ws.slug);if(!d.r.ok)return;channels=d.x.channels||[];renderChannels();if(channels.length)selectChannel(channels[0]);$('[data-testid=workspace-header]').textContent=ws.name}
function renderChannels(){let el=$('[data-testid=channel-list]');el.innerHTML='';channels.forEach(c=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='# '+c.name;b.onclick=()=>selectChannel(c);el.appendChild(b)})}
async function selectChannel(c){channel=c;$('[data-testid=channel-title]').textContent='# '+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let x=await api('/api/channels/'+c.id+'/messages');renderMessages(x.x.messages||[])}
function renderMessages(ms){let el=$('[data-testid=message-list]');el.innerHTML='';if(!ms.length){el.innerHTML='<div class="empty" data-testid="channel-empty-state">No messages yet. Start the conversation.</div>';return}ms.slice().reverse().forEach(renderMessage)}
function renderMessage(m){let el=document.createElement('div');el.className='message';el.dataset.testid='message';el.dataset.messageId=m.id;let tm=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});let author=m.author.display_name||m.author.username;el.innerHTML='<span data-testid="message-avatar" class="avatar">'+author[0]+'</span><b data-testid="message-author">'+author+'</b> <small data-testid="message-time">'+tm+'</small><div data-testid="message-body"></div><span data-testid="thread-reply-count">'+(m.reply_count||0)+(m.reply_count===1?' reply':' replies')+'</span><div class="toolbar"><button data-testid="open-thread-btn" data-button-role="secondary">Thread</button><button data-testid="reaction-button" data-button-role="secondary" aria-label="Add reaction">😊</button><button data-testid="message-edit-btn" data-button-role="secondary">Edit</button><button data-testid="message-delete-btn" data-button-role="danger">Delete</button></div><div class="reactions"></div>';el.querySelector('[data-testid=message-body]').textContent=m.body;if(m.edited_at){let z=document.createElement('span');z.dataset.testid='message-edited';z.textContent=' (edited)';el.querySelector('[data-testid=message-body]').append(z)}let rd=el.querySelector('.reactions');(m.reactions||[]).forEach(x=>{let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=x.emoji+' '+x.count;rd.append(c)});el.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{let panel=$('[data-testid=thread-panel]');panel.hidden=false;panel.dataset.parentId=m.id;let q=await api('/api/messages/'+m.id+'/replies');$('#thread-messages').innerHTML=(q.x.replies||[]).map(x=>'<div data-testid="message"><span data-testid="message-body">'+x.body+'</span></div>').join('')};el.querySelector('[data-testid=reaction-button]').onclick=()=>{let pick=document.createElement('div');pick.dataset.testid='emoji-picker';['👍','❤️','😂','🎉','🚀','✅','🔥','tada'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{let q=await api('/api/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});if(q.r.ok){rd.innerHTML='';q.x.reactions.forEach(x=>{let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=x.emoji+' '+x.count;rd.append(c)});pick.remove()}};pick.append(b)});el.append(pick)};let edit=el.querySelector('[data-testid=message-edit-btn]');edit.onclick=()=>{let inp=document.createElement('input');inp.dataset.testid='message-edit-input';inp.value=m.body;el.querySelector('[data-testid=message-body]').replaceChildren(inp);inp.focus();inp.onkeydown=async e=>{if(e.key==='Enter'){let q=await api('/api/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:inp.value})});if(q.r.ok)renderMessages([...(await api('/api/channels/'+channel.id+'/messages')).x.messages||[]])}if(e.key==='Escape')renderMessages([m])}};el.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/api/messages/'+m.id,{method:'DELETE'});el.remove()};$('[data-testid=message-list]').appendChild(el)}
$('[data-testid=thread-send]').onclick=async()=>{let panel=$('[data-testid=thread-panel]'),i=$('[data-testid=thread-input]');if(!i.value.trim())return;let q=await api('/api/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:Number(panel.dataset.parentId)})});if(q.r.ok){$('#thread-messages').innerHTML+='<div data-testid="message"><span data-testid="message-body">'+i.value+'</span></div>';i.value='';let all=(await api('/api/channels/'+channel.id+'/messages')).x.messages||[];renderMessages(all)}};
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
authMode();auth.querySelector('[data-testid=auth-toggle]').onclick=()=>{auth.dataset.mode=auth.dataset.mode==='signup'?'login':'signup';authMode()};
auth.onsubmit=async e=>{e.preventDefault();let b={username:auth.username.value,password:auth.password.value};if(auth.dataset.mode==='signup'){b.display_name=auth.display_name.value;if(b.password.length<8){$('[data-testid=auth-error]').textContent='Password must be at least 8 characters';return}}let q=await api(auth.dataset.mode==='signup'?'/api/auth/register':'/api/auth/login',{method:'POST',body:JSON.stringify(b)});if(!q.r.ok){$('[data-testid=auth-error]').textContent='Unable to '+(auth.dataset.mode==='signup'?'sign up':'log in')+' with those details';return}token=q.x.token;localStorage.setItem('huddle.token',token);load()};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;showAuth()};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=e.target,q=await api('/api/workspaces',{method:'POST',body:JSON.stringify({slug:f.slug.value,name:f.name.value})});if(q.r.ok){ws=q.x.workspace;f.hidden=true;await loadWorkspace()}};
$('[data-testid=new-channel-btn]').onclick=()=>{$('#create-channel-modal').hidden=false};
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true;
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=e.target,n=f.name.value.trim().toLowerCase().replace(/\s+/g,'-');let q=await api('/api/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('#create-channel-private').checked})});if(!q.r){$('[data-testid=create-channel-error]').textContent='A channel with that name already exists';return}if(q.r.ok){channels.push(q.x.channel);renderChannels();$('#create-channel-modal').hidden=true;selectChannel(q.x.channel)}else{let z=document.createElement('div');z.dataset.testid='create-channel-error';z.textContent='A channel with that name already exists';f.append(z)}};
$('#message-form').onsubmit=async e=>{e.preventDefault();let i=$('#message-input');if(!i.value.trim()||!channel)return;let q=await api('/api/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});if(q.r.ok){i.value='';renderMessages([...(await api('/api/channels/'+channel.id+'/messages')).x.messages||[]])}};
load();
</script></body></html>
