<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px Arial;color:#1d1c1d}[hidden]{display:none!important}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}input,select{padding:9px;border:1px solid #bbb;border-radius:4px;margin:3px}.primary,[data-button-role=primary]{background:#007a5a;color:#fff}.danger,[data-button-role=danger]{background:#e01e5a;color:#fff}.secondary,[data-button-role=secondary]{background:#1264a3;color:#fff}.modal{position:fixed;z-index:4;background:white;border:1px solid #aaa;border-radius:8px;padding:25px;box-shadow:0 5px 25px #777}.auth{inset:20% 35%;min-width:330px}#create-channel-modal{top:12%;left:30%;right:30%;max-width:520px}#create-channel-submit{display:inline-block!important;visibility:visible!important;opacity:1!important}.app{display:flex;height:100vh}.sidebar{width:255px;background:#3f0e40;color:white;padding:18px;overflow:auto}.sidebar h1{margin-top:0}.content{flex:1;display:flex;flex-direction:column;min-width:0}.head{padding:16px 24px;border-bottom:1px solid #ddd}.messages{flex:1;overflow:auto;padding:18px 25px}.composer{border-top:1px solid #ddd;padding:14px;display:flex}.composer input{flex:1}.channel-entry{display:block;width:100%;text-align:left;background:transparent;color:#fff;margin:3px 0}.message{padding:12px 4px;border-bottom:1px solid #eee}.message-avatar{display:inline-block;width:30px;height:30px;border-radius:50%;background:#1264a3;color:white;text-align:center;padding-top:7px;margin-right:8px}.message-author{font-weight:bold}.message-time{color:#777;font-size:12px}.toolbar{float:right}.thread{width:350px;border-left:1px solid #ddd;padding:15px}.error{color:#b00020;min-height:22px}.empty{padding:30px;color:#666}
</style></head><body>
<div id="auth-modal" class="modal auth"><form data-testid="auth-form" data-mode="signup"><h2 id="auth-heading">Create your Huddle account</h2><label>Username <input name="username" placeholder="Username" required></label><br><label>Password <input name="password" type="password" placeholder="Password (8+ characters)" required></label><br><label class="display-field">Display name <input name="display_name" placeholder="Display name"></label><br><button data-testid="auth-submit" data-button-role="primary">Sign up</button> <button type="button" data-testid="auth-toggle" data-button-role="secondary">Have an account? Log in</button><div data-testid="auth-error" id="auth-error" class="error"></div></form></div>
<div id="app-shell" hidden><div class="app"><aside class="sidebar" data-testid="sidebar"><h1>Huddle</h1><div data-testid="current-user"></div><h3>Channels</h3><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="create-invitation-btn" data-button-role="secondary">Invite member</button><button data-testid="logout-btn" data-button-role="danger">Log out</button><form data-testid="workspace-create-form" hidden><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button><button type="button" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form" hidden><input name="code" placeholder="Invitation code"><button data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div data-testid="join-workspace-error" class="error"></div></form></aside><main class="content"><div class="head"><h2 data-testid="workspace-header">Workspace</h2><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary" hidden>Channel settings</button></div><div style="display:flex;flex:1;min-height:0"><section class="messages"><div data-testid="message-list"></div><div class="composer"><input data-testid="message-input" placeholder="Write a message"><button data-testid="send-btn" data-button-role="primary">Send</button></div></section><section data-testid="thread-panel" class="thread" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><div>Thread</div><input data-testid="thread-input" placeholder="Reply"><button data-testid="thread-send" data-button-role="primary">Reply</button></section></div></main></div></div>
<div id="create-channel-modal" class="modal" style="display:none"><form data-testid="create-channel-form"><h2>Create channel</h2><input name="name" placeholder="channel name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><div data-testid="create-channel-error" class="error"></div><button type="submit" data-testid="create-channel-submit" data-button-role="primary" style="display:inline-block">Create channel</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><h2 data-testid="channel-settings-title">Channel settings</h2><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal" hidden><h2>Workspace settings</h2><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div></div>
<form id="create-invitation-form" data-testid="create-invitation-form" hidden><input name="invited_username"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"></div>
<script>
const $=s=>document.querySelector(s), A='/api';let token=localStorage.getItem('huddle.token'),user,ws,channel,mode=true;
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},opt.headers||{});let r=await fetch(A+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
function showApp(){ $('#auth-modal').hidden=true;$('#app-shell').hidden=false;$('[data-testid=current-user]').textContent=user.display_name||user.username;loadWorkspaces()}
async function loadWorkspaces(){let x=(await api('/workspaces')).workspaces;if(!x.length){$('[data-testid=workspace-create-form]').hidden=false;return}ws=x[0];$('[data-testid=workspace-header]').textContent=ws.name;let d=await api('/workspaces/'+ws.slug);renderChannels(d.channels);if(d.channels[0])selectChannel(d.channels[0])}
function renderChannels(cs){let box=$('[data-testid=channel-list]');box.innerHTML='';cs.forEach(c=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='# '+c.name;b.onclick=()=>selectChannel(c);box.append(b)})}
async function selectChannel(c){channel=c;$('[data-testid=channel-title]').textContent='# '+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let d=await api('/channels/'+c.id+'/messages');renderMessages(d.messages)}
function renderMessages(ms){let box=$('[data-testid=message-list]');box.innerHTML='';if(!ms.length){box.innerHTML='<div class="empty" data-testid="channel-empty-state">No messages yet. Start the conversation.</div>';return}ms.slice().reverse().forEach(renderMessage)}
function renderMessage(m){let box=$('[data-testid=message-list]'),e=document.createElement('div');e.className='message';e.dataset.testid='message';e.dataset.messageId=m.id;let t=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});let author=m.author.display_name||m.author.username;e.innerHTML='<span class="message-avatar" data-testid="message-avatar">'+author[0].toUpperCase()+'</span><span class="message-author" data-testid="message-author">'+author+'</span> <span class="message-time" data-testid="message-time">'+t+'</span><div data-testid="message-body"></div><span class="toolbar"><button data-testid="open-thread-btn" class="secondary">Thread</button> <button data-testid="reaction-button" class="secondary" aria-label="Add reaction">😀</button> <button data-testid="message-edit-btn" class="secondary">Edit</button> <button data-testid="message-delete-btn" class="danger">Delete</button></span>';e.querySelector('[data-testid=message-body]').textContent=m.body;if(m.reply_count)e.innerHTML+='<span data-testid="thread-reply-count">'+m.reply_count+' '+(m.reply_count==1?'reply':'replies')+'</span>';if(m.edited_at)e.innerHTML+='<span data-testid="message-edited"> edited</span>';let chips=document.createElement('div');(m.reactions||[]).forEach(r=>{let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=r.emoji+' '+r.count;c.className='reaction-chip';chips.append(c)});e.append(chips);let edit=e.querySelector('[data-testid=message-edit-btn]');edit.onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;e.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async ev=>{if(ev.key==='Enter'){let j=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});e.remove();renderMessage(j.message)}if(ev.key==='Escape')renderMessage(m)}};
e.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});e.remove()};
e.querySelector('[data-testid=open-thread-btn]').onclick=async()=>{let panel=$('[data-testid=thread-panel]');panel.hidden=false;panel.dataset.parentId=m.id;let r=await api('/messages/'+m.id+'/replies');panel.querySelectorAll('.thread-message').forEach(x=>x.remove());r.replies.forEach(x=>{let q=document.createElement('div');q.className='thread-message message';q.dataset.testid='message';q.dataset.messageId=x.id;q.innerHTML='<span class="message-avatar" data-testid="message-avatar">'+(x.author.display_name||x.author.username)[0].toUpperCase()+'</span><span data-testid="message-author">'+(x.author.display_name||x.author.username)+'</span><div data-testid="message-body"></div>';q.querySelector('[data-testid=message-body]').textContent=x.body;panel.insertBefore(q,panel.querySelector('[data-testid=thread-input]'))})};
e.querySelector('[data-testid=reaction-button]').onclick=()=>{let old=e.querySelector('[data-testid=emoji-picker]');if(old){old.remove();return}let picker=document.createElement('div');picker.dataset.testid='emoji-picker';picker.className='emoji-picker';['😀','👍','❤️','🎉','😂','🚀','✅','👏'].forEach(em=>{let o=document.createElement('button');o.dataset.testid='emoji-option';o.className='emoji-option';o.textContent=em;o.onclick=async()=>{let j=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:em})});picker.remove();e.querySelectorAll('[data-testid=reaction-chip]').forEach(x=>x.remove());j.reactions.forEach(r=>{let c=document.createElement('span');c.dataset.testid='reaction-chip';c.textContent=r.emoji+' '+r.count;c.className='reaction-chip';e.append(c)})};picker.append(o)});e.append(picker)};
box.append(e)}
$('[data-testid=close-thread]').onclick=()=>{$('[data-testid=thread-panel]').hidden=true};
$('[data-testid=thread-send]').onclick=async()=>{let p=$('[data-testid=thread-panel]'),i=$('[data-testid=thread-input]'),v=i.value;if(!v.trim())return;let j=await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:v,parent_id:Number(p.dataset.parentId)})});let q=document.createElement('div');q.className='thread-message message';q.dataset.testid='message';q.dataset.messageId=j.message.id;q.innerHTML='<span class="message-avatar" data-testid="message-avatar">'+(j.message.author.display_name||j.message.author.username)[0].toUpperCase()+'</span><span data-testid="message-author">'+(j.message.author.display_name||j.message.author.username)+'</span><div data-testid="message-body"></div>';q.querySelector('[data-testid=message-body]').textContent=j.message.body;p.insertBefore(q,i);i.value='';let parent=document.querySelector('[data-message-id="'+p.dataset.parentId+'"]');if(parent){let n=parent.querySelector('[data-testid=thread-reply-count]');if(!n){n=document.createElement('span');n.dataset.testid='thread-reply-count';parent.append(n)}let count=j.message.parent_id;let current=Number((n.textContent.match(/\\d+/)||[0])[0])+1;n.textContent=current+' '+(current==1?'reply':'replies')}};
$('[data-testid=auth-toggle]').onclick=()=>{mode=!mode;$('[data-testid=auth-form]').dataset.mode=mode?'signup':'login';$('#auth-heading').textContent=mode?'Create your Huddle account':'Log in to Huddle';$('[data-testid=auth-submit]').textContent=mode?'Sign up':'Log in';$('[data-testid=auth-toggle]').textContent=mode?'Have an account? Log in':'Need an account? Sign up';$('.display-field').hidden=!mode}
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();$('[data-testid=auth-error]').textContent='';let f=Object.fromEntries(new FormData(e.target));try{let j=await api(mode?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify(f)});token=j.token;localStorage.setItem('huddle.token',token);user=j.user;showApp()}catch(x){$('[data-testid=auth-error]').textContent=x.message}}
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));try{let j=await api('/workspaces',{method:'POST',body:JSON.stringify(f)});ws=j.workspace;$('[data-testid=workspace-create-form]').hidden=true;$('[data-testid=workspace-header]').textContent=ws.name;renderChannels([j.general_channel]);selectChannel(j.general_channel)}catch(x){$('[data-testid=join-workspace-error]').textContent=x.message}}
$('[data-testid=new-channel-btn]').onclick=()=>{const m=$('#create-channel-modal');m.style.display='block';m.removeAttribute('hidden');m.querySelector('[data-testid=create-channel-submit]').style.display='inline-block'}
$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let n=e.target.name.value.trim().toLowerCase().replace(/[ \t]+/g,'-');try{let j=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name:n,is_private:$('[data-testid=create-channel-private]').checked})});let cs=(await api('/workspaces/'+ws.slug)).channels;renderChannels(cs);$('#create-channel-modal').style.display='none';selectChannel(j.channel)}catch(x){$('[data-testid=create-channel-error]').textContent='A channel with that name already exists or is invalid.'}}
$('[data-testid=send-btn]').onclick=send;$('[data-testid=message-input]').onkeydown=e=>{if(e.key==='Enter')send()};async function send(){let i=$('[data-testid=message-input]'),v=i.value;if(!v.trim())return;let j=await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:v})});i.value='';let box=$('[data-testid=message-list]');box.querySelector('.empty')?.remove();renderMessage(j.message)}
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()}
async function boot(){if(!token)return;try{user=(await api('/auth/me')).user;showApp()}catch{localStorage.removeItem('huddle.token')}}boot()
</script></body></html>
