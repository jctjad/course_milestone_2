<!doctype html><html><head><meta charset=utf-8><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#243447;background:#f8fafc}[hidden]{display:none!important}
button{border:0;border-radius:4px;padding:9px 14px;cursor:pointer;color:#fff}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}
input{padding:10px;border:1px solid #ccd5df;border-radius:4px}label{display:block;margin:8px 0 3px;font-weight:bold}.auth{max-width:400px;margin:80px auto;background:white;padding:30px;border-radius:8px;box-shadow:0 2px 12px #ccd}.auth input{width:100%}.error{color:#b00035;margin:10px 0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#182b49;color:#fff;padding:20px}.sidebar button{margin:5px 0}.channel-entry{display:block;width:100%;text-align:left;background:transparent;color:#e5edf8;padding:9px}.channel-entry:hover,.channel-entry.active{background:#31547e}.main{display:flex;flex-direction:column}.header{background:#fff;padding:20px;border-bottom:1px solid #ddd}.content{display:flex;flex:1}.messages{padding:20px;flex:1;max-width:850px}.message{background:white;padding:12px;margin:9px 0;border-radius:6px;position:relative;box-shadow:0 1px 2px #ddd}.message-avatar{display:inline-flex;width:30px;height:30px;background:#36a269;color:#fff;align-items:center;justify-content:center;border-radius:4px;margin-right:8px}.message-author{font-weight:bold}.message-time{color:#789;font-size:12px;margin-left:8px}.toolbar{float:right;display:none}.toolbar button{background:#eef2f7;color:#18324d;border:1px solid #9aaabd;padding:5px 8px}.message:hover .toolbar{display:block}.composer{display:flex;gap:8px;margin-top:20px}.composer input{flex:1}.thread{width:330px;background:#fff;border-left:1px solid #ddd;padding:18px}.chip{display:inline-block;padding:4px 8px;background:#e9f3ff;border-radius:12px;margin:5px 3px}.modal{position:fixed;inset:20% 35%;background:white;padding:25px;box-shadow:0 3px 20px #555;z-index:5}
</style></head><body>
<section id=auth-modal class=auth><form data-testid=auth-form data-mode=signup><h1>Huddle</h1><div data-testid=auth-error class=error hidden></div><label>Username<input name=username placeholder=Username required></label><label>Password<input name=password type=password placeholder=Password required></label><label class=signup-only>Display name<input name=display_name placeholder="Display name"></label><button data-testid=auth-submit data-button-role=primary>Sign up</button> <button type=button data-testid=auth-toggle data-button-role=secondary>Have an account? Log in</button></form></section>
<div class=app hidden><aside data-testid=sidebar class=sidebar><h2 data-testid=workspace-header>Workspace</h2><div data-testid=current-user></div><button data-testid=logout-btn data-button-role=danger>Log out</button><div data-testid=channel-list></div><div data-testid=dms-list></div><button data-testid=new-channel-btn data-button-role=secondary>New channel</button><form data-testid=workspace-create-form hidden><label>Workspace slug<input name=slug></label><label>Workspace name<input name=name></label><button data-testid=workspace-create-submit data-button-role=primary>Create workspace</button></form><button data-testid=empty-state-create-workspace hidden>Create your first workspace</button><form data-testid=join-workspace-form hidden><input name=slug><button data-testid=join-workspace-submit data-button-role=primary>Join workspace</button><span data-testid=join-workspace-error></span></form></aside>
<main class=main><header class=header><h2 data-testid=channel-title>#general</h2><span data-testid=channel-topic></span><button data-testid=channel-settings-btn data-button-role=secondary>Channel settings</button><button data-testid=workspace-settings-btn data-button-role=secondary>Workspace settings</button></header><div class=content><section data-testid=message-list class=messages><div data-testid=channel-empty-state hidden>No messages yet — start the conversation.</div></section><aside data-testid=thread-panel class=thread hidden><button data-testid=close-thread data-button-role=secondary>Close thread</button><h3>Thread</h3><div id=thread-messages></div><input data-testid=thread-input placeholder="Reply in thread"><button data-testid=thread-send data-button-role=primary>Reply</button></aside></div><div class=composer><input data-testid=message-input placeholder="Message #general"><button data-testid=send-btn data-button-role=primary>Send</button></div></main></div>
<div id=create-channel-modal class=modal hidden><form data-testid=create-channel-form><h3>Create channel</h3><div data-testid=create-channel-error class=error></div><label>Channel name<input name=name placeholder="Channel name"></label><label><input id=create-channel-private data-testid=create-channel-private type=checkbox> Private</label><button data-testid=create-channel-submit data-button-role=primary>Create</button><button type=button data-testid=create-channel-cancel data-button-role=secondary>Cancel</button></form></div>
<div id=channel-settings-modal class=modal hidden><h3 data-testid=channel-settings-title>Channel settings</h3><input data-testid=channel-topic-input><button data-testid=channel-topic-submit data-button-role=primary>Save topic</button><button data-testid=channel-settings-close data-button-role=secondary>Close</button><div data-testid=channel-members-list></div><form data-testid=channel-add-member-form><input data-testid=channel-add-member-input><button data-testid=channel-add-member-submit data-button-role=primary>Add member</button></form><button data-testid=archive-channel-btn data-button-role=danger>Archive</button><button data-testid=unarchive-channel-btn data-button-role=secondary>Unarchive</button></div>
<div id=workspace-settings-modal class=modal hidden><input data-testid=workspace-name-input><select data-testid=workspace-join-mode><option>open</option></select><button data-testid=workspace-general-submit data-button-role=primary>Save</button><button data-testid=workspace-settings-close data-button-role=secondary>Close</button><button data-testid=settings-tab-members>Members</button><button data-testid=settings-tab-invitations>Invitations</button><button data-testid=settings-tab-general>General</button><div data-testid=settings-pane-members></div><div data-testid=settings-pane-invitations><button data-testid=create-invitation-btn data-button-role=secondary>Create invitation</button><form id=create-invitation-form data-testid=create-invitation-form><button data-testid=create-invitation-submit data-button-role=primary>Create</button></form><div data-testid=invitations-list></div></div><div data-testid=settings-pane-general></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);let token=localStorage.getItem('huddle.token'),me,work,channel,editing=null;
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{},token?{Authorization:'Bearer '+token}:{});let r=await fetch('/api'+path,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
function showApp(){ $('#auth-modal').hidden=true;$('.app').hidden=false; if(me)$('[data-testid=current-user]').textContent=me.display_name||me.username; load()}
async function load(){try{let x=await api('/auth/me');me=x.user;let z=await api('/workspaces');if(z.workspaces?.length){work=z.workspaces[0];await refresh()}else{$('[data-testid=workspace-create-form]').hidden=false;$('#empty-state-create-workspace').hidden=false;return}}catch(e){return}}
async function refresh(){if(!work)return;let x=await api('/workspaces/'+work.slug);work=x.workspace;$('[data-testid=workspace-header]').textContent=work.name;let list=$('[data-testid=channel-list]');list.innerHTML='';x.channels.forEach(c=>{let b=document.createElement('button');b.className='channel-entry';b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>select(c);list.append(b)});select(channel||x.channels[0])}
async function select(c){if(!c)return;channel=c;$('[data-testid=channel-title]').textContent='#'+c.name;$('[data-testid=channel-topic]').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');let ml=$('[data-testid=message-list]');ml.querySelectorAll('.message').forEach(x=>x.remove());$('[data-testid=channel-empty-state]').hidden=x.messages.length>0;x.messages.reverse().forEach(m=>render(m))}
function render(m,target){target=target&&target.append?target:$('[data-testid=message-list]');let d=document.createElement('div');d.className='message';d.dataset.testid='message';d.dataset.messageId=m.id;d.innerHTML='<span class=message-avatar data-testid=message-avatar>'+m.author.display_name[0]+'</span><span data-testid=message-author class=message-author>'+m.author.display_name+'</span><span data-testid=message-time class=message-time>'+new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'</span><div data-testid=message-body class=message-body></div><span data-testid=thread-reply-count></span><div class=toolbar><button data-testid=open-thread-btn>Thread</button><button data-testid=reaction-button>😀</button><button data-testid=message-edit-btn>Edit</button><button data-testid=message-delete-btn>Delete</button></div><div class=reactions></div>';d.querySelector('.message-body').textContent=m.body;if(m.edited_at)d.innerHTML+='<small data-testid=message-edited> edited</small>';if(m.reply_count)d.querySelector('[data-testid=thread-reply-count]').textContent=m.reply_count+' replies';m.reactions.forEach(r=>{let z=document.createElement('span');z.className='chip';z.dataset.testid='reaction-chip';z.textContent=r.emoji+' '+r.count;d.querySelector('.reactions').append(z)});d.querySelector('[data-testid=message-edit-btn]').onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;d.querySelector('.message-body').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});select(channel)}}};d.querySelector('[data-testid=message-delete-btn]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});d.remove()};d.querySelector('[data-testid=open-thread-btn]').onclick=()=>openThread(m,d);d.querySelector('[data-testid=reaction-button]').onclick=()=>{let p=document.createElement('div');p.dataset.testid='emoji-picker';['😀','👍','❤️','🎉','🚀','😂','✅','🔥'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();select(channel)};p.append(b)});d.append(p)};target.append(d)}
async function openThread(m,d){let p=$('[data-testid=thread-panel]');p.hidden=false;let x=await api('/messages/'+m.id+'/replies');$('#thread-messages').innerHTML='';x.replies.forEach(r=>render(r,document.getElementById('thread-messages')));$('[data-testid=thread-send]').onclick=async()=>{let i=$('[data-testid=thread-input]');if(i.value.trim())await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:m.id})});i.value='';openThread(m,d);select(channel)}}
$('[data-testid=auth-toggle]').onclick=()=>{let f=$('[data-testid=auth-form]');let s=f.dataset.mode==='signup';f.dataset.mode=s?'login':'signup';$('.signup-only').hidden=s;$('[data-testid=auth-submit]').textContent=s?'Log in':'Sign up';$('[data-testid=auth-toggle]').textContent=s?'Need an account? Sign up':'Have an account? Log in'};
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/auth/'+(e.target.dataset.mode==='signup'?'register':'login'),{method:'POST',body:JSON.stringify(Object.fromEntries(f))});token=x.token;localStorage.setItem('huddle.token',token);me=x.user;showApp()}catch(x){$('[data-testid=auth-error]').hidden=false;$('[data-testid=auth-error]').textContent=x.message}};
$('[data-testid=logout-btn]').onclick=()=>{localStorage.removeItem('huddle.token');token=null;location.reload()};
$('[data-testid=workspace-create-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),x=await api('/workspaces',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});work=x.workspace;await refresh();if(x.channel){await select(x.channel)}};
$('[data-testid=new-channel-btn]').onclick=()=>$('#create-channel-modal').hidden=false;$('[data-testid=create-channel-cancel]').onclick=()=>$('#create-channel-modal').hidden=true;
$('[data-testid=create-channel-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let x=await api('/workspaces/'+work.slug+'/channels',{method:'POST',body:JSON.stringify({name:f.get('name'),is_private:$('#create-channel-private').checked})});$('#create-channel-modal').hidden=true;await refresh();if(x.channel)await select(x.channel)}catch(x){$('[data-testid=create-channel-error]').textContent=x.message}};
$('[data-testid=send-btn]').onclick=async()=>{let i=$('[data-testid=message-input]');if(i.value.trim()){await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';select(channel)}};
$('[data-testid=close-thread]').onclick=()=>$('[data-testid=thread-panel]').hidden=true;
if(token)showApp();
</script></body></html>
